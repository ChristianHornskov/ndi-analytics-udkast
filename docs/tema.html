<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Tema · NDI Analytics</title>
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <link rel="stylesheet" href="css/ndi.css">
 <!-- og:start -->
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Tema · NDI Analytics">
 <meta property="og:description" content="Vælg et tema herunder.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/tema.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta property="og:image:width" content="1200">
 <meta property="og:image:height" content="630">
 <meta property="og:image:alt" content="NDI Analytics - udkast. Gå på opdagelse i porteføljen.">
 <meta name="twitter:card" content="summary_large_image">
 <!-- og:end -->
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html?view=udforsk">← Udforsk</a><a class="hide-sm" href="temaer.html">Alle temaer</a><a class="hide-sm" href="vaerdikaede.html">Værdikæde</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter tema…</p></main>
 <footer class="site-footer">
 <p>Udkast / noindex. Segmenter viser eksponering, ikke en anbefaling. Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast.</p>
 <p data-kid-footer></p>
 </footer>
 <script type="module">
 import { loadAll, fundById, fmtDate, daTheme, WARN_HIST, findTheme, tagsFor, fillKidFooter, chainForTheme, chainHref, searchPosition } from './js/data.js';
 const u = new URL(location.href);
 const key = u.searchParams.get('slug') || 'chips';
 const fundId = u.searchParams.get('fund') || 'pmindi';
 const onlyLens = u.searchParams.get('linse') === '1';
 // Samme whitelist som screener/A-Z: kun navn/vægt (tema er fast her) og temastatus. Ingen tal pr. aktie.
 const SORTS = { weight: 'Vægt', name: 'Navn A-Z' };
 const sort = SORTS[u.searchParams.get('sort')] ? u.searchParams.get('sort') : 'weight';
 const STATUSES = { forslag: 'Kun temaforslag', fast: 'Uden temaforslag' };
 const status = STATUSES[u.searchParams.get('status')] ? u.searchParams.get('status') : '';
 const qRaw = (u.searchParams.get('q') || '').trim();
 const [data, td, vc, um] = await Promise.all([loadAll(), fetch('data/themes.json').then((r) => r.json()),
 fetch('data/value-chains.json').then((r) => r.json()).catch(() => ({ chains: [] })),
 fetch('data/unique-metrics.json').then((r) => r.json()).catch(() => ({ byIsin: {} }))]);
 // NDI-linse: kun kvalitativ tekst (hvad ejer man, plads i kæden). Ingen tal pr. aktie.
 const lensOf = (p) => (um.byIsin || {})[p.isin];
 const lensOwn = (p) => ((lensOf(p)?.metrics || []).find((m) => m.label === 'Hvad ejer man?') || {}).value || '';
 fillKidFooter();
 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
 const w = (x) => (x || 0).toFixed(2).replace('.', ',');
 const main = document.getElementById('main');
 const theme = findTheme(td.themes, key);

 if (!theme) {
 main.innerHTML = `<a class="back" href="temaer.html">← Alle temaer</a>
 <h1>Temaet findes ikke</h1><p class="lede">Vælg et tema herunder.</p>
 <p class="link-row">${td.themes.map((t) => `<a class="tag" href="tema.html?slug=${t.slug}&fund=${fundId}">${esc(t.title)}</a>`).join(' ')}</p>`;
 } else {
 // Selskaber beregnes fra den forsinkede beholdning (primært tema + manuelle multi-tags), ikke themes.json-udsnittet
 const fund = fundById(data.portfolio, fundId);
 const tk = theme.themeKey;
 const list = fund.positions
 .filter((p) => tagsFor(p, data.multiTags).includes(tk))
 .sort((a, b) => (b.weight || 0) - (a.weight || 0));
 const sum = list.reduce((s, p) => s + (p.weight || 0), 0);
 const nLens = list.filter(lensOf).length;
 // Filtre i rækkefølge: søgning → temastatus → NDI-linse (samme som A-Z), så tomme tilstande kan forklare hvilket filter der tømte listen
 const hits = new Map();
 const matchQ = qRaw ? list.filter((p) => { const h = searchPosition(p, qRaw, data.multiTags, um.byIsin); if (h) hits.set(p.isin, h); return !!h; }) : list;
 const isForslag = (p) => p.themeStatus === 'forslag';
 const nForslagQ = matchQ.filter(isForslag).length;
 const matchS = status ? matchQ.filter((p) => (status === 'forslag') === isForslag(p)) : matchQ;
 const nLensS = matchS.filter(lensOf).length;
 const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'da');
 const shown = (onlyLens ? matchS.filter(lensOf) : matchS).slice().sort(sort === 'name' ? byName : (a, b) => (b.weight || 0) - (a.weight || 0) || byName(a, b));
 const filtered = !!(qRaw || status || onlyLens);
 const nViaLens = shown.filter((p) => hits.get(p.isin)?.via === 'linse').length;
 const nMulti = list.filter((p) => p.theme !== tk).length;
 const temaHref = (o = {}) => {
 const q = new URLSearchParams({ slug: theme.slug, fund: o.fund || fund.id });
 if (o.linse ?? onlyLens) q.set('linse', '1');
 const st = o.status ?? status; if (st) q.set('status', st);
 const so = o.sort ?? sort; if (so !== 'weight') q.set('sort', so);
 const qq = o.q ?? qRaw; if (qq) q.set('q', qq);
 return `tema.html?${q}`;
 };
 // Screeneren forstår samme tags/q/linse/status/sort
 const screenerHref = (() => {
 const q = new URLSearchParams({ view: 'udforsk', fund: fund.id, tags: tk });
 if (qRaw) q.set('q', qRaw);
 if (onlyLens) q.set('linse', '1');
 if (status) q.set('status', status);
 if (sort !== 'weight') q.set('sort', sort);
 return `index.html?${q}`;
 })();
 const hitNote = (p) => {
 const h = hits.get(p.isin);
 if (h?.via === 'linse') return `<br><small style="color:var(--muted)">Match i NDI-linsen · ${esc(h.label)}: ${esc(h.value)}</small>`;
 if (h?.via === 'tema' && p.theme !== tk && h.value !== theme.title) return `<br><small style="color:var(--muted)">Match på tema-tag: ${esc(h.value)}</small>`;
 return '';
 };
 const nProp = tk === 'andet' ? 0 : list.filter((p) => p.theme === tk && p.themeStatus === 'forslag').length;
 // Hvor kom forslagene fra? (themeFrom i portfolio.json; mangler = Andet)
 const fromCounts = {};
 for (const p of list) if (p.theme === tk && p.themeStatus === 'forslag') { const f0 = p.themeFrom || 'andet'; fromCounts[f0] = (fromCounts[f0] || 0) + 1; }
 const fromTxt = Object.keys(fromCounts).length ? ' Før forslaget: ' + Object.entries(fromCounts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${n} i ${esc(k === 'andet' ? 'Andet' : daTheme(k))}`).join(', ') + '.' : '';
 const posAsOf = fmtDate(fund.positionsAsOf || td.positionsAsOf);
 const keyToSlug = Object.fromEntries(td.themes.map((t) => [t.title.toLowerCase(), t.slug]));
 const chain = (theme.chain || []).map((c) => {
 const slug = keyToSlug[c.toLowerCase()] || (td.themes.find((t) => t.title.toLowerCase().startsWith(c.toLowerCase())) || {}).slug;
 const cur = c.toLowerCase() === theme.title.toLowerCase() || slug === theme.slug;
 return slug && !cur ? `<a class="tag" href="tema.html?slug=${slug}&fund=${fundId}">${esc(c)}</a>` : `<span class="tag ${cur ? 'accent' : ''}">${esc(c)}</span>`;
 }).join(' <span aria-hidden="true">→</span> ');
 const vchain = chainForTheme(vc.chains, tk);
 const others = td.themes.filter((t) => t.slug !== theme.slug);
 const rows = shown.map((p) => {
 const multi = p.theme !== tk;
 return `<tr>
 <td><a href="selskab.html?isin=${encodeURIComponent(p.isin)}&fund=${fund.id}">${esc(p.name)}</a>${multi ? ` <span class="tag" title="Primært tema: ${esc(daTheme(p.theme))}">også ${esc(daTheme(p.theme))}</span>` : ''}${!multi && p.themeStatus === 'forslag' && tk !== 'andet' ? ` <span class="badge badge-draft" title="Forslag, afventer gennemgang${p.themeFrom && p.themeFrom !== 'andet' ? ` · før: ${esc(daTheme(p.themeFrom))}` : ' · før: Andet'}">forslag</span>` : ''}${lensOf(p) ? ` <a class="badge" href="selskab.html?isin=${encodeURIComponent(p.isin)}&fund=${fund.id}#ndi-linse" title="Kvalitativ NDI-linse: rolle, plads i værdikæden og forhold at holde øje med (udkast)" aria-label="NDI-linse for ${esc(p.name)}">NDI-linse</a>` : ''}${hitNote(p)}</td>
 <td class="hide-sm-cell">${p.role ? esc(p.role) : lensOwn(p) ? `${esc(lensOwn(p))} <small style="color:var(--muted)" title="Fra NDI-linsen, AI-udkast der afventer NDI-gennemgang">(linse, udkast)</small>` : '<span style="color:var(--muted)">–</span>'}</td>
 <td>${w(p.weight)}</td>
 </tr>`;
 }).join('');
 document.title = `${theme.title} · NDI Analytics`;
 main.innerHTML = `
 <a class="back" href="index.html?view=udforsk&fund=${fund.id}&tags=${encodeURIComponent(tk)}">← Screener: ${esc(theme.title)}</a>
 <p class="eyebrow">NDI-TEMA</p>
 <h1>${esc(theme.title)}</h1>
 <p class="lede">${esc(theme.problem)}</p>
 <div class="fund-switch" role="group" aria-label="Andelsklasse">
 ${data.portfolio.funds.map((f) => `<a class="control ${f.id === fund.id ? 'active' : ''}" ${f.id === fund.id ? 'aria-current="true"' : ''} href="${temaHref({ fund: f.id })}">${esc(f.short)}</a>`).join('')}
 </div>
 <div class="metrics" style="margin-top:14px">
 <div class="metric"><div class="label">Selskaber i temaet</div><strong>${list.length}</strong><small>${nMulti ? `${list.length - nMulti} med temaet som primært + ${nMulti} via multi-tag · ` : ''}${esc(fund.short)} · beholdning pr. ${posAsOf} (forsinket)</small></div>
 <div class="metric"><div class="label">Samlet vægt</div><strong>ca. ${w(sum)} %</strong><small>Inkl. selskaber med flere temaer</small></div>
 <div class="metric"><div class="label">Med NDI-linse</div><strong>${nLens} af ${list.length}</strong><small>Kvalitativ beskrivelse (udkast), ikke en rating</small></div>
 </div>
 <p class="band">Temaet viser <strong>eksponering</strong> i fondens forsinkede beholdning. Ikke en anbefaling eller en bevidst overvægt.</p>

 ${theme.chain?.length || vchain ? `<section class="panel">
 <h2 class="panel-h brand">Plads i værdikæden</h2>
 <p class="chain-row">${chain}</p>
 <p class="link-row" style="margin-top:12px">${vchain ? `<a class="outline-btn small" href="${chainHref(tk)}">Værdikæden "${esc(vchain.title)}" →</a> ` : ''}<a class="outline-btn small" href="vaerdikaede.html">Enkel AI-kæde →</a></p>
 </section>` : ''}

 <section class="panel">
 <h2 class="panel-h">Selskaber i forsinket beholdning</h2>
 <form method="get" role="search" style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">
 <input type="hidden" name="slug" value="${esc(theme.slug)}"><input type="hidden" name="fund" value="${esc(fund.id)}">
 ${sort !== 'weight' ? `<input type="hidden" name="sort" value="${sort}">` : ''}${onlyLens ? '<input type="hidden" name="linse" value="1">' : ''}${status ? `<input type="hidden" name="status" value="${status}">` : ''}
 <input name="q" type="search" value="${esc(qRaw)}" aria-label="Søg i temaets selskaber" placeholder="Søg i ${esc(theme.title)}: navn, ticker eller fx “${tk === 'energy-resources' ? 'kobber' : tk === 'space' ? 'satellit' : tk === 'energy' ? 'sol' : 'foundry'}”…" style="flex:1;min-width:200px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)">
 <button class="cta" type="submit">Søg</button>
 </form>
 <div class="filters" role="group" aria-label="Sortér og filtrér" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
 <small style="color:var(--muted)">Sortér:</small>${Object.entries(SORTS).map(([k, label]) => `<a class="control${k === sort ? ' active' : ''}" ${k === sort ? 'aria-current="true"' : ''} href="${esc(temaHref({ sort: k }))}" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">${label}</a>`).join('')}
 ${nLens ? `<a class="control${onlyLens ? ' active' : ''}" ${onlyLens ? 'aria-current="true"' : ''} href="${esc(temaHref({ linse: !onlyLens }))}" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit;margin-left:8px" title="Vis kun selskaber med kvalitativ NDI-linse">Kun med NDI-linse (${nLensS})</a>` : ''}
 ${nProp || status ? Object.entries(STATUSES).map(([k, label]) => `<a class="control${status === k ? ' active' : ''}" ${status === k ? 'aria-current="true"' : ''} href="${esc(temaHref({ status: status === k ? '' : k }))}" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit${k === 'forslag' ? ';margin-left:8px' : ''}" title="Filtrér på om temaet er et forslag fra udkastet">${label} (${k === 'forslag' ? nForslagQ : matchQ.length - nForslagQ})</a>`).join('') : ''}
 </div>
 ${filtered ? `<p style="font-size:13px;color:var(--muted);margin:0 0 10px" role="status">Viser ${shown.length} af ${list.length}${nViaLens ? ` · ${nViaLens} fundet via NDI-linsens tekst` : ''}.${onlyLens ? ' Et selskab uden linse er ikke vurderet dårligere - vi har bare ikke skrevet den endnu.' : ''} <a href="${esc(temaHref({ q: '', status: '', linse: false }))}">Nulstil filtre</a></p>` : ''}
 ${shown.length ? `<div class="table-wrap"><table class="data" style="min-width:0"><thead><tr><th>Navn</th><th class="hide-sm-cell">Rolle / hvad ejer man?</th><th>Vægt %</th></tr></thead><tbody>${rows}</tbody></table></div>`
 : list.length ? `<div class="empty-state" role="status">
 <strong>${onlyLens && matchS.length ? (matchS.length === 1 ? `${esc(matchS[0].name)} matcher, men har ingen NDI-linse endnu` : `Ingen af de ${matchS.length} selskaber, der matcher, har en NDI-linse endnu`) : status && matchQ.length ? `Ingen af de ${matchQ.length} selskaber${qRaw ? ', der matcher søgningen,' : ' i temaet'} er ${status === 'forslag' ? 'temaforslag' : 'uden temaforslag'}` : `Ingen af temaets ${list.length} selskaber matcher “${esc(qRaw)}”`}</strong>
 ${qRaw && !onlyLens && !status ? `<span>Søgningen dækker navn, ticker, ISIN, tema-tags og NDI-linsens tekst (min. 3 tegn). Selskabet kan ligge i et andet tema - prøv <a href="selskaber.html?fund=${fund.id}&q=${encodeURIComponent(qRaw)}">hele A-Z-listen</a>.</span>` : ''}
 <div class="row">${onlyLens ? `<a class="outline-btn small" href="${esc(temaHref({ linse: false }))}">Vis også uden NDI-linse</a> ` : ''}${status ? `<a class="outline-btn small" href="${esc(temaHref({ status: '' }))}">Fjern temastatus-filter</a> ` : ''}${qRaw ? `<a class="outline-btn small" href="${esc(temaHref({ q: '' }))}">Ryd søgning</a>` : ''}</div>
 </div>`
 : `<p class="band">Ingen selskaber i ${esc(fund.short)} med dette tema pr. ${posAsOf}.</p>`}
 <p class="src">Sorteret efter ${sort === 'name' ? 'navn' : 'vægt'}. Ingen kursafkast pr. aktie i udkastet.${nLens ? ' <span class="badge">NDI-linse</span> = kvalitativ beskrivelse (hvad ejer man, plads i værdikæden, hold øje med); tekster markeret udkast afventer NDI-gennemgang.' : ''}${nProp ? ` ${nProp} ${nProp === 1 ? 'selskab er' : 'selskaber er'} mærket <span class="badge badge-draft">forslag</span>: temaet er foreslået og afventer gennemgang (<a href="om-data.html#g-temaforslag">hvorfor</a>).${fromTxt}` : ''}</p>
 <p class="link-row" style="margin-top:10px"><a class="outline-btn small" href="${esc(screenerHref)}">Åbn i screeneren →</a>
 <button type="button" class="outline-btn small" id="copy-tema">Kopiér link til tema</button>
 <span class="sr-only" id="copy-tema-status" role="status" aria-live="polite"></span></p>
 </section>

 <section class="panel">
 <h2 class="panel-h">Andre temaer</h2>
 <p class="link-row">${others.map((t) => `<a class="tag" href="tema.html?slug=${t.slug}&fund=${fund.id}">${esc(t.title)}</a>`).join(' ')}</p>
 <p class="link-row" style="margin-top:10px"><a href="temaer.html">Alle temaer →</a> · <a href="laer/saadan-taenker-vi.html">Sådan tænker vi →</a></p>
 </section>
 <p class="warn">${WARN_HIST}</p>`;
 }
 // Kopiér link (U1): URL'en bærer tema + andelsklasse
 const copyBtn = main.querySelector('#copy-tema');
 copyBtn?.addEventListener('click', async () => {
 const status = main.querySelector('#copy-tema-status');
 let msg;
 try { await navigator.clipboard.writeText(location.href); msg = 'Link kopieret'; copyBtn.textContent = 'Kopieret ✓'; }
 catch { msg = 'Kunne ikke kopiere - kopiér adressen fra adresselinjen'; copyBtn.textContent = 'Kopiér fra adresselinjen'; }
 if (status) status.textContent = msg;
 setTimeout(() => { copyBtn.textContent = 'Kopiér link til tema'; }, 2500);
 });
 </script>
</body>
</html>
