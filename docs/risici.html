<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Risici · NDI Analytics</title>
  <link rel="stylesheet" href="css/ndi.css">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
    <nav class="nav"><a href="index.html?view=fonden">← Fonden</a><a href="invester.html">Sådan investerer du</a></nav>
  </header>
  <main id="main"><p style="color:var(--muted)">Henter…</p></main>
  <script type="module">
    import { loadFundMeta, WARN_HIST, fmtDate } from './js/data.js';
    const meta = await loadFundMeta();
    const p = meta?.funds?.pmindi?.priip;
    const a = meta?.funds?.pmindiakk?.priip;
    document.getElementById('main').innerHTML = `
      <p class="eyebrow">RISIKO · KID</p>
      <h1>Risici ved fonden</h1>
      <p class="lede">Kort oversigt baseret på Central Information Dokument (KID). Generel information — ikke rådgivning.</p>
      <section class="panel">
        <h2 style="font-size:16px;margin-bottom:8px">PMINDI</h2>
        ${p ? `${p.key_risks ? `<ul style="color:var(--muted);line-height:1.55;padding-left:1.2rem;margin-bottom:12px">${Object.entries(p.key_risks).filter(([,v])=>v).map(([k])=>`<li>${({aktiemarkedsrisiko:'Aktiemarkedsrisiko',vækst_og_sektorrisiko:'Vækst- og sektorrisiko',valutarisiko:'Valutarisiko',ingen_markedsbeskyttelse:'Ingen markedsbeskyttelse',muligt_tab_af_hele_investeringen:'Muligt tab af hele investeringen'}[k]||k)}</li>`).join('')}</ul>` : ''}<p style="color:var(--muted);line-height:1.6">Risikoklasse <strong style="color:var(--text)">${p.risk_class} / ${p.risk_scale_max}</strong> (${p.risk_label}). Anbefalet ejertid ${p.recommended_holding_years} år. KID pr. ${fmtDate(p.production_date)}.</p>
        <p><a href="${p.url}">Læs KID (Fundmarket PDF) ↗</a></p>` : '<p style="color:var(--muted)">KID-data mangler i snapshot.</p>'}
      </section>
      <section class="panel">
        <h2 style="font-size:16px;margin-bottom:8px">PMINDIAKK</h2>
        ${a ? `<p style="color:var(--muted);line-height:1.6">Risikoklasse <strong style="color:var(--text)">${a.risk_class} / ${a.risk_scale_max}</strong> (${a.risk_label}). Anbefalet ejertid ${a.recommended_holding_years} år. KID pr. ${fmtDate(a.production_date)}.</p>
        <p><a href="${a.url}">Læs KID (Fundmarket PDF) ↗</a></p>` : '<p style="color:var(--muted)">KID-data mangler i snapshot.</p>'}
      </section>
      <section class="panel">
        <h2 style="font-size:16px;margin-bottom:8px">Hvad du bør forstå</h2>
        <ul style="color:var(--muted);line-height:1.6;padding-left:1.2rem;display:grid;gap:8px">
          <li>Du kan tabe en del af eller hele din investering.</li>
          <li>Teknologiporteføljer har store kursudsving som grundvilkår.</li>
          <li>Typisk USD-eksponering og koncentration i tech.</li>
          <li>Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast.</li>
        </ul>
      </section>
      <p class="warn">${WARN_HIST}</p>
      <p><a class="cta" href="invester.html">Sådan investerer du →</a>
      <a class="outline-btn" style="margin-left:8px" href="om-data.html#g-sri">Ordliste: SRI →</a></p>`;
  </script>
</body>
</html>
