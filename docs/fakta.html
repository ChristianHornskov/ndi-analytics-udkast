<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Fakta · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Fakta · NDI Analytics">
 <meta property="og:description" content="Stamdata for NewDeal Invest fra offentlige kilder (Fundmarket / newdealinvest). Generel information. Ikke rådgivning.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/fakta.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta name="twitter:card" content="summary_large_image">
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html?view=fonden">← Fonden</a><a href="omkostninger.html">Omkostninger</a><a href="risici.html">Risici</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter…</p></main>
 <script type="module">
 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const facts = await fetch('data/fund-facts.json').then(r => r.json());
 const risk = await fetch('data/risk-stats.json').then(r => r.ok ? r.json() : null).catch(() => null);
 const c = facts.classes;
 const row = (k,v) => `<tr><th style="text-align:left;color:var(--muted);font-weight:500;padding:6px 10px 6px 0;vertical-align:top;white-space:nowrap">${esc(k)}</th><td style="padding:6px 0;color:var(--text)">${v}</td></tr>`;
 const klasse = (key, cl) => `
 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:10px">${esc(cl.label)}</h2>
 <table style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.45">
 ${row('ISIN', `<code>${esc(cl.isin)}</code>`)}
 ${row('Type', esc(cl.productType) + (cl.distributing ? ' · udloddende' : ' · akkumulerende'))}
 ${row('Børsnoteret', cl.listed ? 'Ja' : 'Nej')}
 ${row('Juridisk start', esc(cl.legalInception))}
 ${row('ESG', esc(cl.esg))}
 ${row('Benchmark', esc(cl.benchmark))}
 ${row('Anbefalet horisont', esc(cl.horizonYears) + ' år (KID)')}
 ${row('SRI', `<strong>${cl.sri} / ${cl.sriMax}</strong>`)}
 ${row('KID', `<a href="${esc(cl.kidUrl)}" rel="noopener" target="_blank">Fundmarket PDF ↗</a>`)}
 ${row('Produktside', `<a href="${esc(cl.fundmarketUrl)}" rel="noopener" target="_blank">Fundmarket ↗</a>`)}
 </table>
 </section>`;
 document.getElementById('main').innerHTML = `
 <p class="eyebrow">FAKTA · OFFENTLIGE KILDER</p>
 <h1>Fakta om fonden</h1>
 <p class="lede">Stamdata fra Fundmarket og newdealinvest.dk. Tomme felter er mærket «udfyldes af NDI». Generel information — ikke rådgivning.</p>
 <p class="band">${esc(facts.asOfNote)}</p>

 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:10px">Organisation</h2>
 <table style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.45">
 ${row('Investeringsforening', esc(facts.association.name))}
 ${row('IFS (forvalter)', `${esc(facts.ifs.name)} · CVR ${esc(facts.ifs.cvr)} · FT ${esc(facts.ifs.ft)}`)}
 ${row('Adresse IFS', esc(facts.ifs.address))}
 ${row('Investeringsrådgiver', `${esc(facts.advisor.name)} · CVR ${esc(facts.advisor.cvr)}`)}
 ${row('Depotbank', esc(facts.depositary.name))}
 ${row('Revision', `<em style="color:var(--muted)">${esc(facts.auditor.name)}</em>${facts.auditor.note ? ` — ${esc(facts.auditor.note)}` : ''}`)}
 </table>
 <p class="src" style="margin-top:10px">Kilder: <a href="${esc(facts.association.source)}">${esc(facts.association.sourceLabel)}</a> · <a href="${esc(facts.prospectusUrl)}">Fællesprospekt ↗</a></p>
 </section>

 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:10px">Porteføljehold (newdealinvest.dk)</h2>
 <ul style="color:var(--muted);line-height:1.55;padding-left:1.2rem;display:grid;gap:6px">
 ${facts.team.map(t => `<li><strong style="color:var(--text)">${esc(t.name)}</strong> — ${esc(t.role)}</li>`).join('')}
 </ul>
 </section>

 ${klasse('pmindi', c.pmindi)}
 ${klasse('pmindiakk', c.pmindiakk)}

 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:10px">Skat (kort)</h2>
 <p style="color:var(--muted);line-height:1.55;margin-bottom:8px"><strong style="color:var(--text)">PMINDI:</strong> ${esc(facts.tax.pmindi)}</p>
 <p style="color:var(--muted);line-height:1.55"><strong style="color:var(--text)">PMINDIAKK:</strong> ${esc(facts.tax.pmindiakk)}</p>
 <p class="src" style="margin-top:10px"><a href="${esc(facts.tax.source)}">${esc(facts.tax.sourceLabel)} ↗</a></p>
 </section>

 ${risk ? `<section class="panel">
 <h2 style="font-size:16px;margin-bottom:10px">Risikotal (beregnet i udkastet)</h2>
 <div class="metrics">
 <div class="metric"><div class="label">Volatilitet (ann.)</div><strong>${String(risk.volatilityAnnPct).replace('.',',')} %</strong><small>Beregnet · se note</small></div>
 <div class="metric"><div class="label">Sharpe (rf=0)</div><strong>${String(risk.sharpeRf0).replace('.',',')}</strong><small>Beregnet · se note</small></div>
 <div class="metric"><div class="label">Max drawdown</div><strong class="neg">${String(risk.maxDrawdownPct).replace('.',',')} %</strong><small>${esc(risk.maxDdPeak)} → ${esc(risk.maxDdTrough)}</small></div>
 </div>
 <p class="band" style="margin-top:12px">Officielt Fundmarket-tal for vol/Sharpe: <em>${esc(risk.officialVolSharpe)}</em>. ${esc(risk.officialVolSharpeNote)}</p>
 <p class="src">${esc(risk.method)}</p>
 </section>` : ''}

 <p class="warn">Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Du kan tabe en del af eller hele din investering.</p>
 <p><a class="cta" href="omkostninger.html">Omkostninger →</a>
 <a class="outline-btn" style="margin-left:8px" href="risici.html">Risici / KID →</a>
 <a class="outline-btn" style="margin-left:8px" href="invester.html">Sådan investerer du →</a></p>`;
 </script>
</body>
</html>
