<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Selskaber · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <!-- og:start -->
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Selskaber · NDI Analytics">
 <meta property="og:description" content="NDI Analytics - klikbart udkast. Fonden, porteføljen og tech-temaer set gennem NDI&#x27;s linse. Generel information, ikke rådgivning.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/selskaber.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta property="og:image:width" content="1200">
 <meta property="og:image:height" content="630">
 <meta property="og:image:alt" content="NDI Analytics - udkast. Gå på opdagelse i porteføljen.">
 <meta name="twitter:card" content="summary_large_image">
 <!-- og:end -->
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html?view=udforsk">← Udforsk</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter…</p></main>
 <script type="module">
 import { loadAll, fundById, daTheme, WARN_HIST, fmtDate, tagsFor } from './js/data.js';
 // A-Z-oversigt. Compliance: kun sortering på navn, vægt eller tema (ingen kurs-, P/S-, P/E-, 52u-tal pr. aktie).
 const { portfolio, multiTags } = await loadAll();
 const url = new URL(location.href);
 const fundId = url.searchParams.get('fund') || 'pmindi';
 const fund = fundById(portfolio, fundId);
 const qRaw = (url.searchParams.get('q') || '').trim();
 const q = qRaw.toLowerCase();
 const SORTS = { name: 'Navn A-Z', weight: 'Vægt', theme: 'Tema' };
 const sort = SORTS[url.searchParams.get('sort')] ? url.searchParams.get('sort') : 'name';
 const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
 const pct = (w) => (w ?? 0).toFixed(2).replace('.', ',');
 const all = fund.positions || [];
 let pos = q ? all.filter((p) => [p.name, p.isin, p.symbol, daTheme(p.theme)].some((x) => (x || '').toLowerCase().includes(q))) : [...all];
 const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'da');
 const w = (p) => (typeof p.weight === 'number' ? p.weight : 0);
 pos.sort({
   name: byName,
   weight: (a, b) => w(b) - w(a) || byName(a, b),
   theme: (a, b) => ((a.theme === 'andet') - (b.theme === 'andet')) || daTheme(a.theme).localeCompare(daTheme(b.theme), 'da') || w(b) - w(a) || byName(a, b),
 }[sort]);
 // Grupperingsnøgle: forbogstav (A-Z, tal → #) eller tema
 const groupOf = (p) => {
   if (sort === 'theme') return daTheme(p.theme);
   const c = (p.name || '#').trim().charAt(0).toLocaleUpperCase('da');
   return /[A-ZÆØÅ]/.test(c) ? c : '#';
 };
 const anchor = (g) => 'g-' + g.toLowerCase().replace(/[^a-z0-9æøå]+/g, '-');
 const nForslag = pos.filter((p) => p.themeStatus === 'forslag').length;
 const row = (p) => `
 <tr>
 <td><a href="selskab.html?isin=${encodeURIComponent(p.isin)}&fund=${encodeURIComponent(fundId)}">${esc(p.name)}</a>${p.symbol ? ` <small style="color:var(--muted)">${esc(p.symbol)}</small>` : ''}</td>
 <td>${esc(p.isin)}</td>
 <td>${tagsFor(p, multiTags).map((t) => `<a class="tag" href="tema.html?slug=${encodeURIComponent(t)}&fund=${encodeURIComponent(fundId)}">${esc(daTheme(t))}</a>`).join(' ')}${p.themeStatus === 'forslag' ? ' <span class="badge badge-draft" title="Temaet er et forslag fra udkastet og afventer NDI-gennemgang">forslag</span>' : ''}</td>
 <td>${pct(p.weight)}</td>
 </tr>`;
 let body = '', groups = [];
 if (sort === 'weight') body = pos.map(row).join('');
 else {
   let cur = null;
   for (const p of pos) {
     const g = groupOf(p);
     if (g !== cur) { cur = g; groups.push(g); body += `<tr class="group-row" id="${anchor(g)}"><th colspan="4" scope="colgroup" style="text-align:left;padding-top:14px;color:var(--muted);font-size:12px;letter-spacing:.06em">${esc(g)}</th></tr>`; }
     body += row(p);
   }
 }
 const link = (params) => { const u = new URL(location.href); for (const [k, v] of Object.entries(params)) v ? u.searchParams.set(k, v) : u.searchParams.delete(k); return u.pathname.split('/').pop() + u.search; };
 const sortNav = Object.entries(SORTS).map(([k, label]) =>
   `<a class="control${k === sort ? ' active' : ''}" ${k === sort ? 'aria-current="true"' : ''} href="${esc(link({ sort: k === 'name' ? '' : k }))}" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">${label}</a>`).join('');
 const jump = groups.length > 1
   ? `<nav aria-label="Hop til ${sort === 'theme' ? 'tema' : 'bogstav'}" style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px">${groups.map((g) => `<a class="tag" href="#${anchor(g)}">${esc(g)}</a>`).join('')}</nav>` : '';
 const empty = `<tr><td colspan="4"><div class="empty-state" role="status">
   <strong>Ingen af fondens ${all.length} selskaber matcher “${esc(qRaw)}”</strong>
   <span>Listen viser kun selskaber, fonden ejede pr. ${fmtDate(fund.positionsAsOf || portfolio.asOf)}. Et selskab, der ikke er med, er ikke et signal - se <a href="laer/faq-mangler-aktie.html">Hvorfor mangler aktie X?</a></span>
   <div class="row"><a class="outline-btn small" href="${esc(link({ q: '' }))}">Ryd søgning</a> <a class="outline-btn small" href="index.html?view=udforsk&fund=${encodeURIComponent(fundId)}">Åbn screeneren</a></div>
 </div></td></tr>`;
 document.getElementById('main').innerHTML = `
 <p class="eyebrow">ALLE SELSKABER · FORSINKET BEHOLDNING</p>
 <h1>${esc(fund.short)}</h1>
 <p class="lede">${q ? `${pos.length} af ${all.length}` : all.length} positioner pr. ${fmtDate(fund.positionsAsOf || portfolio.asOf)}. Eksponering, ikke anbefaling.</p>
 <form method="get" role="search" style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
 <input type="hidden" name="fund" value="${esc(fundId)}">
 ${sort !== 'name' ? `<input type="hidden" name="sort" value="${sort}">` : ''}
 <input name="q" type="search" value="${esc(qRaw)}" aria-label="Søg i selskaber" placeholder="Søg navn, ticker, ISIN eller tema…" style="flex:1;min-width:200px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)">
 <button class="cta" type="submit">Søg</button>
 </form>
 <div class="filters" role="group" aria-label="Sortér listen" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><small style="color:var(--muted)">Sortér:</small>${sortNav}</div>
 ${jump}
 ${nForslag ? `<p style="font-size:12px;color:var(--muted)">${nForslag} af ${pos.length} har et tema mærket <span class="badge badge-draft">forslag</span> - foreslået i udkastet, afventer NDI-gennemgang. <a href="temaer.html?fund=${encodeURIComponent(fundId)}">Se temaoversigt →</a></p>` : ''}
 <div class="table-wrap"><table class="data"><thead><tr><th scope="col">Navn</th><th scope="col">ISIN</th><th scope="col">Tema</th><th scope="col">Vægt %</th></tr></thead><tbody>${pos.length ? body : empty}</tbody></table></div>
 <p style="font-size:11px;color:var(--muted);margin-top:8px">Kun navn, ISIN, tema og vægt i fonden. Ingen kursafkast, P/S eller P/E pr. aktie i denne version.</p>
 <p class="warn">${WARN_HIST}</p>`;
 if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
 </script>
</body>
</html>
