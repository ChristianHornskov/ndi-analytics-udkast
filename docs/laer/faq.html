<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FAQ · NDI Analytics</title>
  <link rel="stylesheet" href="../css/ndi.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><img src="../assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
    <nav class="nav"><a href="index.html">← Lær</a></nav>
  </header>
  <main>
    <p class="eyebrow">LÆR · FAQ</p>
    <h1>Ofte stillede spørgsmål</h1>
    <p class="lede">Søg i korte svar. Generel information — ikke rådgivning.</p>
    <input id="faq-q" type="search" placeholder="Søg i FAQ…" aria-label="Søg FAQ"
      style="width:100%;max-width:480px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-bottom:18px">
    <div id="faq-list" class="doors" style="grid-template-columns:1fr"></div>
    <p class="warn">Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Du kan tabe en del af eller hele din investering.</p>
  </main>
  <script>
    const items = [
      { q: 'Hvorfor så mange aktier?', a: 'Høj idiosynkratisk varians i tech — bred spredning reducerer afhængighed af enkelte udfald.', href: 'hvorfor-mange-aktier.html' },
      { q: 'Hvorfor mangler aktie X?', a: 'Typisk størrelse, likviditet eller spredning. Fravær er ikke en anbefaling.', href: 'faq-mangler-aktie.html' },
      { q: 'Hvad betyder P/E?', a: 'Markedets forventning — ikke en facitliste for vækstvirksomheder.', href: 'pe-forklaring.html' },
      { q: 'Hvad er forskellen på PMINDI og PMINDIAKK?', a: 'Udbytte vs akkumulering. Samme overordnede perspektiv.', href: '../sammenlign.html' },
      { q: 'Hvordan investerer jeg?', a: 'Generelt flow: forstå produkt, vælg klasse, platform, ordre. Ikke rådgivning.', href: '../invester.html' },
      { q: 'Er temaer anbefalinger?', a: 'Nej. Segmenter viser eksponering, ikke anbefaling.', href: '../temaer.html' },
      { q: 'Hvor aktuelle er beholdningerne?', a: 'Forsinket offentlig månedsrapport (i v1 pr. 1. juni 2026) — ikke dagsaktuel.', href: '../om-data.html#g-forsinket' },
      { q: 'Hvad er drawdown?', a: 'Fald fra top i fondens totalafkast-serie. Se drawdown-siden.', href: '../drawdown.html' },
      { q: 'Sådan tænker NDI', a: 'Fem principper: retning kan skimtes, vindere kan ikke udpeges sikkert, bred spredning, lang horisont.', href: 'saadan-taenker-vi.html' },
    ];
    const list = document.getElementById('faq-list');
    const input = document.getElementById('faq-q');
    function paint() {
      const q = (input.value || '').toLowerCase().trim();
      const shown = items.filter(i => !q || (i.q + ' ' + i.a).toLowerCase().includes(q));
      list.innerHTML = shown.map(i => `<a class="door" href="${i.href}"><strong>${i.q}</strong><span>${i.a}</span><span class="go">Læs mere →</span></a>`).join('')
        || '<p class="band">Ingen match — prøv et andet ord.</p>';
    }
    input.addEventListener('input', paint);
    paint();
  </script>
</body>
</html>
