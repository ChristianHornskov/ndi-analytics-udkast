<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Omkostninger · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Omkostninger · NDI Analytics">
 <meta property="og:description" content="Forventede omkostninger for PMINDI og PMINDIAKK ifølge Fundmarket. Generel information. Ikke rådgivning.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/omkostninger.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta name="twitter:card" content="summary_large_image">
 <style>
  .cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .cost-card{background:linear-gradient(180deg,#16303a 0%,#11252c 60%);border:1px solid #345860;border-radius:16px;padding:18px 18px 16px;min-width:0}
  .cost-card h2{font-size:18px;letter-spacing:-.3px;margin:0 0 8px}
  .kicker{color:var(--brand);font-size:11px;font-weight:700;letter-spacing:1.4px;margin-bottom:6px}
  .cmp{display:grid;gap:18px;margin-top:4px}
  .cmp-row{display:grid;gap:8px}
  .cmp-row.is-diff{border-left:3px solid var(--yellow);padding-left:12px}
  .cmp-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
  .cmp-flag{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
  .cmp-row.is-diff .cmp-flag{color:#f5ee9e}
  .cmp-line{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:center}
  .cmp-name{font-size:12px;color:var(--muted)}
  .cmp-line b{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:500;min-width:72px;text-align:right}
  .cost-bar{height:8px;border-radius:99px;background:#0b171d;border:1px solid #2a424a;overflow:hidden}
  .cost-bar i{display:block;height:100%;background:linear-gradient(90deg,#89aeb4,#9ecfd6);border-radius:99px}
  .scale-note{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5}
  .receipts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .receipt{background:#0b171d;border:1px solid #345860;border-radius:16px;padding:16px 16px 14px;min-width:0}
  .receipt h3{font-size:16px;letter-spacing:-.2px;margin:0 0 4px}
  .receipt ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:0}
  .receipt li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #2a424a;font-size:14px}
  .receipt li span{color:var(--muted)}
  .receipt .formula{display:block;font-size:11px;color:var(--faint);margin-top:2px}
  .receipt li b{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;white-space:nowrap}
  .receipt li.is-diff{box-shadow:inset 3px 0 0 var(--yellow);padding-left:10px}
  .delta-stage{margin:6px 0 16px;padding:18px 18px 16px;border-radius:16px;border:1px solid #f5ee9e55;background:radial-gradient(90% 90% at 100% 0%,rgba(245,238,158,.1),transparent 46%),linear-gradient(180deg,#16303a,#11252c)}
  .delta-stage h2{font-size:22px;letter-spacing:-.4px;margin:0 0 12px}
  .delta-nums{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:end}
  .delta-nums span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .delta-nums b{display:block;font-size:28px;font-weight:500;letter-spacing:-.6px;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1.1}
  .delta-nums small{display:block;margin-top:4px;font-size:12px;color:var(--faint)}
  .delta-mid{text-align:center;padding:0 6px 2px}
  .delta-mid b{color:#f5ee9e;font-size:22px}
  main .lede{margin-bottom:14px}
  .band{margin:8px 0}
  .delta-stage{margin:4px 0 14px}
  .delta-track{position:relative;height:12px;margin:18px 8px 6px;border-radius:99px;background:#0b171d;border:1px solid #2a424a}
  .delta-track .gap{position:absolute;top:50%;height:4px;transform:translateY(-50%);background:#f5ee9e99;border-radius:99px;z-index:0;display:block;overflow:hidden;padding:0;margin:0;font-size:0;line-height:0}
  .delta-track i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:#9ecfd6;border:2px solid #0c1c22;z-index:1}
  .delta-track i.b{background:#f5ee9e}
  .delta-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
  .delta-zoom{margin-top:12px;padding-top:12px;border-top:1px dashed #345860}
  .delta-zoom .k{font-size:11px;letter-spacing:1.2px;font-weight:700;color:var(--brand);margin:0 0 8px}
  .cost-hero{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;margin:0 0 14px}
  .cost-hero.is-pair{grid-template-columns:minmax(0,1.2fr) auto minmax(210px,.78fr)}
  .cost-neq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0;text-align:center;color:#f5ee9e}
  .cost-neq .mark{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:44px;line-height:.85}
  .cost-neq .word{font-size:12px;letter-spacing:.3px;text-transform:uppercase;line-height:1.25;color:var(--muted);max-width:12ch}
  .cost-hero.is-same .cost-neq .word{color:#f5ee9e}
  .cost-hero.is-same .cost-neq .mark{text-shadow:0 0 18px rgba(245,238,158,.7)}
  #forskel.is-match{box-shadow:inset 0 0 0 1px #f5ee9e66}
  #forskel.is-match .delta-mid b,.kr-chips li.is-gap.is-match em{text-shadow:0 0 16px rgba(245,238,158,.55)}
  .kr-chips li.is-gap.is-match{box-shadow:inset 3px 0 0 var(--yellow),0 0 0 1px #f5ee9e55}
  .cost-hero.is-same .cost-hero-kid{box-shadow:inset 0 0 0 1px #f5ee9e88}
  .cost-hero.is-same .cost-hero-nums em{font-size:56px;letter-spacing:-1.5px;line-height:.9}
  .cost-hero.is-same [data-kid-gap],.cost-hero.is-same .gap-kr{text-shadow:0 0 16px rgba(245,238,158,.55)}
  .cost-hero article{display:flex;flex-direction:column;border-radius:16px;padding:14px 16px 12px;min-width:0}
  .match-rail{width:168px;max-width:100%;align-self:flex-start;height:6px;margin-top:auto;border-radius:99px;background:#0b171d;box-shadow:inset 0 0 0 1px #2a424a;overflow:hidden;flex:0 0 auto}
  .rail-key{grid-column:1 / -1;margin:0;font-size:11px;line-height:1.35;color:var(--faint)}
  .match-rail i{display:block;height:6px;border-radius:99px;background:#89aeb4}
  .cost-hero-gap .match-rail i,.cost-hero.is-same .match-rail i{background:#f5ee9e}
  .cost-hero.is-same .match-rail{box-shadow:0 0 12px rgba(245,238,158,.45), inset 0 0 0 1px #2a424a}
  .cost-hero-kid{border:1px solid #345860;background:linear-gradient(180deg,#16303a,#11252c)}
  .cost-hero-gap{border:1px solid #f5ee9e55;background:radial-gradient(90% 90% at 100% 0%,rgba(245,238,158,.12),transparent 50%),linear-gradient(180deg,#16303a,#11252c)}
  .cost-hero-nums{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
  .cost-hero-nums span,.cost-hero-gap .gap-sub{display:block;font-size:12px;color:var(--muted)}
  .cost-hero-nums b,.cost-hero-nums em{display:block;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:500;letter-spacing:-.8px;line-height:.95;font-style:normal}
  .cost-hero-nums b{font-size:32px;color:var(--cyan)}
  .cost-hero-nums em{font-size:28px;color:#f5ee9e;text-align:center}
  .cost-hero-nums small,.cost-hero-gap .gap-note{display:block;margin-top:4px;font-size:12px;color:var(--faint);line-height:1.35}
  .cost-hero .mid{text-align:center;padding-bottom:2px}
  .gap-kr{margin:2px 0 6px;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:56px;font-weight:500;letter-spacing:-1.6px;line-height:.9;color:#f5ee9e}
  .cost-hero-gap .gap-sub b{color:var(--cyan);font-weight:600}
  .cost-hero-gap .gap-eq{margin:3px 0 0;font-size:13px;line-height:1.35;color:#f5ee9e}
  .cost-hero-note{margin:8px 0 0;font-size:12px;color:var(--faint);line-height:1.35}
  .kid-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 8px}
  .kid-head .kicker{margin:0}
  .kid-switch{display:flex;gap:4px;flex:none}
  .kid-switch button{appearance:none;border:1px solid #345860;background:#0b171d;color:var(--muted);border-radius:999px;padding:4px 8px 4px 10px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;min-height:32px}
  .kid-switch button b{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:500;font-size:14px;letter-spacing:-.3px;color:#c5d6db}
  .kid-switch button[aria-pressed="true"]{border-color:#f5ee9e88;color:var(--text);box-shadow:inset 0 -2px 0 #f5ee9e}
  .kid-switch button[aria-pressed="true"] b{color:#f5ee9e}
  .kid-switch button:focus-visible{outline:2px solid #f5ee9e;outline-offset:2px}
  .peg-board{margin:0 0 14px;padding:12px 14px 12px;border:1px solid #345860;border-radius:16px;background:radial-gradient(90% 80% at 100% 0%,rgba(245,238,158,.08),transparent 42%),#0d1c22}
  .peg-top{display:flex;justify-content:space-between;gap:8px 12px;align-items:baseline;flex-wrap:wrap;margin:0 0 6px}
  .peg-top .kicker{margin:0}
  .peg-top p{margin:0;color:var(--faint);font-size:12px;line-height:1.35}
  .peg-row{appearance:none;width:100%;display:grid;grid-template-columns:minmax(0,158px) minmax(80px,1fr) minmax(0,148px);gap:8px;align-items:center;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:left;padding:3px 6px;cursor:pointer;min-height:30px}
  .peg-row.is-on{background:#f5ee9e14;box-shadow:inset 2px 0 0 #f5ee9e}
  .peg-row:focus-visible{outline:2px solid #f5ee9e;outline-offset:2px}
  .peg-name{font-size:13px;color:var(--text)}
  .peg-track{position:relative;height:16px;border-radius:99px;background:#0b171d;box-shadow:inset 0 0 0 1px #2a424a}
  .peg{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:#9ecfd6;border:2px solid #0c1c22;z-index:1}
  .peg.is-b{background:#f5ee9e}
  .peg.is-both{box-shadow:0 0 0 2px #f5ee9e}
  .peg-gap{position:absolute;top:50%;height:3px;transform:translateY(-50%);background:#f5ee9e99;border-radius:99px;z-index:0}
  .peg-val{font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .peg-row.is-on .peg-val{color:#f5ee9e}
  .peg-ends{display:grid;grid-template-columns:minmax(0,158px) minmax(80px,1fr) minmax(0,148px);gap:8px;padding:0 6px;margin:1px 0 8px}
  .peg-ends .peg-scale{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
  .peg-note{margin:0;font-size:14px;line-height:1.45;color:var(--text)}
  .peg-foot{margin:6px 0 0;font-size:12px;line-height:1.45;color:var(--faint)}
  .peg-board{position:relative}
  .peg-ask{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .peg-ask button{appearance:none;border:1px solid #345860;background:#0b171d;color:var(--muted);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px}
  .peg-ask button kbd{font:inherit;font-size:10px;letter-spacing:.4px;color:var(--faint);border:1px solid #345860;border-radius:4px;padding:0 4px}
  .peg-ask button[aria-checked="true"]{border-color:#f5ee9e88;color:var(--text);box-shadow:inset 0 -2px 0 #f5ee9e}
  .peg-ask button:focus-visible{outline:2px solid #f5ee9e;outline-offset:2px}
  .peg-board.is-kid .peg-row{opacity:.4}
  .peg-board.is-kid .peg-note{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .peg-over{margin:2px 0 8px}
  .peg-over-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.15fr);gap:8px;align-items:center}
  .peg-over-scale{height:16px;border-radius:99px;background:#0b171d;box-shadow:inset 0 0 0 1px #2a424a;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;color:var(--faint)}
  .peg-over-break{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#f5ee9e;border-bottom:2px dashed #f5ee9e88;padding:0 2px 2px;white-space:nowrap}
  .peg-over-off{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;background:#0b171d;border:1px dashed #f5ee9e88;border-radius:12px;padding:6px 10px;min-width:0}
  .peg-over-off b{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:22px;font-weight:500;color:#f5ee9e;letter-spacing:-.4px}
  .peg-over-off i{flex-basis:100%;font-style:normal;font-size:11px;color:var(--faint)}
  .peg-over-say{margin:6px 0 0;font-size:14px;line-height:1.45;color:var(--text)}
  .life{margin:0 0 14px;padding:12px 14px 12px;border:1px solid #345860;border-radius:16px;background:radial-gradient(80% 90% at 0% 0%,rgba(158,207,214,.1),transparent 46%),#0d1c22;scroll-margin-top:84px}
  .life-top{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
  .life-top .kicker{margin:0}
  .life-ask{display:flex;flex-wrap:wrap;gap:6px}
  .life-ask button{appearance:none;border:1px solid #345860;background:#0b171d;color:var(--muted);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px}
  .life-ask button kbd{font:inherit;font-size:10px;letter-spacing:.4px;color:var(--faint);border:1px solid #345860;border-radius:4px;padding:0 4px}
  .life-ask button[aria-checked="true"]{border-color:#f5ee9e88;color:var(--text);box-shadow:inset 0 -2px 0 #f5ee9e}
  .life-ask button:focus-visible{outline:2px solid #f5ee9e;outline-offset:2px}
  .life-lane,.life-bridge,.life-ends{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center}
  .life-name{font-size:12px;font-weight:600;color:#9ecfd6;line-height:1.15}
  .life-lane.is-b .life-name{color:#f5ee9e}
  .life-form{display:block;font-weight:500;font-size:11px;color:var(--faint)}
  .life.is-form .life-form{color:#f5ee9e}
  .life-track,.life-bridge-track{position:relative;height:22px;margin:0 6px}
  .life-run{position:absolute;top:50%;height:3px;transform:translateY(-50%);border-radius:99px;background:#9ecfd6}
  .life-lane.is-b .life-run{background:#f5ee9e}
  .life-dot{position:absolute;top:50%;width:12px;height:12px;margin:0;border-radius:50%;transform:translate(-50%,-50%);background:#9ecfd6;border:2px solid #0c1c22;z-index:1}
  .life-lane.is-b .life-dot{background:#f5ee9e}
  .life-when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .life-bridge-track i{position:absolute;top:50%;height:0;border-top:1px dashed #f5ee9e88}
  .life-bridge-track b{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:18px;font-weight:500;letter-spacing:-.3px;color:#f5ee9e;background:#0d1c22;padding:0 5px;white-space:nowrap}
  .life.is-form .life-bridge-track b,.life.is-same .life-bridge-track b{color:var(--muted)}
  .life-scale{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint)}
  .life-note{margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--text)}
  .life-stamps{display:none;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .life.is-same .life-stamps{display:flex}
  .life-stamps span{border:1px solid #345860;border-radius:999px;padding:3px 8px;font-size:12px;color:var(--cyan);background:#0b171d}
  .life-foot{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--faint)}
  .life.is-cross .life-plot,.life.is-cross .life-ends{display:none}
  .life-venn{display:none;margin-top:4px}
  .life.is-cross .life-venn{display:block}
  .venn-stage{display:grid;grid-template-columns:minmax(0,1fr) 128px minmax(0,1fr);align-items:center;min-height:148px}
  .venn-wing,.venn-lens{appearance:none;font:inherit;color:inherit;cursor:pointer;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
  .venn-wing{position:relative;z-index:1;width:min(100%,168px);aspect-ratio:1;border:1px solid #345860;background:#0b171d;padding:12px}
  .venn-wing.is-a{justify-self:end;margin-right:-36px}
  .venn-wing.is-b{justify-self:start;margin-left:-36px}
  .venn-wing .k{font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--brand)}
  .venn-wing b{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:32px;font-weight:500;letter-spacing:-.8px;line-height:.9;color:#9ecfd6}
  .venn-wing.is-b b{color:#f5ee9e}
  .venn-wing span{font-size:11px;color:var(--faint)}
  .venn-lens{position:relative;z-index:2;width:128px;height:128px;border:0;background:radial-gradient(circle at 40% 32%,#fbf6c8,#f5ee9e 58%,#c9b84a);color:#1c1604;box-shadow:0 0 0 6px #0d1c22}
  .venn-lens .k{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;color:#3d3810}
  .venn-lens b{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:36px;font-weight:500;letter-spacing:-1px;line-height:.9}
  .venn-lens span{font-size:11px;color:#3d3810}
  .venn-wing[aria-pressed="true"]{box-shadow:0 0 0 2px #f5ee9e}
  .venn-lens[aria-pressed="true"]{box-shadow:0 0 0 6px #0d1c22,0 0 0 8px #f5ee9e}
  .venn-wing:focus-visible,.venn-lens:focus-visible{outline:2px solid #f5ee9e;outline-offset:3px}
  .venn-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;list-style:none;padding:0;margin:10px 0 0}
  .venn-list li{border:1px solid #345860;border-radius:999px;padding:3px 8px;font-size:12px;line-height:1.35;color:var(--cyan);background:#0b171d}
  .life-print{display:none}
  .meet{margin:0 0 14px;padding:12px 14px 12px;border:1px solid #345860;border-radius:16px;background:radial-gradient(80% 90% at 100% 0%,rgba(245,238,158,.1),transparent 46%),#0d1c22;scroll-margin-top:84px}
  .meet-top{display:flex;justify-content:space-between;gap:8px 14px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px}
  .meet-top .kicker{margin:0}
  .meet-top p{margin:0;font-size:14px;line-height:1.45;color:var(--text);max-width:78ch}
  .meet-ask{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .meet-ask button{appearance:none;border:1px solid #345860;background:#0b171d;color:var(--muted);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px}
  .meet-ask button kbd{font:inherit;font-size:10px;letter-spacing:.4px;color:var(--faint);border:1px solid #345860;border-radius:4px;padding:0 4px}
  .meet-ask button[aria-pressed="true"]{border-color:#f5ee9e88;color:var(--text);box-shadow:inset 0 -2px 0 #f5ee9e}
  .meet-ask button:focus-visible{outline:2px solid #f5ee9e;outline-offset:2px}
  .meet-lane,.meet-scale{display:grid;grid-template-columns:minmax(0,168px) minmax(80px,1fr) minmax(0,148px);gap:8px;align-items:center}
  .meet-lane{min-height:28px}
  .meet-name{font-size:12px;color:var(--text);line-height:1.25}
  .meet-track{position:relative;height:18px;border-radius:99px;background:#0b171d;box-shadow:inset 0 0 0 1px #2a424a}
  .meet-tick{position:absolute;top:3px;width:2px;height:12px;border-radius:1px;transform:translateX(-50%);background:#9ecfd6}
  .meet-tick.is-tx{background:#f5ee9e}

 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 const pct = (n) => {
 if (n == null || n === '' || Number.isNaN(Number(n))) return 'ikke oplyst';

 };

 try {
 const r = await fetch('data/fund-facts.json');
 if (!r.ok) throw new Error('facts');

 } catch {

 const A = facts.classes.pmindi;

 const txEq = dTx === 0 ? '' : `${txHiName} ${kr(Math.max(a.portfolioTransaction, b.portfolioTransaction))} − ${txLoName} ${kr(Math.min(a.portfolioTransaction, b.portfolioTransaction))}`;

 return { y: years, pctA: pct(rateA), pctB: pct(rateB), krA: kr(rateA), krB: kr(rateB), gap: krn(gapN), gapN, eq: hi === lo ? '' : `${krn(hi)} − ${krn(lo)}` };
 };

 const txGapN = krGap;

 const h5 = kidHorizons.find((h) => h.y === 5) || null;

 same,

 <h2 class="panel-h">KID: samlet omkostningsindikator</h2>
 <p class="lede" style="margin-bottom:10px">KID’et viser den årlige omkostningsmæssige konsekvens (PRIIP-omkostningsindikator). Det er det tal, marketingmateriale skal gengive ærligt — ikke kun de enkelte postsatser.</p>
 <div class="table-wrap"><table class="data" style="min-width:0">
 <thead><tr><th></th><th>PMINDI</th><th>PMINDIAKK</th></tr></thead>
 <tbody>
 <tr data-kid-row="5"${heroStart && heroStart.y === 5 ? ' class="is-on"' : ''}><td>Ved 5 år (anbefalet periode)</td><td>${pct(a.kidRiy5y)}</td><td>${pct(b.kidRiy5y)}</td></tr>
 <tr data-kid-row="1"${heroStart && heroStart.y === 1 ? ' class="is-on"' : ''}><td>Ved 1 år</td><td>${pct(a.kidRiy1y)}</td><td>${pct(b.kidRiy1y)}</td></tr>
 </tbody>
 </table></div>
 <p class="src" style="margin-top:10px">${esc(a.kidRiyNote || '')} Kilde: KID via Fundmarket. <a href="${esc(A.kidUrl)}" rel="noopener noreferrer" target="_blank">KID PMINDI ↗</a> · <a href="${esc(B.kidUrl)}" rel="noopener noreferrer" target="_blank">KID PMINDIAKK ↗</a></p>
 </section>
 <p class="band">${onlyTx ? `Kun porteføljetransaktion skiller klasserne. ${sameLine} ${entryLine} ${feeLine} Ikke et ÅOP.` : `${spoken} ${sameLine} ${entryLine} ${feeLine}`}</p>
 ${deltaStage}

 <section class="panel">
 <h2 class="panel-h">Sammenligning</h2>
 <div class="cmp">
 ${pair('Øvrige løbende', a.otherOngoing, b.otherOngoing)}
 ${pair('Porteføljetransaktion', a.portfolioTransaction, b.portfolioTransaction)}
 ${pair('Emission, maks.', a.entry, b.entry)}
 ${pair('Indløsning, maks.', a.exit, b.exit)}
 </div>
 <p class="scale-note">Søjlerne deler skalaen 0 til ${pct(SCALE)}. En lav sats tegnes smal. Forskellen mellem ${pct(a.portfolioTransaction)} og ${pct(b.portfolioTransaction)} er bevidst lille på figuren. ${pct(a.otherOngoing)} er Fundmarkets tal for øvrige løbende omkostninger. Noten på kilden kalder dem forventede samlede omkostninger i regnskabsåret. Siden lægger ikke satserne sammen og kalder det ikke et ÅOP.</p>
 <div class="table-wrap"><table class="data" style="min-width:0">
 <thead><tr><th></th><th>PMINDI</th><th>PMINDIAKK</th></tr></thead>
 <tbody>
 <tr><td>Øvrige løbende</td><td>${pct(a.otherOngoing)}</td><td>${pct(b.otherOngoing)}</td></tr>
 <tr><td>Porteføljetransaktion</td><td>${pct(a.portfolioTransaction)}</td><td>${pct(b.portfolioTransaction)}</td></tr>
 <tr><td>Emission, maks.</td><td>${pct(a.entry)}</td><td>${pct(b.entry)}</td></tr>
 <tr><td>Indløsning, maks.</td><td>${pct(a.exit)}</td><td>${pct(b.exit)}</td></tr>
 <tr><td>Resultathonorar</td><td>${a.performanceFee ? 'Ja' : 'Nej'}</td><td>${b.performanceFee ? 'Ja' : 'Nej'}</td></tr>
 </tbody>
 </table></div>
 </section>

 <section class="panel">
 <h2 class="panel-h">Regneeksempel på 100.000 kr.</h2>
 <p class="lede" style="margin-bottom:12px">Hver linje er satsen ganget med 100.000 kr. og afrundet til hele kroner. Linjerne er ikke lagt sammen. Summen er ikke et ÅOP. Kurtage, depot og skat er ikke med.</p>
 <div class="receipts">
 <article class="receipt">
 <p class="kicker">${esc(A.isin)}</p>
 <h3>PMINDI</h3>
 <ol>
 ${line('Øvrige løbende', a.otherOngoing)}
 ${line('Porteføljetransaktion', a.portfolioTransaction, dTx !== 0)}
 ${line('Emission, maks.', a.entry)}
 ${line('Indløsning, maks.', a.exit)}
 </ol>
 </article>
 <article class="receipt">
 <p class="kicker">${esc(B.isin)}</p>
 <h3>PMINDIAKK</h3>
 <ol>
 ${line('Øvrige løbende', b.otherOngoing)}
 ${line('Porteføljetransaktion', b.portfolioTransaction, dTx !== 0)}
 ${line('Emission, maks.', b.entry)}
 ${line('Indløsning, maks.', b.exit)}
 </ol>
 </article>
 </div>
 <p class="src" style="margin-top:10px">Resultathonorar indgår ikke i eksemplet. ${feeLine}</p>
 </section>

 <div class="cost-grid">
 ${card(A)}
 ${card(B)}
 </div>

 <p class="warn">Du kan tabe penge. Afkasttal på NDI Analytics er efter fondens løbende omkostninger, før din egen kurtage og dit depot. Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Se KID’ets samlede omkostningsindikator ovenfor — ikke kun postsatserne.</p>
 <p class="link-row">
 <a class="cta" href="fakta.html">Fakta →</a>
 <a class="outline-btn" href="risici.html">Risici / KID →</a>
 <a class="outline-btn" href="sammenlign.html">Sammenlign klasser →</a>
 </p>`;
 const paintKid = (years, pushUrl) => {
 const h = kidHorizons.find((x) => x.y === Number(years));
 const root = document.getElementById('kid-hero');
 if (!h || !root) return;
 root.querySelector('[data-kid-a]').textContent = h.pctA;
 root.querySelector('[data-kid-b]').textContent = h.pctB;
 root.querySelector('[data-kid-ka]').textContent = `${h.krA} på 100.000 kr.`;
 root.querySelector('[data-kid-kb]').textContent = `${h.krB} på 100.000 kr.`;
 root.querySelector('[data-kid-gap]').textContent = h.gap;
 root.querySelector('[data-kid-eq]').innerHTML = `${h.eq ? `${h.eq}<br>` : ''}ikke postsatserne`;
 const hero = document.getElementById('blik');
 const copy = bridgeCopy(h);
 if (hero) {
 hero.classList.toggle('is-same', copy.same);
 const kidRail = hero.querySelector('[data-rail="kid"]');
 const txRail = hero.querySelector('[data-rail="tx"]');
 if (kidRail) kidRail.style.width = railPct(h.gapN) + '%';
 if (txRail) txRail.style.width = railPct(txGapN) + '%';
 const mark = hero.querySelector('[data-bridge-mark]');
 const word = hero.querySelector('[data-bridge-word]');
 const sr = hero.querySelector('[data-bridge-sr]');
 if (mark) mark.textContent = copy.mark;
 if (word) word.textContent = copy.word;
 if (sr) sr.textContent = copy.sr;
 }
 document.getElementById('forskel')?.classList.toggle('is-match', copy.same);
 document.querySelectorAll('.kr-chips li.is-gap').forEach((el) => el.classList.toggle('is-match', copy.same));
 root.querySelectorAll('[data-kid]').forEach((btn) => {
 btn.setAttribute('aria-pressed', Number(btn.getAttribute('data-kid')) === h.y ? 'true' : 'false');
 });
 document.querySelectorAll('#kid-omkostning tr[data-kid-row]').forEach((tr) => {
 tr.classList.toggle('is-on', Number(tr.getAttribute('data-kid-row')) === h.y);
 });
 main.querySelectorAll('a[href^="fakta.html"]').forEach((a) => {
 const u = new URL(a.getAttribute('href'), location.href);
 if (h.y === 5) u.searchParams.delete('h');
 else u.searchParams.set('h', String(h.y));
 a.setAttribute('href', `fakta.html${u.search}${u.hash}`);
 });
 if (pushUrl) {
 const u = new URL(location.href);
 if (h.y === 5) u.searchParams.delete('h');
 else u.searchParams.set('h', String(h.y));
 history.replaceState(null, '', u);
 }
 };
 if (heroStart) paintKid(heroStart.y, false);
 const openPair = () => {
 const d = document.querySelector('details.cost-details');
 if (!d || d.open) return false;
 d.open = true;
 document.getElementById('blik')?.scrollIntoView({ block: 'nearest' });
 return true;
 };
 const setAsk = (id) => {
 const board = document.getElementById('satskort');
 if (!board) return;
 board.querySelectorAll('[data-ask]').forEach((b) => {
 const on = b.getAttribute('data-ask') === id;
 b.classList.toggle('is-on', on);
 b.setAttribute('aria-checked', on ? 'true' : 'false');
 b.tabIndex = on ? 0 : -1;
 });
 const kid = id === 'kid';
 board.classList.toggle('is-kid', kid);
 const over = board.querySelector('.peg-over');
 if (over) over.hidden = !kid;
 };
 const pickPeg = (id) => {
 const board = document.getElementById('satskort');
 if (!board) return;
 const buttons = [...board.querySelectorAll('[data-peg]')];
 const btn = buttons.find((b) => b.getAttribute('data-peg') === id) || buttons[0];
 if (!btn) return;
 buttons.forEach((b) => {
 const on = b === btn;
 b.classList.toggle('is-on', on);
 b.setAttribute('aria-checked', on ? 'true' : 'false');
 b.tabIndex = on ? 0 : -1;
 });
 const note = board.querySelector('[data-peg-note]');
 if (note) note.textContent = btn.getAttribute('data-note') || '';
 setAsk(btn.getAttribute('data-differ') === '1' ? 'split' : 'same');
 };
 const pickAsk = (id) => {
 const board = document.getElementById('satskort');
 if (!board) return;
 if (id === 'kid') {
 setAsk('kid');
 const note = board.querySelector('[data-peg-note]');
 const src = board.querySelector('[data-kid-note]');
 if (note && src) note.textContent = src.textContent || '';
 return;
 }
 const pegId = id === 'same' ? board.getAttribute('data-same-peg') : board.getAttribute('data-split-peg');
 if (pegId) pickPeg(pegId);
 };
 const pickVenn = (id) => {
 const root = document.getElementById('klasselinje');
 if (!root) return;
 const buttons = [...root.querySelectorAll('[data-venn]')];
 const btn = buttons.find((b) => b.getAttribute('data-venn') === id) || buttons.find((b) => b.getAttribute('data-venn') === 'lens');
 if (!btn) return;
 buttons.forEach((b) => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
 const which = btn.getAttribute('data-venn');
 root.querySelectorAll('[data-venn-list]').forEach((ul) => {
 ul.hidden = ul.getAttribute('data-venn-list') !== which;
 });
 const note = root.querySelector('[data-life-note]');
 if (note) note.textContent = btn.getAttribute('data-note') || '';
 const stage = root.querySelector('.venn-stage');
 if (stage) stage.setAttribute('aria-label', btn.getAttribute('data-note') || '');
 };
 const pickLife = (id) => {
 const root = document.getElementById('klasselinje');
 if (!root) return;
 const buttons = [...root.querySelectorAll('[data-life]')];
 const btn = buttons.find((b) => b.getAttribute('data-life') === id) || buttons[0];
 if (!btn) return;
 const mode = btn.getAttribute('data-life');
 root.dataset.life = mode;
 root.classList.toggle('is-start', mode === 'start');
 root.classList.toggle('is-form', mode === 'form');
 root.classList.toggle('is-same', mode === 'same');
 root.classList.toggle('is-cross', mode === 'cross');
 buttons.forEach((b) => {
 const on = b === btn;
 b.setAttribute('aria-checked', on ? 'true' : 'false');
 b.tabIndex = on ? 0 : -1;
 });
 const note = root.querySelector('[data-life-note]');
 if (note) note.textContent = btn.getAttribute('data-note') || '';
 const plot = root.querySelector('.life-plot');
 if (plot) plot.setAttribute('aria-label', btn.getAttribute('data-note') || '');
 if (mode === 'cross') pickVenn('lens');
 const u = new URL(location.href);
 if (mode === 'start') u.searchParams.delete('linje');
 else u.searchParams.set('linje', mode);
 history.replaceState(null, '', u);
 };
 const wantLife = new URL(location.href).searchParams.get('linje');
 if (wantLife) pickLife(wantLife);
 const pickSum = (on, push) => {
 const root = document.getElementById('lineal');
 if (!root) return;
 root.classList.toggle('is-sum', on);
 root.querySelector('[data-sum="0"]')?.setAttribute('aria-pressed', on ? 'false' : 'true');
 root.querySelector('[data-sum="1"]')?.setAttribute('aria-pressed', on ? 'true' : 'false');
 const say = root.querySelector('[data-meet-say]');
 if (say) say.textContent = on ? (root.dataset.sumsay || '') : (root.dataset.plain || '');
 const chart = root.querySelector('.meet-chart');
 if (chart) chart.setAttribute('aria-label', say ? say.textContent : '');
 if (!push) return;
 const u = new URL(location.href);
 if (on) u.searchParams.set('sum', '1');
 else u.searchParams.delete('sum');
 history.replaceState(null, '', u);
 };
 main.addEventListener('click', (e) => {
 const venn = e.target.closest('[data-venn]');
 if (venn && venn.closest('#klasselinje')) {
 pickVenn(venn.getAttribute('data-venn'));
 return;
 }
 const life = e.target.closest('[data-life]');
 if (life && life.closest('#klasselinje')) {
 pickLife(life.getAttribute('data-life'));
 return;
 }
 const ask = e.target.closest('[data-ask]');
 if (ask && ask.closest('#satskort')) {
 pickAsk(ask.getAttribute('data-ask'));
 return;
 }
 const sumBtn = e.target.closest('#lineal [data-sum]');
 if (sumBtn) {
 pickSum(sumBtn.getAttribute('data-sum') === '1', true);
 return;
 }
 const peg = e.target.closest('[data-peg]');
 if (peg && peg.closest('#satskort')) {
 pickPeg(peg.getAttribute('data-peg'));
 return;
 }
 const btn = e.target.closest('[data-kid]');
 if (!btn || !document.getElementById('kid-hero')?.contains(btn)) return;
 paintKid(btn.getAttribute('data-kid'), true);
 openPair();
 });
 main.addEventListener('keydown', (e) => {
 const lifeBtn = e.target.closest && e.target.closest('#klasselinje [data-life]');
 if (lifeBtn && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
 const buttons = [...document.querySelectorAll('#klasselinje [data-life]')];
 const i = buttons.indexOf(lifeBtn);
 const next = buttons[i + (e.key === 'ArrowRight' ? 1 : -1)];
 if (!next) return;
 e.preventDefault();
 pickLife(next.getAttribute('data-life'));
 next.focus();
 return;
 }
 if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
 if (!e.target.closest || !e.target.closest('#satskort [data-peg]')) return;
 const buttons = [...document.querySelectorAll('#satskort [data-peg]')];
 const i = buttons.findIndex((b) => b.getAttribute('aria-checked') === 'true');
 const next = buttons[i + (e.key === 'ArrowDown' ? 1 : -1)];
 if (!next) return;
 e.preventDefault();
 pickPeg(next.getAttribute('data-peg'));
 next.focus();
 });
 window.addEventListener('keydown', (e) => {
 if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
 const ae = document.activeElement;
 if (ae && ae.closest('input, textarea, select, [contenteditable="true"]')) return;
 if (e.key === 'l' || e.key === 'c') {
 const root = document.getElementById('klasselinje');
 if (!root) return;
 e.preventDefault();
 if (e.key === 'c' && root.dataset.life === 'cross') {
 const order = ['lens', 'a', 'b'];
 const cur = root.querySelector('[data-venn][aria-pressed="true"]');
 const i = Math.max(0, order.indexOf(cur && cur.getAttribute('data-venn')));
 pickVenn(order[(i + 1) % order.length]);
 } else if (e.key === 'c') {
 pickLife('cross');
 } else {
 const buttons = [...root.querySelectorAll('[data-life]')];
 const i = Math.max(0, buttons.findIndex((b) => b.getAttribute('aria-checked') === 'true'));
 const next = buttons[(i + 1) % buttons.length];
 if (!next) return;
 pickLife(next.getAttribute('data-life'));
 }
 root.scrollIntoView({ block: 'nearest' });
 return;
 }
 if (e.key === 'g') {
 const root = document.getElementById('lineal');
 if (!root) return;
 e.preventDefault();
 pickSum(!root.classList.contains('is-sum'), true);
 root.scrollIntoView({ block: 'nearest' });
 return;
 }
 const askKey = { s: 'split', e: 'same', k: 'kid' }[e.key];
 if (askKey) {
 const askBtn = document.querySelector(`#satskort [data-ask="${askKey}"]`);
 if (!askBtn) return;
 e.preventDefault();
 pickAsk(askKey);
 return;
 }
 if (e.key !== '1' && e.key !== '5') return;
 if (!document.querySelector(`#kid-hero [data-kid="${e.key}"]`)) return;
 e.preventDefault();
 paintKid(e.key, true);
 openPair();
 });
 }
 </script>
</body>
