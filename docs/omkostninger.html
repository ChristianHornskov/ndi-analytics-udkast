<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Omkostninger · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Omkostninger · NDI Analytics">
 <meta property="og:description" content="Forventede omkostninger for PMINDI og PMINDIAKK ifølge Fundmarket. Generel information. Ikke rådgivning.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/omkostninger.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta name="twitter:card" content="summary_large_image">
 <style>
  .cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .cost-card{background:linear-gradient(180deg,#16303a 0%,#11252c 60%);border:1px solid #345860;border-radius:16px;padding:18px 18px 16px;min-width:0}
  .cost-card h2{font-size:18px;letter-spacing:-.3px;margin:0 0 8px}
  .kicker{color:var(--brand);font-size:11px;font-weight:700;letter-spacing:1.4px;margin-bottom:6px}
  .cmp{display:grid;gap:18px;margin-top:4px}
  .cmp-row{display:grid;gap:8px}
  .cmp-row.is-diff{border-left:3px solid var(--yellow);padding-left:12px}
  .cmp-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
  .cmp-flag{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
  .cmp-row.is-diff .cmp-flag{color:#f5ee9e}
  .cmp-line{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:center}
  .cmp-name{font-size:12px;color:var(--muted)}
  .cmp-line b{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:500;min-width:72px;text-align:right}
  .cost-bar{height:8px;border-radius:99px;background:#0b171d;border:1px solid #2a424a;overflow:hidden}
  .cost-bar i{display:block;height:100%;background:linear-gradient(90deg,#89aeb4,#9ecfd6);border-radius:99px}
  .scale-note{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5}
  .receipts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .receipt{background:#0b171d;border:1px solid #345860;border-top:7px solid #f5ee9e55;border-radius:2px 2px 16px 16px;padding:16px 16px 14px;min-width:0}
  .receipt h3{font-size:16px;letter-spacing:-.2px;margin:0 0 4px}
  .receipt ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:0}
  .receipt li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #2a424a;font-size:14px;background-image:linear-gradient(to right,#345860 1px,transparent 1px);background-size:7px 1px;background-repeat:repeat-x;background-position:0 1.05em}
  .receipt li > span,.receipt li > b{background:#0b171d;position:relative;z-index:1}
  .receipt li span{color:var(--muted)}
  .receipt li > span{padding-right:8px}
  .receipt li > b{padding-left:8px}
  .receipt .formula{display:block;font-size:11px;color:var(--faint);margin-top:2px;background:transparent}
  .receipt li b{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;white-space:nowrap}
  .receipt li.is-diff{box-shadow:inset 3px 0 0 var(--yellow);padding-left:10px}
  .receipt li.is-diff b{color:#f5ee9e}
  .delta-stage{margin:6px 0 16px;padding:18px 18px 16px;border-radius:16px;border:1px solid #f5ee9e55;background:radial-gradient(90% 90% at 100% 0%,rgba(245,238,158,.1),transparent 46%),linear-gradient(180deg,#16303a,#11252c)}
  .delta-stage h2{font-size:22px;letter-spacing:-.4px;margin:0 0 12px}
  .delta-nums{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:end}
  .delta-nums span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .delta-nums b{display:block;font-size:28px;font-weight:500;letter-spacing:-.6px;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1.1}
  .delta-nums small{display:block;margin-top:4px;font-size:12px;color:var(--faint)}
  .delta-mid{text-align:center;padding:0 8px 2px;align-self:center}
  .delta-nums .delta-mid b{color:#f5ee9e;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:clamp(48px,6.2vw,72px);font-weight:500;letter-spacing:-2.2px;line-height:.9}
  .delta-mid small{display:block;max-width:18ch;margin:6px auto 0;line-height:1.35}
  .receipt-gap{margin:12px 0 0;padding:12px 14px;border-left:3px solid var(--yellow);background:#0b171d;border-radius:0 12px 12px 0;color:var(--muted);font-size:14px;line-height:1.45}
  .receipt-gap b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .receipt-gap b.is-gap{color:#f5ee9e;font-size:18px}
  main .lede{margin-bottom:14px}
  .band{margin:8px 0}
  .delta-stage{margin:4px 0 14px}
  .delta-track{position:relative;height:12px;margin:18px 8px 6px;border-radius:99px;background:#0b171d;border:1px solid #2a424a}
  .delta-track .gap{position:absolute;top:50%;height:4px;transform:translateY(-50%);background:#f5ee9e99;border-radius:99px;z-index:0;display:block;overflow:hidden;padding:0;margin:0;font-size:0;line-height:0}
  .delta-track i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:#9ecfd6;border:2px solid #0c1c22;z-index:1}
  .delta-track i.b{background:#f5ee9e}
  .delta-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
  .delta-key{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 0;font-size:12px;color:var(--muted)}
  .delta-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .delta-key i.a{background:#9ecfd6}
  .delta-key i.b{background:#f5ee9e}
  .delta-zoom{margin-top:12px;padding-top:12px;border-top:1px dashed #345860}
  .delta-zoom .k{font-size:11px;letter-spacing:1.2px;font-weight:700;color:var(--brand);margin:0 0 8px}
  .receipt-bridge{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;text-align:center;min-width:0;margin:0;padding:12px 10px;border:1px solid #f5ee9e55;border-radius:14px;background:radial-gradient(80% 90% at 50% 0%,rgba(245,238,158,.16),transparent 68%),#0b171d}
  .receipt-bridge b{color:#f5ee9e;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:28px;font-weight:500;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1}
  .receipt-bridge span{color:var(--faint);font-size:11px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
  .kr-line{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding-top:12px;border-top:1px solid #345860;font-size:13px;color:var(--muted);line-height:1.4}
  .kr-line b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .kr-line b.is-gap{color:#f5ee9e}
  .metrics .metric.is-echo strong{color:var(--muted);font-size:22px}
  @media(min-width:801px){
    .receipts:has(.receipt-bridge){grid-template-columns:minmax(0,1fr) 118px minmax(0,1fr);align-items:center}
    .receipt-bridge{flex-direction:column;gap:4px;padding:16px 8px}
  }
  @media(max-width:800px){
    .cost-grid,.receipts{grid-template-columns:1fr}
    .cmp-line{grid-template-columns:72px minmax(0,1fr) auto}
    .delta-nums{grid-template-columns:1fr;gap:12px}
    .delta-mid{order:-1;text-align:left;padding:0}
    .delta-nums .delta-mid small{margin-left:0;max-width:none}
  }
 </style>
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html?view=fonden">← Fonden</a><a href="fakta.html">Fakta</a><a href="risici.html">Risici</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter…</p></main>
 <footer class="site-footer">
 <p>Udkast / noindex. Forventede satser fra Fundmarket. Ikke et ÅOP. Ikke rådgivning.</p>
 </footer>
 <script type="module">
 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const main = document.getElementById('main');
 const pct = (n) => {
 if (n == null || n === '' || Number.isNaN(Number(n))) return 'ikke oplyst';
 const [a, b = ''] = String(n).split('.');
 return a + (b ? ',' + b : '') + ' %';
 };
 const pp = (n) => {
 const [a, b = ''] = String(n).split('.');
 return a + (b ? ',' + b : '') + ' procentpoint';
 };
 const pct2 = (n) => {
 const [a, b] = Math.abs(Number(n)).toFixed(2).split('.');
 return (Number(n) < 0 ? '-' : '') + a + ',' + b + ' %';
 };
 const krOf = (rate) => Math.round(100000 * Number(rate) / 100);
 const kr = (rate) => {
 const v = krOf(rate);
 const s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
 return (v < 0 ? '-' : '') + s + ' kr.';
 };
 const SCALE = 2;
 const bar = (n) => {
 const w = Math.max(0, Math.min(100, (Number(n) / SCALE) * 100));
 return `<div class="cost-bar" role="presentation"><i style="width:${w}%"></i></div>`;
 };
 const pair = (label, av, bv) => {
 const differ = Number(av) !== Number(bv);
 return `<div class="cmp-row${differ ? ' is-diff' : ''}">
 <div class="cmp-h"><span>${esc(label)}</span><span class="cmp-flag">${differ ? 'Forskel' : 'Ens'}</span></div>
 <div class="cmp-line"><span class="cmp-name">PMINDI</span>${bar(av)}<b>${pct(av)}</b></div>
 <div class="cmp-line"><span class="cmp-name">PMINDIAKK</span>${bar(bv)}<b>${pct(bv)}</b></div>
 </div>`;
 };
 const line = (label, rate, diff) => `<li class="${diff ? 'is-diff' : ''}"><span>${esc(label)}<span class="formula">${pct(rate)} × 100.000 kr.</span></span><b>${kr(rate)}</b></li>`;
 let facts;
 try {
 const r = await fetch('data/fund-facts.json');
 if (!r.ok) throw new Error('facts');
 facts = await r.json();
 } catch {
 main.innerHTML = `<p class="eyebrow">OMKOSTNINGER</p><h1>Hvad koster fonden?</h1><p class="band">data/fund-facts.json kunne ikke læses. Der vises ingen omkostningstal.</p>`;
 }
 if (facts) {
 const A = facts.classes.pmindi;
 const B = facts.classes.pmindiakk;
 const a = A.costs;
 const b = B.costs;
 const feeNo = !a.performanceFee && !b.performanceFee;
 const feeSame = a.performanceFee === b.performanceFee && a.performanceFeeText === b.performanceFeeText;
 const dTx = Number((Number(b.portfolioTransaction) - Number(a.portfolioTransaction)).toFixed(2));
 const sameEntry = Number(a.entry) === Number(b.entry) && Number(a.exit) === Number(b.exit);
 const sameOngoing = Number(a.otherOngoing) === Number(b.otherOngoing);
 const onlyTx = dTx !== 0 && sameOngoing && sameEntry && feeNo;
 const krGap = Math.abs(krOf(b.portfolioTransaction) - krOf(a.portfolioTransaction));
 const krGapTxt = String(krGap).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' kr.';
 const mark = (n) => Math.max(0, Math.min(100, (Number(n) / SCALE) * 100));
 const zoomOf = (lo, hi) => {
 const gap = hi - lo;
 const span = Math.max(gap / 0.2, 0.16);
 let z0 = lo - (span - gap) / 2;
 let z1 = z0 + span;
 if (z0 < 0) { z1 -= z0; z0 = 0; }
 z0 = Math.floor(z0 * 100) / 100;
 z1 = Math.ceil((z1) * 100) / 100;
 if (z1 <= z0) z1 = Number((z0 + 0.01).toFixed(2));
 return { z0, z1 };
 };
 const zMark = (n, z0, z1) => {
 const span = z1 - z0;
 if (!(span > 0)) return 0;
 return Math.max(0, Math.min(100, ((Number(n) - z0) / span) * 100));
 };
 const gapBar = (left, width) => `<b class="gap" style="left:${left}%;width:${Math.max(width, 0)}%"></b>`;
 const loTx = Math.min(Number(a.portfolioTransaction), Number(b.portfolioTransaction));
 const hiTx = Math.max(Number(a.portfolioTransaction), Number(b.portfolioTransaction));
 const zoom = dTx === 0 ? null : zoomOf(loTx, hiTx);
 const zoomBlock = zoom ? (() => {
 const left = zMark(loTx, zoom.z0, zoom.z1);
 const right = zMark(hiTx, zoom.z0, zoom.z1);
 return `<div class="delta-zoom">
 <p class="k">Udsnit, forstørret · ${pct2(zoom.z0)} til ${pct2(zoom.z1)}</p>
 <div class="delta-track" role="img" aria-label="Forstørret udsnit fra ${pct2(zoom.z0)} til ${pct2(zoom.z1)}. PMINDI ${pct(a.portfolioTransaction)} og PMINDIAKK ${pct(b.portfolioTransaction)}. Afstanden på figuren er større end på skalaen 0 til ${pct(SCALE)}. Forskellen er stadig ${pp(Math.abs(dTx))}.">${gapBar(left, right - left)}<i class="a" style="left:${zMark(a.portfolioTransaction, zoom.z0, zoom.z1)}%"></i><i class="b" style="left:${zMark(b.portfolioTransaction, zoom.z0, zoom.z1)}%"></i></div>
 <div class="delta-ends" aria-hidden="true"><span>${pct2(zoom.z0)}</span><span>${pct2(zoom.z1)}</span></div>
 </div>`;
 })() : '';
 const fullLeft = mark(loTx);
 const fullWidth = mark(hiTx) - fullLeft;
 const ongoingBits = sameOngoing
 ? `<b>${kr(a.otherOngoing)}</b> øvrige løbende, begge`
 : `<b>${kr(a.otherOngoing)}</b> og <b>${kr(b.otherOngoing)}</b> øvrige løbende`;
 const entryBits = sameEntry
 ? `<b>${kr(a.entry)}</b> emission og <b>${kr(a.exit)}</b> indløsning, maks., begge`
 : `PMINDI <b>${kr(a.entry)}</b> / <b>${kr(a.exit)}</b> · PMINDIAKK <b>${kr(b.entry)}</b> / <b>${kr(b.exit)}</b>, maks.`;
 const krLine = dTx === 0 ? '' : `<p class="kr-line"><span>${ongoingBits}</span><span><b>${kr(a.portfolioTransaction)}</b> og <b class="is-gap">${kr(b.portfolioTransaction)}</b> porteføljetransaktion</span><span>${entryBits}</span><span>Linjerne er ikke lagt sammen.</span></p>`;
 const deltaStage = dTx === 0 ? '' : `<section class="delta-stage" id="forskel">
 <p class="kicker">${onlyTx ? 'DEN ENE FORSKEL' : 'PORTEFØLJETRANSAKTION'}</p>
 <h2>${onlyTx ? 'Porteføljetransaktion skiller klasserne' : 'Porteføljetransaktion'}</h2>
 <div class="delta-nums">
 <div><span>PMINDI</span><b>${pct(a.portfolioTransaction)}</b><small>${kr(a.portfolioTransaction)} på 100.000 kr.</small></div>
 <div class="delta-mid"><span>på 100.000 kr.</span><b>${krGapTxt}</b><small>${pp(Math.abs(dTx))} · kun denne linje · ikke et ÅOP</small></div>
 <div><span>PMINDIAKK</span><b>${pct(b.portfolioTransaction)}</b><small>${kr(b.portfolioTransaction)} på 100.000 kr.</small></div>
 </div>
 <div class="delta-track" role="img" aria-label="PMINDI ${pct(a.portfolioTransaction)} og PMINDIAKK ${pct(b.portfolioTransaction)} på en skala fra 0 til ${pct(SCALE)}">${gapBar(fullLeft, fullWidth)}<i class="a" style="left:${mark(a.portfolioTransaction)}%"></i><i class="b" style="left:${mark(b.portfolioTransaction)}%"></i></div>
 <div class="delta-ends" aria-hidden="true"><span>0 %</span><span>${pct(SCALE)}</span></div>
 <p class="delta-key"><span><i class="a"></i>PMINDI ${pct(a.portfolioTransaction)}</span><span><i class="b"></i>PMINDIAKK ${pct(b.portfolioTransaction)}</span></p>
 ${zoomBlock}
 <p class="scale-note">Skalaen er 0 til ${pct(SCALE)}. Udsnittet er forstørret, så markørerne kan skelnes. Forskellen er stadig ${pp(Math.abs(dTx))}, ${krGapTxt} på 100.000 kr. Ikke et ÅOP.</p>
 ${krLine}
 </section>`;
 const receiptGap = dTx === 0 ? '' : `<p class="receipt-gap">Porteføljetransaktion på 100.000 kr. er ${kr(a.portfolioTransaction)} i PMINDI og ${kr(b.portfolioTransaction)} i PMINDIAKK. Forskellen er <b class="is-gap">${krGapTxt}</b> ${onlyTx ? 'De andre linjer er ens. ' : ''}Ingen linje er lagt sammen. Ikke et ÅOP.</p>`;
 const spoken = onlyTx
 ? `Porteføljetransaktion er den eneste af satserne, der ikke er ens: ${pct(a.portfolioTransaction)} i PMINDI og ${pct(b.portfolioTransaction)} i PMINDIAKK. Forskellen er ${pp(Math.abs(dTx))}. På 100.000 kr. er det ${krGapTxt} i regneeksemplet. Det er ikke et ÅOP.`
 : dTx === 0
 ? 'Porteføljetransaktion er ens i de to klasser i Fundmarket-tallene.'
 : `Porteføljetransaktion er ${pct(a.portfolioTransaction)} i PMINDI og ${pct(b.portfolioTransaction)} i PMINDIAKK. Forskellen er ${pp(Math.abs(dTx))}.`;
 const sameLine = sameOngoing
 ? `Øvrige løbende er ${pct(a.otherOngoing)} i begge klasser.`
 : `Øvrige løbende er ${pct(a.otherOngoing)} i PMINDI og ${pct(b.otherOngoing)} i PMINDIAKK.`;
 const entryLine = sameEntry
 ? `Emission og indløsning er angivet som maks. ${pct(a.entry)} og ${pct(a.exit)} for begge klasser.`
 : `PMINDI: emission ${pct(a.entry)}, indløsning ${pct(a.exit)}. PMINDIAKK: emission ${pct(b.entry)}, indløsning ${pct(b.exit)}.`;
 const feeLine = feeNo
 ? 'Ingen af klasserne betaler resultathonorar, ifølge Fundmarket.'
 : feeSame
 ? esc(a.performanceFeeText)
 : `${esc(a.performanceFeeText)} ${esc(b.performanceFeeText)}`;
 const card = (cl) => {
 const c = cl.costs;
 return `<article class="cost-card">
 <p class="kicker">${esc(cl.isin)}</p>
 <h2>${esc(cl.label)}</h2>
 <p style="color:var(--muted);font-size:14px;line-height:1.5">${cl.distributing ? 'Udloddende' : 'Akkumulerende'} klasse. Resultathonorar: <strong style="color:var(--text)">${c.performanceFee ? 'Ja' : 'Nej'}</strong>. ${esc(c.performanceFeeText)}</p>
 <p class="src">${esc(c.note)}</p>
 <p class="link-row" style="margin-top:12px">
 <a class="outline-btn small" href="${esc(c.source)}" rel="noopener noreferrer" target="_blank">Fundmarket ↗</a>
 <a class="outline-btn small" href="${esc(cl.kidUrl)}" rel="noopener noreferrer" target="_blank">KID PDF ↗</a>
 </p>
 </article>`;
 };

 main.innerHTML = `
 <p class="eyebrow">OMKOSTNINGER · FUNDMARKET</p>
 <h1>Hvad koster fonden?</h1>
 <p class="lede">Forventede omkostninger i indeværende regnskabsår, som de står på Fundmarket. Det er ikke et beregnet ÅOP. Kurtage og depot hos din bank kommer oveni.</p>
 <p class="band">${esc(facts.asOfNote)}</p>
 ${deltaStage}
 <div class="metrics">
 <div class="metric"><div class="label">Øvrige løbende${sameOngoing ? ', begge klasser' : ', PMINDI / AKK'}</div><strong>${sameOngoing ? pct(a.otherOngoing) : pct(a.otherOngoing) + ' / ' + pct(b.otherOngoing)}</strong><small>Forventet · Fundmarket</small></div>
 <div class="metric is-echo"><div class="label">Porteføljetransaktion, PMINDI</div><strong>${pct(a.portfolioTransaction)}</strong><small>Forventet · samme tal som ovenfor</small></div>
 <div class="metric is-echo"><div class="label">Porteføljetransaktion, PMINDIAKK</div><strong>${pct(b.portfolioTransaction)}</strong><small>Forventet · samme tal som ovenfor</small></div>
 <div class="metric"><div class="label">Resultathonorar</div><strong>${feeNo ? 'Nej' : 'Se klasser'}</strong><small>${feeNo ? 'Begge klasser · Fundmarket' : 'Se teksten på klassekortet'}</small></div>
 </div>
 <p class="band">${onlyTx ? `Kun porteføljetransaktion skiller klasserne. ${sameLine} ${entryLine} ${feeLine} Ikke et ÅOP.` : `${spoken} ${sameLine} ${entryLine} ${feeLine}`}</p>

 <section class="panel">
 <h2 class="panel-h">Sammenligning</h2>
 <div class="cmp">
 ${pair('Øvrige løbende', a.otherOngoing, b.otherOngoing)}
 ${pair('Porteføljetransaktion', a.portfolioTransaction, b.portfolioTransaction)}
 ${pair('Emission, maks.', a.entry, b.entry)}
 ${pair('Indløsning, maks.', a.exit, b.exit)}
 </div>
 <p class="scale-note">Søjlerne deler skalaen 0 til ${pct(SCALE)}. En lav sats tegnes smal. Forskellen mellem ${pct(a.portfolioTransaction)} og ${pct(b.portfolioTransaction)} er bevidst lille på figuren. ${pct(a.otherOngoing)} er Fundmarkets tal for øvrige løbende omkostninger. Noten på kilden kalder dem forventede samlede omkostninger i regnskabsåret. Siden lægger ikke satserne sammen og kalder det ikke et ÅOP.</p>
 <div class="table-wrap"><table class="data" style="min-width:0">
 <thead><tr><th></th><th>PMINDI</th><th>PMINDIAKK</th></tr></thead>
 <tbody>
 <tr><td>Øvrige løbende</td><td>${pct(a.otherOngoing)}</td><td>${pct(b.otherOngoing)}</td></tr>
 <tr><td>Porteføljetransaktion</td><td>${pct(a.portfolioTransaction)}</td><td>${pct(b.portfolioTransaction)}</td></tr>
 <tr><td>Emission, maks.</td><td>${pct(a.entry)}</td><td>${pct(b.entry)}</td></tr>
