<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Omkostninger · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Omkostninger · NDI Analytics">
 <meta property="og:description" content="Forventede omkostninger for PMINDI og PMINDIAKK ifølge Fundmarket. Generel information. Ikke rådgivning.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/omkostninger.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta name="twitter:card" content="summary_large_image">
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html?view=fonden">← Fonden</a><a href="fakta.html">Fakta</a><a href="risici.html">Risici</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter…</p></main>
 <script type="module">
 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const pct = (n) => (n == null ? '—' : String(n).replace('.', ',') + ' %');
 const facts = await fetch('data/fund-facts.json').then(r => r.json());
 const block = (cl) => {
 const c = cl.costs;
 return `
 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:8px">${esc(cl.label)}</h2>
 <p class="src" style="margin-bottom:12px">ISIN <code>${esc(cl.isin)}</code></p>
 <div class="metrics">
 <div class="metric"><div class="label">Øvrige løbende</div><strong>${pct(c.otherOngoing)}</strong><small>Forventet</small></div>
 <div class="metric"><div class="label">Porteføljetransaktion</div><strong>${pct(c.portfolioTransaction)}</strong><small>Forventet</small></div>
 <div class="metric"><div class="label">Emission / indløsning</div><strong>${pct(c.entry)} / ${pct(c.exit)}</strong><small>Maks. ifølge Fundmarket</small></div>
 </div>
 <ul style="color:var(--muted);line-height:1.55;padding-left:1.2rem;margin-top:14px;display:grid;gap:6px">
 <li>Resultathonorar: <strong style="color:var(--text)">${c.performanceFee ? 'Ja' : 'Nej'}</strong> — ${esc(c.performanceFeeText)}</li>
 <li>${esc(c.note)}</li>
 </ul>
 <p class="src" style="margin-top:10px">Kilde: <a href="${esc(c.source)}" rel="noopener" target="_blank">Fundmarket ↗</a> · <a href="${esc(cl.kidUrl)}" rel="noopener" target="_blank">KID PDF ↗</a></p>
 </section>`;
 };
 document.getElementById('main').innerHTML = `
 <p class="eyebrow">OMKOSTNINGER · FUNDMARKET</p>
 <h1>Hvad koster fonden?</h1>
 <p class="lede">Forventede samlede omkostninger i indeværende regnskabsår ifølge Fundmarket. Tallene er offentlige produktside-tal — ikke et inventeret ÅOP. Platformkurtage og depotgebyrer er ekstra.</p>
 <p class="band">${esc(facts.asOfNote)}</p>
 ${block(facts.classes.pmindi)}
 ${block(facts.classes.pmindiakk)}
 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:8px">Sammenligning</h2>
 <div class="table-wrap"><table class="data" style="min-width:0">
 <thead><tr><th></th><th>PMINDI</th><th>PMINDIAKK</th></tr></thead>
 <tbody>
 <tr><td>Øvrige løbende</td><td>${pct(facts.classes.pmindi.costs.otherOngoing)}</td><td>${pct(facts.classes.pmindiakk.costs.otherOngoing)}</td></tr>
 <tr><td>Porteføljetransaktion</td><td>${pct(facts.classes.pmindi.costs.portfolioTransaction)}</td><td>${pct(facts.classes.pmindiakk.costs.portfolioTransaction)}</td></tr>
 <tr><td>Emission / indløsning</td><td>${pct(facts.classes.pmindi.costs.entry)} / ${pct(facts.classes.pmindi.costs.exit)}</td><td>${pct(facts.classes.pmindiakk.costs.entry)} / ${pct(facts.classes.pmindiakk.costs.exit)}</td></tr>
 <tr><td>Resultathonorar</td><td>Nej</td><td>Nej</td></tr>
 </tbody>
 </table></div>
 <p class="src" style="margin-top:10px">AKK har lidt højere forventet porteføljetransaktionsomkostning i Fundmarket-tallene (0,72 % vs 0,64 %). Begge klasser: ingen resultathonorar.</p>
 </section>
 <p class="warn">Afkasttal på NDI Analytics er efter fondens løbende omkostninger, før din egen kurtage/depot. Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast.</p>
 <p><a class="cta" href="fakta.html">Fakta →</a>
 <a class="outline-btn" style="margin-left:8px" href="risici.html">Risici / KID →</a>
 <a class="outline-btn" style="margin-left:8px" href="sammenlign.html">Sammenlign klasser →</a></p>`;
 </script>
</body>
</html>
