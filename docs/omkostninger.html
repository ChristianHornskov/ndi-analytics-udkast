 <style>
  .cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .cost-card{background:linear-gradient(180deg,#16303a 0%,#11252c 60%);border:1px solid #345860;border-radius:16px;padding:18px 18px 16px;min-width:0}
  .cost-card h2{font-size:18px;letter-spacing:-.3px;margin:0 0 8px}
  .kicker{color:var(--brand);font-size:11px;font-weight:700;letter-spacing:1.4px;margin-bottom:6px}
  .cmp{display:grid;gap:18px;margin-top:4px}
  .cmp-row{display:grid;gap:8px}
  .cmp-row.is-diff{border-left:3px solid var(--yellow);padding-left:12px}
  .cmp-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
  .cmp-flag{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
  .cmp-row.is-diff .cmp-flag{color:#f5ee9e}
  .cmp-line{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:center}
  .cmp-name{font-size:12px;color:var(--muted)}
  .cmp-line b{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:500;min-width:72px;text-align:right}
  .cost-bar{height:8px;border-radius:99px;background:#0b171d;border:1px solid #2a424a;overflow:hidden}
  .cost-bar i{display:block;height:100%;background:linear-gradient(90deg,#89aeb4,#9ecfd6);border-radius:99px}
  .scale-note{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5}
  .receipts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .receipt{background:#0b171d;border:1px solid #345860;border-radius:16px;padding:16px 16px 14px;min-width:0}
  .receipt h3{font-size:16px;letter-spacing:-.2px;margin:0 0 4px}
  .receipt ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:0}
  .receipt li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #2a424a;font-size:14px}
  .receipt li span{color:var(--muted)}
  .receipt .formula{display:block;font-size:11px;color:var(--faint);margin-top:2px}
  .receipt li b{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;white-space:nowrap}
  .receipt li.is-diff{box-shadow:inset 3px 0 0 var(--yellow);padding-left:10px}
  .delta-stage{margin:6px 0 16px;padding:18px 18px 16px;border-radius:16px;border:1px solid #f5ee9e55;background:radial-gradient(90% 90% at 100% 0%,rgba(245,238,158,.1),transparent 46%),linear-gradient(180deg,#16303a,#11252c)}
  .delta-stage h2{font-size:22px;letter-spacing:-.4px;margin:0 0 12px}
  .delta-nums{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:end}
  .delta-nums span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .delta-nums b{display:block;font-size:28px;font-weight:500;letter-spacing:-.6px;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1.1}
  .delta-nums small{display:block;margin-top:4px;font-size:12px;color:var(--faint)}
  .delta-mid{text-align:center;padding:0 6px 2px}
  .delta-mid b{color:#f5ee9e;font-size:22px}
  main .lede{margin-bottom:14px}
  .band{margin:8px 0}
  .delta-stage{margin:4px 0 14px}
  .delta-track{position:relative;height:12px;margin:18px 8px 6px;border-radius:99px;background:#0b171d;border:1px solid #2a424a}
  .delta-track .gap{position:absolute;top:50%;height:4px;transform:translateY(-50%);background:#f5ee9e99;border-radius:99px;z-index:0;display:block;overflow:hidden;padding:0;margin:0;font-size:0;line-height:0}
  .delta-track i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:#9ecfd6;border:2px solid #0c1c22;z-index:1}
  .delta-track i.b{background:#f5ee9e}
  .delta-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
  .delta-zoom{margin-top:12px;padding-top:12px;border-top:1px dashed #345860}
  .delta-zoom .k{font-size:11px;letter-spacing:1.2px;font-weight:700;color:var(--brand);margin:0 0 8px}
  .cost-hero{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;margin:0 0 14px}
  .cost-hero.is-pair{grid-template-columns:minmax(0,1.2fr) auto minmax(210px,.78fr)}
  .cost-neq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0;text-align:center;color:#f5ee9e}
  .cost-neq .mark{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:44px;line-height:.85}
  .cost-neq .word{font-size:12px;letter-spacing:.3px;text-transform:uppercase;line-height:1.25;color:var(--muted);max-width:12ch}
  .cost-hero.is-same .cost-neq .word{color:#f5ee9e}
  .cost-hero.is-same .cost-neq .mark{text-shadow:0 0 18px rgba(245,238,158,.7)}
  #forskel.is-match{box-shadow:inset 0 0 0 1px #f5ee9e66}
  #forskel.is-match .delta-mid b,.kr-chips li.is-gap.is-match em{text-shadow:0 0 16px rgba(245,238,158,.55)}
  .kr-chips li.is-gap.is-match{box-shadow:inset 3px 0 0 var(--yellow),0 0 0 1px #f5ee9e55}
  .cost-hero.is-same .cost-hero-kid{box-shadow:inset 0 0 0 1px #f5ee9e88}
  .cost-hero.is-same .cost-hero-nums em{font-size:56px;letter-spacing:-1.5px;line-height:.9}
  .cost-hero.is-same [data-kid-gap],.cost-hero.is-same .gap-kr{text-shadow:0 0 16px rgba(245,238,158,.55)}
  .cost-hero article{display:flex;flex-direction:column;border-radius:16px;padding:14px 16px 12px;min-width:0}
  .match-rail{width:168px;max-width:100%;align-self:flex-start;height:6px;margin-top:auto;border-radius:99px;background:#0b171d;box-shadow:inset 0 0 0 1px #2a424a;overflow:hidden;flex:0 0 auto}
  .match-rail i{display:block;height:6px;border-radius:99px;background:#89aeb4}
  .cost-hero-gap .match-rail i,.cost-hero.is-same .match-rail i{background:#f5ee9e}
  .cost-hero.is-same .match-rail{box-shadow:0 0 12px rgba(245,238,158,.45), inset 0 0 0 1px #2a424a}
  .cost-hero-kid{border:1px solid #345860;background:linear-gradient(180deg,#16303a,#11252c)}
  .cost-hero-gap{border:1px solid #f5ee9e55;background:radial-gradient(90% 90% at 100% 0%,rgba(245,238,158,.12),transparent 50%),linear-gradient(180deg,#16303a,#11252c)}
  .cost-hero-nums{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
  .cost-hero-nums span,.cost-hero-gap .gap-sub{display:block;font-size:12px;color:var(--muted)}
  .cost-hero-nums b,.cost-hero-nums em{display:block;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:500;letter-spacing:-.8px;line-height:.95;font-style:normal}
  .cost-hero-nums b{font-size:32px;color:var(--cyan)}
  .cost-hero-nums em{font-size:28px;color:#f5ee9e;text-align:center}
  .cost-hero-nums small,.cost-hero-gap .gap-note{display:block;margin-top:4px;font-size:12px;color:var(--faint);line-height:1.35}
  .cost-hero .mid{text-align:center;padding-bottom:2px}
  .gap-kr{margin:2px 0 6px;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:56px;font-weight:500;letter-spacing:-1.6px;line-height:.9;color:#f5ee9e}
  .cost-hero-gap .gap-sub b{color:var(--cyan);font-weight:600}
  .cost-hero-gap .gap-eq{margin:3px 0 0;font-size:13px;line-height:1.35;color:#f5ee9e}
  .cost-hero-note{margin:8px 0 0;font-size:12px;color:var(--faint);line-height:1.35}
  .kid-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 8px}
  .kid-head .kicker{margin:0}
  .kid-switch{display:flex;gap:4px;flex:none}
  .kid-switch button{appearance:none;border:1px solid #345860;background:#0b171d;color:var(--muted);border-radius:999px;padding:4px 8px 4px 10px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;min-height:32px}
  .kid-switch button b{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:500;font-size:14px;letter-spacing:-.3px;color:#c5d6db}
  .kid-switch button[aria-pressed="true"]{border-color:#f5ee9e88;color:var(--text);box-shadow:inset 0 -2px 0 #f5ee9e}
  .kid-switch button[aria-pressed="true"] b{color:#f5ee9e}
  .kid-switch button:focus-visible{outline:2px solid #f5ee9e;outline-offset:2px}
  #kid-omkostning tr.is-on td:first-child{box-shadow:inset 3px 0 0 #f5ee9e;color:var(--text)}
  .kr-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;list-style:none;padding:8px 0 0;margin:8px 0 0;border-top:1px solid #345860}
  .kr-chips li{background:#0b171d;border:1px solid #345860;border-radius:12px;padding:8px 10px 7px;min-width:0}
  .kr-chips b{display:block;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.3px;color:var(--text);line-height:1.1}
  .kr-chips li > span{display:block;margin-top:4px;color:var(--faint);font-size:11px;line-height:1.3}
  .kr-chips li.is-gap{border-color:#f5ee9e66;box-shadow:inset 3px 0 0 var(--yellow)}
  .kr-chips .kr-pair{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
  .kr-chips .kr-pair b{display:inline;font-size:14px;color:var(--cyan);font-weight:600}
  .kr-chips .kr-pair em{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-style:normal;font-weight:500;font-size:22px;letter-spacing:-.5px;color:#f5ee9e;line-height:1}
  .kr-aside{margin:8px 0 0;color:var(--faint);font-size:12px}
  @media(max-width:800px){
    .cost-grid,.receipts,.kr-chips{grid-template-columns:1fr}
    .cost-hero.is-pair{grid-template-columns:1fr}
    .cost-neq{flex-direction:row;gap:10px;padding:2px 0}
    .cost-neq .word{max-width:none}
    .kr-chips{grid-template-columns:1fr 1fr}
    .cmp-line{grid-template-columns:72px minmax(0,1fr) auto}
    .delta-nums{grid-template-columns:1fr;gap:12px}
    .delta-mid{text-align:left;padding:0}
    .cost-hero-nums{gap:8px}
    .cost-hero-nums b{font-size:26px}
    .cost-hero-nums em{font-size:20px}
    .gap-kr{font-size:44px}
    .cost-hero.is-same .cost-hero-nums em{font-size:44px;letter-spacing:-1px}
  }
 </style>

 <main id="main"><p style="color:var(--muted)">Henter…</p></main>
 <footer class="site-footer">
 <p class="eyebrow" style="margin-bottom:4px">Markedsføringsmateriale</p>
 <p data-kid-footer>Dokument med central information (KID): <a href="https://node-api.fundmarket.dk/funds/documents/priip_ipm140b">PMINDI ↗</a> · <a href="https://node-api.fundmarket.dk/funds/documents/priip_ipm145b">PMINDIAKK ↗</a>. Prospekt: <a href="https://fundmarket.dk/wp-content/uploads/Faellesprospekt-for-afdelinger-og-andelsklasser-i-Investeringsforeningen-Portfoliomanager-opdateret-24.10.2025.pdf">Fællesprospekt ↗</a>.</p>
 <p>Udkast / noindex. KID-omkostningsindikator + Fundmarket-postsatser. Ikke et ÅOP. Du kan tabe penge. Ikke rådgivning.</p>
 </footer>
 <script type="module">
 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const main = document.getElementById('main');
 const pct = (n) => {
 if (n == null || n === '' || Number.isNaN(Number(n))) return 'ikke oplyst';
 const [a, b = ''] = String(n).split('.');
 return a + (b ? ',' + b : '') + ' %';
 };
 const pp = (n) => {
 const [a, b = ''] = String(n).split('.');
 return a + (b ? ',' + b : '') + ' procentpoint';
 };
 const pct2 = (n) => {
 const [a, b] = Math.abs(Number(n)).toFixed(2).split('.');
 return (Number(n) < 0 ? '-' : '') + a + ',' + b + ' %';
 };
 const krOf = (rate) => Math.round(100000 * Number(rate) / 100);
 const kr = (rate) => {
 const v = krOf(rate);
 const s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
 return (v < 0 ? '-' : '') + s + ' kr.';
 };
 const SCALE = 2;
 const bar = (n) => {
 const w = Math.max(0, Math.min(100, (Number(n) / SCALE) * 100));
 return `<div class="cost-bar" role="presentation"><i style="width:${w}%"></i></div>`;
 };
 const pair = (label, av, bv) => {
 const differ = Number(av) !== Number(bv);
 return `<div class="cmp-row${differ ? ' is-diff' : ''}">
 <div class="cmp-h"><span>${esc(label)}</span><span class="cmp-flag">${differ ? 'Forskel' : 'Ens'}</span></div>
 <div class="cmp-line"><span class="cmp-name">PMINDI</span>${bar(av)}<b>${pct(av)}</b></div>
 <div class="cmp-line"><span class="cmp-name">PMINDIAKK</span>${bar(bv)}<b>${pct(bv)}</b></div>
 </div>`;
 };
 const line = (label, rate, diff) => `<li class="${diff ? 'is-diff' : ''}"><span>${esc(label)}<span class="formula">${pct(rate)} × 100.000 kr.</span></span><b>${kr(rate)}</b></li>`;
 let facts;
 try {
 const r = await fetch('data/fund-facts.json');
 if (!r.ok) throw new Error('facts');
 facts = await r.json();
 } catch {
 main.innerHTML = `<p class="eyebrow">OMKOSTNINGER</p><h1>Hvad koster fonden?</h1><p class="band">data/fund-facts.json kunne ikke læses. Der vises ingen omkostningstal.</p>`;
 }
 if (facts) {
 const A = facts.classes.pmindi;
 const B = facts.classes.pmindiakk;
 const a = A.costs;
 const b = B.costs;
 const feeNo = !a.performanceFee && !b.performanceFee;
 const feeSame = a.performanceFee === b.performanceFee && a.performanceFeeText === b.performanceFeeText;
 const dTx = Number((Number(b.portfolioTransaction) - Number(a.portfolioTransaction)).toFixed(2));
 const sameEntry = Number(a.entry) === Number(b.entry) && Number(a.exit) === Number(b.exit);
 const sameOngoing = Number(a.otherOngoing) === Number(b.otherOngoing);
 const onlyTx = dTx !== 0 && sameOngoing && sameEntry && feeNo;
 const krGap = Math.abs(krOf(b.portfolioTransaction) - krOf(a.portfolioTransaction));
 const krGapTxt = String(krGap).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' kr.';
 const mark = (n) => Math.max(0, Math.min(100, (Number(n) / SCALE) * 100));
 const zoomOf = (lo, hi) => {
 const gap = hi - lo;
 const span = Math.max(gap / 0.2, 0.16);
 let z0 = lo - (span - gap) / 2;
 let z1 = z0 + span;
 if (z0 < 0) { z1 -= z0; z0 = 0; }
 z0 = Math.floor(z0 * 100) / 100;
 z1 = Math.ceil((z1) * 100) / 100;
 if (z1 <= z0) z1 = Number((z0 + 0.01).toFixed(2));
 return { z0, z1 };
 };
 const zMark = (n, z0, z1) => {
 const span = z1 - z0;
 if (!(span > 0)) return 0;
 return Math.max(0, Math.min(100, ((Number(n) - z0) / span) * 100));
 };
 const gapBar = (left, width) => `<b class="gap" style="left:${left}%;width:${Math.max(width, 0)}%"></b>`;
 const loTx = Math.min(Number(a.portfolioTransaction), Number(b.portfolioTransaction));
 const hiTx = Math.max(Number(a.portfolioTransaction), Number(b.portfolioTransaction));
 const zoom = dTx === 0 ? null : zoomOf(loTx, hiTx);
 const krChip = (amount, label) => `<li><b>${amount}</b><span>${label}</span></li>`;
 const ongoingChips = sameOngoing
 ? krChip(kr(a.otherOngoing), 'Øvrige løbende · begge')
 : krChip(kr(a.otherOngoing), 'Øvrige løbende · PMINDI') + krChip(kr(b.otherOngoing), 'Øvrige løbende · PMINDIAKK');
 const gapChip = dTx === 0 ? '' : `<li class="is-gap"><div class="kr-pair"><b>${kr(a.portfolioTransaction)}</b><em>${krGapTxt}</em><b>${kr(b.portfolioTransaction)}</b></div><span>Porteføljetransaktion · PMINDI · forskel · PMINDIAKK</span></li>`;
 const entryChips = sameEntry
 ? krChip(kr(a.entry), 'Emission, maks. · begge') + krChip(kr(a.exit), 'Indløsning, maks. · begge')
 : krChip(kr(a.entry), 'Emission, maks. · PMINDI') + krChip(kr(b.entry), 'Emission, maks. · PMINDIAKK') + krChip(kr(a.exit), 'Indløsning, maks. · PMINDI') + krChip(kr(b.exit), 'Indløsning, maks. · PMINDIAKK');
 const krLine = `<ul class="kr-chips">${ongoingChips}${gapChip}${entryChips}</ul><p class="kr-aside">Linjerne er ikke lagt sammen.</p>`;
 const kidGap = Math.abs(krOf(b.kidRiy5y) - krOf(a.kidRiy5y));
 const kidGapTxt = String(kidGap).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' kr.';
 const kidHi = Math.max(Number(a.kidRiy5y), Number(b.kidRiy5y));
 const kidLo = Math.min(Number(a.kidRiy5y), Number(b.kidRiy5y));
 const kidEq = kidHi === kidLo ? '' : `${kr(kidHi)} − ${kr(kidLo)}`;
 const txHiName = Number(b.portfolioTransaction) >= Number(a.portfolioTransaction) ? 'PMINDIAKK' : 'PMINDI';
 const txLoName = txHiName === 'PMINDIAKK' ? 'PMINDI' : 'PMINDIAKK';
 const txEq = dTx === 0 ? '' : `${txHiName} ${kr(Math.max(a.portfolioTransaction, b.portfolioTransaction))} − ${txLoName} ${kr(Math.min(a.portfolioTransaction, b.portfolioTransaction))}`;
 const horizonPack = (years, rateA, rateB) => {
 if (!Number.isFinite(Number(rateA)) || !Number.isFinite(Number(rateB))) return null;
 const ka = krOf(rateA);
 const kb = krOf(rateB);
 const gapN = Math.abs(kb - ka);
 const hi = Math.max(ka, kb);
 const lo = Math.min(ka, kb);
 const krn = (n) => {
 const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
 return (n < 0 ? '-' : '') + s + ' kr.';
 };
 return { y: years, pctA: pct(rateA), pctB: pct(rateB), krA: kr(rateA), krB: kr(rateB), gap: krn(gapN), gapN, eq: hi === lo ? '' : `${krn(hi)} − ${krn(lo)}` };
 };
 const kidHorizons = [horizonPack(1, a.kidRiy1y, b.kidRiy1y), horizonPack(5, a.kidRiy5y, b.kidRiy5y)].filter(Boolean);
 const txGapN = krGap;
 const h1 = kidHorizons.find((h) => h.y === 1) || null;
 const h5 = kidHorizons.find((h) => h.y === 5) || null;
 const sameKr = h1 && dTx !== 0 && h1.gapN === txGapN;
 const kidNote = (h1 && h5)
 ? `Ved 1 år er forskellen ${h1.gap}${sameKr ? ', samme beløb som postsatsen. ' : ' '}Ved 5 år er den ${h5.gap} Ikke det samme tal. Ikke et ÅOP.`
 : 'Ikke det samme som postsatserne. Ikke et ÅOP.';
 const wantH = new URL(location.href).searchParams.get('h');
 const heroStart = kidHorizons.find((h) => String(h.y) === wantH) || h5 || kidHorizons[0] || null;
 const amountsMatch = (h) => Boolean(h && dTx !== 0 && h.gapN === txGapN);
 const bridgeCopy = (h) => {
 const same = amountsMatch(h);
 return {
 same,
 mark: same ? '=' : '≠',
 word: same ? 'samme beløb' : 'andet beløb',
 sr: same
 ? `${h.gap} og ${krGapTxt} er samme beløb. Ikke det samme tal.`
 : `${h ? h.gap : ''} og ${krGapTxt} er ikke samme beløb.`,
 };
 };
 const railBase = Math.max(txGapN, ...kidHorizons.map((h) => h.gapN), 1);
 const railPct = (n) => Math.round(Math.max(0, Math.min(100, (Number(n) / railBase) * 100)) * 10) / 10;
 const startBridge = bridgeCopy(heroStart);
 const kidSwitch = kidHorizons.length > 1 ? `<div class="kid-switch" role="group" aria-label="KID-horisont">${kidHorizons.map((h) => `<button type="button" data-kid="${h.y}" aria-pressed="${heroStart && h.y === heroStart.y ? 'true' : 'false'}" aria-keyshortcuts="${h.y}" aria-label="Vis KID ved ${h.y} år. Forskellen er ${h.gap}.">${h.y} år <b>${h.gap}</b></button>`).join('')}</div>` : '';
 const hero = `<div class="cost-hero${dTx === 0 ? '' : ' is-pair'}${startBridge.same ? ' is-same' : ''}" id="blik" data-rail-base="${railBase}">
 <article class="cost-hero-kid" id="kid-hero">
 <div class="kid-head"><p class="kicker">KID</p>${kidSwitch}</div>
 <div class="cost-hero-nums" aria-live="polite">
 <div><span>PMINDI</span><b data-kid-a>${heroStart ? heroStart.pctA : pct(a.kidRiy5y)}</b><small data-kid-ka>${heroStart ? heroStart.krA : kr(a.kidRiy5y)} på 100.000 kr.</small></div>
 <div class="mid"><span>forskel</span><em data-kid-gap>${heroStart ? heroStart.gap : kidGapTxt}</em><small data-kid-eq>${heroStart && heroStart.eq ? `${heroStart.eq}<br>` : (kidEq ? `${kidEq}<br>` : '')}ikke postsatserne</small></div>
 <div><span>PMINDIAKK</span><b data-kid-b>${heroStart ? heroStart.pctB : pct(b.kidRiy5y)}</b><small data-kid-kb>${heroStart ? heroStart.krB : kr(b.kidRiy5y)} på 100.000 kr.</small></div>
 </div>
 <div class="match-rail" aria-hidden="true"><i data-rail="kid" style="width:${heroStart ? railPct(heroStart.gapN) : 0}%"></i></div>
 <p class="cost-hero-note sr-only">${kidNote}</p>
 </article>
 ${dTx === 0 ? '' : `<p class="cost-neq" aria-live="polite"><span class="mark" data-bridge-mark aria-hidden="true">${startBridge.mark}</span><span class="word" data-bridge-word>${startBridge.word}</span><span class="sr-only" data-bridge-sr>${startBridge.sr}</span></p><article class="cost-hero-gap">
 <p class="kicker">POSTSATS · PORTEFØLJETRANSAKTION</p>
 <p class="gap-kr">${krGapTxt}</p>
 <p class="gap-sub"><b>${pct(a.portfolioTransaction)}</b> PMINDI · <b>${pct(b.portfolioTransaction)}</b> PMINDIAKK</p>
 <p class="gap-eq">${txEq}</p>
 <p class="gap-note">på 100.000 kr. Søjlerne deler skala. Ikke et ÅOP.</p>
 <div class="match-rail" aria-hidden="true"><i data-rail="tx" style="width:${railPct(txGapN)}%"></i></div>
 </article>`}
 </div>
 <p class="band">${h1 && h5 ? `KID ved 5 år er ${h5.krA} og ${h5.krB} Forskellen er ${h5.gap} KID ved 1 år er ${h1.krA} og ${h1.krB} Forskellen er ${h1.gap} ` : `KID på 100.000 kr. er ${kr(a.kidRiy5y)} og ${kr(b.kidRiy5y)} `}${dTx === 0 ? 'Porteføljetransaktion er ens.' : `Forskellen i porteføljetransaktion er ${krGapTxt}`} ${sameKr ? 'KID ved 1 år og postsatsen rammer samme beløb. Det er ikke det samme tal.' : 'De to tal er ikke det samme.'} Linjerne er ikke lagt sammen, og ingen af dem er et ÅOP.</p>`;
 const zoomBlock = zoom ? (() => {
 const left = zMark(loTx, zoom.z0, zoom.z1);
 const right = zMark(hiTx, zoom.z0, zoom.z1);
 return `<div class="delta-zoom">
 <p class="k">Udsnit, forstørret · ${pct2(zoom.z0)} til ${pct2(zoom.z1)}</p>
 <div class="delta-track" role="img" aria-label="Forstørret udsnit fra ${pct2(zoom.z0)} til ${pct2(zoom.z1)}. PMINDI ${pct(a.portfolioTransaction)} og PMINDIAKK ${pct(b.portfolioTransaction)}. Afstanden på figuren er større end på skalaen 0 til ${pct(SCALE)}. Forskellen er stadig ${pp(Math.abs(dTx))}.">${gapBar(left, right - left)}<i class="a" style="left:${zMark(a.portfolioTransaction, zoom.z0, zoom.z1)}%"></i><i class="b" style="left:${zMark(b.portfolioTransaction, zoom.z0, zoom.z1)}%"></i></div>
 <div class="delta-ends" aria-hidden="true"><span>${pct2(zoom.z0)}</span><span>${pct2(zoom.z1)}</span></div>
 </div>`;
 })() : '';
 const fullLeft = mark(loTx);
 const fullWidth = mark(hiTx) - fullLeft;
 const deltaStage = dTx === 0 ? '' : `<section class="delta-stage" id="forskel">
 <p class="kicker">${onlyTx ? 'DEN ENE FORSKEL' : 'PORTEFØLJETRANSAKTION'}</p>
 <h2>${onlyTx ? 'Porteføljetransaktion skiller klasserne' : 'Porteføljetransaktion'}</h2>
 <div class="delta-nums">
 <div><span>PMINDI</span><b>${pct(a.portfolioTransaction)}</b><small>${kr(a.portfolioTransaction)} på 100.000 kr.</small></div>
 <div class="delta-mid"><span>${pp(Math.abs(dTx))}</span><b>${krGapTxt}</b><small>kun denne linje · ikke et ÅOP</small></div>
 <div><span>PMINDIAKK</span><b>${pct(b.portfolioTransaction)}</b><small>${kr(b.portfolioTransaction)} på 100.000 kr.</small></div>
 </div>
 <div class="delta-track" role="img" aria-label="PMINDI ${pct(a.portfolioTransaction)} og PMINDIAKK ${pct(b.portfolioTransaction)} på en skala fra 0 til ${pct(SCALE)}">${gapBar(fullLeft, fullWidth)}<i class="a" style="left:${mark(a.portfolioTransaction)}%"></i><i class="b" style="left:${mark(b.portfolioTransaction)}%"></i></div>
 <div class="delta-ends" aria-hidden="true"><span>0 %</span><span>${pct(SCALE)}</span></div>
 ${zoomBlock}
 ${krLine}
 <p class="scale-note">Den øverste linje er skalaen 0 til ${pct(SCALE)}. Afstanden er lille, fordi forskellen er ${pp(Math.abs(dTx))}. Den nederste linje er et udsnit, så markørerne kan skelnes. Udsnittet er forstørret. Forskellen er stadig ${pp(Math.abs(dTx))}, ${krGapTxt} på 100.000 kr. Det er ikke en sum af satserne og ikke et ÅOP.</p>
 </section>`;
 const spoken = onlyTx
 ? `Porteføljetransaktion er den eneste af satserne, der ikke er ens: ${pct(a.portfolioTransaction)} i PMINDI og ${pct(b.portfolioTransaction)} i PMINDIAKK. Forskellen er ${pp(Math.abs(dTx))}. På 100.000 kr. er det ${krGapTxt} i regneeksemplet. Det er ikke et ÅOP.`
 : dTx === 0
 ? 'Porteføljetransaktion er ens i de to klasser i Fundmarket-tallene.'
 : `Porteføljetransaktion er ${pct(a.portfolioTransaction)} i PMINDI og ${pct(b.portfolioTransaction)} i PMINDIAKK. Forskellen er ${pp(Math.abs(dTx))}.`;
 const sameLine = sameOngoing
 ? `Øvrige løbende er ${pct(a.otherOngoing)} i begge klasser.`
 : `Øvrige løbende er ${pct(a.otherOngoing)} i PMINDI og ${pct(b.otherOngoing)} i PMINDIAKK.`;
 const entryLine = sameEntry
 ? `Emission og indløsning er angivet som maks. ${pct(a.entry)} og ${pct(a.exit)} for begge klasser.`
 : `PMINDI: emission ${pct(a.entry)}, indløsning ${pct(a.exit)}. PMINDIAKK: emission ${pct(b.entry)}, indløsning ${pct(b.exit)}.`;
 const feeLine = feeNo
 ? 'Ingen af klasserne betaler resultathonorar, ifølge Fundmarket.'
 : feeSame
 ? esc(a.performanceFeeText)
 : `${esc(a.performanceFeeText)} ${esc(b.performanceFeeText)}`;
 const card = (cl) => {
 const c = cl.costs;
 return `<article class="cost-card">
 <p class="kicker">${esc(cl.isin)}</p>
 <h2>${esc(cl.distributing === false || (cl.isin||"").includes("464") ? "PMINDIAKK" : "PMINDI")}</h2><p class="src" style="margin:0 0 8px">${esc(cl.label)}</p>
 <p style="color:var(--muted);font-size:14px;line-height:1.5">${cl.distributing ? 'Udloddende' : 'Akkumulerende'} klasse. Resultathonorar: <strong style="color:var(--text)">${c.performanceFee ? 'Ja' : 'Nej'}</strong>. ${esc(c.performanceFeeText)}</p>
 <p class="src">${esc(c.note)}</p>
 <p class="link-row" style="margin-top:12px">
 <a class="outline-btn small" href="${esc(c.source)}" rel="noopener noreferrer" target="_blank">Fundmarket ↗</a>
 <a class="outline-btn small" href="${esc(cl.kidUrl)}" rel="noopener noreferrer" target="_blank">KID PDF ↗</a>
 </p>
 </article>`;
 };

 const plainLead = `<section class="panel" style="margin-bottom:14px">
 <p style="font-size:18px;color:var(--text);line-height:1.45;margin:0">Ca. <strong>2,8&nbsp;% om året</strong> — det er KID’s samlede omkostningsindikator ved 5 år (PMINDI <strong>${pct(a.kidRiy5y)}</strong> / PMINDIAKK <strong>${pct(b.kidRiy5y)}</strong>). På 100.000&nbsp;kr. svarer det til ca. <strong>${kr(a.kidRiy5y)}</strong> / <strong>${kr(b.kidRiy5y)}</strong> om året. Hertil kommer din banks kurtage og depot. Intet resultathonorar. Du kan tabe penge.</p>
 </section>`;
 const detailOpen = Boolean(wantH) || (typeof location !== 'undefined' && location.hash === '#blik');
 const detailHero = `<details class="cost-details"${detailOpen ? ' open' : ''} style="margin-bottom:14px">
 <summary style="cursor:pointer;color:var(--cyan);font-size:14px;padding:8px 0">For de nysgerrige: klasseforskel og postsatser</summary>
 <p class="lede" style="margin-top:8px">Nedenfor: KID-tal side om side og Fundmarkets postsatser. Postsatserne er <strong style="color:var(--text)">ikke et ÅOP</strong> og må ikke læses som et billigere alternativ til KID-tallet.</p>
 ${hero}
 </details>`;
 main.innerHTML = `
 <p class="eyebrow">OMKOSTNINGER · FUNDMARKET</p>
 <h1>Hvad koster fonden?</h1>
 ${plainLead}
 ${detailHero}
 <div class="metrics">
 <div class="metric"><div class="label">KID · årlig konsekvens (1 år)</div><strong>${pct(a.kidRiy1y)} / ${pct(b.kidRiy1y)}</strong><small>${h1 ? `forskel ${h1.gap}${sameKr ? ' · samme beløb som postsatsen' : ''} · ikke det samme tal` : 'PMINDI / PMINDIAKK · KID'}</small></div>
 <div class="metric"><div class="label">Øvrige løbende${sameOngoing ? ', begge' : ''}</div><strong>${sameOngoing ? pct(a.otherOngoing) : pct(a.otherOngoing) + ' / ' + pct(b.otherOngoing)}</strong><small>Postsats · Fundmarket · ${sameOngoing ? kr(a.otherOngoing) : kr(a.otherOngoing) + ' / ' + kr(b.otherOngoing)}</small></div>
 <div class="metric"><div class="label">Resultathonorar</div><strong>${feeNo ? 'Nej' : 'Se klasser'}</strong><small>${feeNo ? 'Begge klasser · Fundmarket' : 'Se klassekortet'}</small></div>
 </div>
 <section class="panel" id="kid-omkostning">
 <h2 class="panel-h">KID: samlet omkostningsindikator</h2>
 <p class="lede" style="margin-bottom:10px">KID’et viser den årlige omkostningsmæssige konsekvens (PRIIP-omkostningsindikator). Det er det tal, marketingmateriale skal gengive ærligt — ikke kun de enkelte postsatser.</p>
 <div class="table-wrap"><table class="data" style="min-width:0">
 <thead><tr><th></th><th>PMINDI</th><th>PMINDIAKK</th></tr></thead>
 <tbody>
 <tr data-kid-row="5"${heroStart && heroStart.y === 5 ? ' class="is-on"' : ''}><td>Ved 5 år (anbefalet periode)</td><td>${pct(a.kidRiy5y)}</td><td>${pct(b.kidRiy5y)}</td></tr>
 <tr data-kid-row="1"${heroStart && heroStart.y === 1 ? ' class="is-on"' : ''}><td>Ved 1 år</td><td>${pct(a.kidRiy1y)}</td><td>${pct(b.kidRiy1y)}</td></tr>
 </tbody>
 </table></div>
 <p class="src" style="margin-top:10px">${esc(a.kidRiyNote || '')} Kilde: KID via Fundmarket. <a href="${esc(A.kidUrl)}" rel="noopener noreferrer" target="_blank">KID PMINDI ↗</a> · <a href="${esc(B.kidUrl)}" rel="noopener noreferrer" target="_blank">KID PMINDIAKK ↗</a></p>
 </section>
 <p class="band">${onlyTx ? `Kun porteføljetransaktion skiller klasserne. ${sameLine} ${entryLine} ${feeLine} Ikke et ÅOP.` : `${spoken} ${sameLine} ${entryLine} ${feeLine}`}</p>
 ${deltaStage}

 <section class="panel">
 <h2 class="panel-h">Sammenligning</h2>
 <div class="cmp">
 ${pair('Øvrige løbende', a.otherOngoing, b.otherOngoing)}
 ${pair('Porteføljetransaktion', a.portfolioTransaction, b.portfolioTransaction)}
 ${pair('Emission, maks.', a.entry, b.entry)}
 ${pair('Indløsning, maks.', a.exit, b.exit)}
 </div>
 <p class="scale-note">Søjlerne deler skalaen 0 til ${pct(SCALE)}. En lav sats tegnes smal. Forskellen mellem ${pct(a.portfolioTransaction)} og ${pct(b.portfolioTransaction)} er bevidst lille på figuren. ${pct(a.otherOngoing)} er Fundmarkets tal for øvrige løbende omkostninger. Noten på kilden kalder dem forventede samlede omkostninger i regnskabsåret. Siden lægger ikke satserne sammen og kalder det ikke et ÅOP.</p>
 <div class="table-wrap"><table class="data" style="min-width:0">
 <thead><tr><th></th><th>PMINDI</th><th>PMINDIAKK</th></tr></thead>
 <tbody>
 <tr><td>Øvrige løbende</td><td>${pct(a.otherOngoing)}</td><td>${pct(b.otherOngoing)}</td></tr>
 <tr><td>Porteføljetransaktion</td><td>${pct(a.portfolioTransaction)}</td><td>${pct(b.portfolioTransaction)}</td></tr>
 <tr><td>Emission, maks.</td><td>${pct(a.entry)}</td><td>${pct(b.entry)}</td></tr>
 <tr><td>Indløsning, maks.</td><td>${pct(a.exit)}</td><td>${pct(b.exit)}</td></tr>
 <tr><td>Resultathonorar</td><td>${a.performanceFee ? 'Ja' : 'Nej'}</td><td>${b.performanceFee ? 'Ja' : 'Nej'}</td></tr>
 </tbody>
 </table></div>
 </section>

 <section class="panel">
 <h2 class="panel-h">Regneeksempel på 100.000 kr.</h2>
 <p class="lede" style="margin-bottom:12px">Hver linje er satsen ganget med 100.000 kr. og afrundet til hele kroner. Linjerne er ikke lagt sammen. Summen er ikke et ÅOP. Kurtage, depot og skat er ikke med.</p>
 <div class="receipts">
 <article class="receipt">
 <p class="kicker">${esc(A.isin)}</p>
 <h3>PMINDI</h3>
 <ol>
 ${line('Øvrige løbende', a.otherOngoing)}
 ${line('Porteføljetransaktion', a.portfolioTransaction, dTx !== 0)}
 ${line('Emission, maks.', a.entry)}
 ${line('Indløsning, maks.', a.exit)}
 </ol>
 </article>
 <article class="receipt">
 <p class="kicker">${esc(B.isin)}</p>
 <h3>PMINDIAKK</h3>
 <ol>
 ${line('Øvrige løbende', b.otherOngoing)}
 ${line('Porteføljetransaktion', b.portfolioTransaction, dTx !== 0)}
 ${line('Emission, maks.', b.entry)}
 ${line('Indløsning, maks.', b.exit)}
 </ol>
 </article>
 </div>
 <p class="src" style="margin-top:10px">Resultathonorar indgår ikke i eksemplet. ${feeLine}</p>
 </section>

 <div class="cost-grid">
 ${card(A)}
 ${card(B)}
 </div>

 <p class="warn">Du kan tabe penge. Afkasttal på NDI Analytics er efter fondens løbende omkostninger, før din egen kurtage og dit depot. Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Se KID’ets samlede omkostningsindikator ovenfor — ikke kun postsatserne.</p>
 <p class="link-row">
 <a class="cta" href="fakta.html">Fakta →</a>
 <a class="outline-btn" href="risici.html">Risici / KID →</a>
 <a class="outline-btn" href="sammenlign.html">Sammenlign klasser →</a>
 </p>`;
 const paintKid = (years, pushUrl) => {
 const h = kidHorizons.find((x) => x.y === Number(years));
 const root = document.getElementById('kid-hero');
 if (!h || !root) return;
 root.querySelector('[data-kid-a]').textContent = h.pctA;
 root.querySelector('[data-kid-b]').textContent = h.pctB;
 root.querySelector('[data-kid-ka]').textContent = `${h.krA} på 100.000 kr.`;
 root.querySelector('[data-kid-kb]').textContent = `${h.krB} på 100.000 kr.`;
 root.querySelector('[data-kid-gap]').textContent = h.gap;
 root.querySelector('[data-kid-eq]').innerHTML = `${h.eq ? `${h.eq}<br>` : ''}ikke postsatserne`;
 const hero = document.getElementById('blik');
 const copy = bridgeCopy(h);
 if (hero) {
 hero.classList.toggle('is-same', copy.same);
 const kidRail = hero.querySelector('[data-rail="kid"]');
 const txRail = hero.querySelector('[data-rail="tx"]');
 if (kidRail) kidRail.style.width = railPct(h.gapN) + '%';
 if (txRail) txRail.style.width = railPct(txGapN) + '%';
 const mark = hero.querySelector('[data-bridge-mark]');
 const word = hero.querySelector('[data-bridge-word]');
 const sr = hero.querySelector('[data-bridge-sr]');
 if (mark) mark.textContent = copy.mark;
 if (word) word.textContent = copy.word;
 if (sr) sr.textContent = copy.sr;
 }
 document.getElementById('forskel')?.classList.toggle('is-match', copy.same);
 document.querySelectorAll('.kr-chips li.is-gap').forEach((el) => el.classList.toggle('is-match', copy.same));
 root.querySelectorAll('[data-kid]').forEach((btn) => {
 btn.setAttribute('aria-pressed', Number(btn.getAttribute('data-kid')) === h.y ? 'true' : 'false');
 });
 document.querySelectorAll('#kid-omkostning tr[data-kid-row]').forEach((tr) => {
 tr.classList.toggle('is-on', Number(tr.getAttribute('data-kid-row')) === h.y);
 });
 main.querySelectorAll('a[href^="fakta.html"]').forEach((a) => {
 const u = new URL(a.getAttribute('href'), location.href);
 if (h.y === 5) u.searchParams.delete('h');
 else u.searchParams.set('h', String(h.y));
 a.setAttribute('href', `fakta.html${u.search}${u.hash}`);
 });
 if (pushUrl) {
 const u = new URL(location.href);
 if (h.y === 5) u.searchParams.delete('h');
 else u.searchParams.set('h', String(h.y));
 history.replaceState(null, '', u);
 }
 };
 if (heroStart) paintKid(heroStart.y, false);
 const openPair = () => {
 const d = document.querySelector('details.cost-details');
 if (!d || d.open) return false;
 d.open = true;
 document.getElementById('blik')?.scrollIntoView({ block: 'nearest' });
 return true;
 };
 main.addEventListener('click', (e) => {
 const btn = e.target.closest('[data-kid]');
 if (!btn || !document.getElementById('kid-hero')?.contains(btn)) return;
 paintKid(btn.getAttribute('data-kid'), true);
 openPair();
 });
 window.addEventListener('keydown', (e) => {
 if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
 if (e.key !== '1' && e.key !== '5') return;
 const ae = document.activeElement;
 if (ae && ae.closest('input, textarea, select, [contenteditable="true"]')) return;
 if (!document.querySelector(`#kid-hero [data-kid="${e.key}"]`)) return;
 e.preventDefault();
 paintKid(e.key, true);
 openPair();
 });
 }
 </script>
</body>
</html>
