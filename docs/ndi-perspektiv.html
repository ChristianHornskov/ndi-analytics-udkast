<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NDI-perspektiv · NDI Analytics</title>
  <link rel="stylesheet" href="css/ndi.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
    <nav class="nav"><a href="index.html">← Entré</a><a href="laer/index.html">Lær</a></nav>
  </header>
  <main id="main"><p style="color:var(--muted)">Henter…</p></main>
  <script type="module">
    const pack = await fetch('data/unique-metrics.json').then(r => r.json());
    const rows = Object.entries(pack.byIsin||{}).map(([isin,v]) => `
      <tr>
        <td><a href="selskab.html?isin=${encodeURIComponent(isin)}">${v.name}</a></td>
        <td>${(v.metrics||[]).map(m => `<strong>${m.label}:</strong> ${m.value}`).join('<br>')}</td>
      </tr>`).join('');
    document.getElementById('main').innerHTML = `
      <p class="eyebrow">NDI-PERSPEKTIV · UDKAST</p>
      <h1>Særlige vinkler (placeholders)</h1>
      <p class="lede">${pack.note || 'Udkast-placeholders — ikke live feeds.'}</p>
      <p class="band">Eksponering og pædagogik — ikke anbefaling.</p>
      <div class="table-wrap"><table class="data"><thead><tr><th>Selskab</th><th>Perspektiv</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="warn">Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Du kan tabe en del af eller hele din investering.</p>`;
  </script>
</body>
</html>
