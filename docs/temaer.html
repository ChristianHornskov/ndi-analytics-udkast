<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Temaer · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <!-- og:start -->
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Temaer · NDI Analytics">
 <meta property="og:description" content="NDI Analytics - klikbart udkast. Fonden, porteføljen og tech-temaer set gennem NDI&#x27;s linse. Generel information, ikke rådgivning.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/temaer.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta property="og:image:width" content="1200">
 <meta property="og:image:height" content="630">
 <meta property="og:image:alt" content="NDI Analytics - udkast. Gå på opdagelse i porteføljen.">
 <meta name="twitter:card" content="summary_large_image">
 <!-- og:end -->
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html?view=udforsk">← Udforsk</a><a href="vaerdikaeder.html">Værdikæder</a><a href="vaerdikaede.html">Enkel kæde</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter temaer…</p></main>
 <script type="module">
 import { fmtDate, loadAll, fundById, themeProposals } from './js/data.js';
 const [data, all] = await Promise.all([fetch('data/themes.json').then(r => r.json()), loadAll()]);
 // themes.json er bygget på PMINDI. Forslag tælles i samme klasse, så tallene passer sammen.
 const fund = fundById(all.portfolio, data.fund || 'pmindi');
 const prop = themeProposals(fund);
 const propChip = (t) => {
 const n = t.themeKey === 'andet' ? prop.open : (prop.byTheme[t.themeKey] || 0);
 if (!n) return '';
 const txt = t.themeKey === 'andet' ? `${n} venter på et tema` : `+${n} forslag`;
 return ` <span class="badge badge-draft" title="Forslag, afventer gennemgang">${txt}</span>`;
 };
 const cards = (data.themes||[]).map(t => `
 <a class="door" href="tema.html?slug=${encodeURIComponent(t.slug)}&fund=${fund.id}">
 <strong>${t.title}${propChip(t)}</strong>
 <span>${t.problem}</span>
 <span class="go">${t.count} selskaber · ca. ${String(t.weightSum).replace('.',',')} % →</span>
 </a>`).join('');
 const review = prop.total ? `<section class="review-banner" aria-labelledby="rv-h">
 <p class="rv-kicker"><span class="badge badge-draft">FORSLAG</span> Afventer gennemgang</p>
 <h2 id="rv-h">${prop.moved} selskaber har fået et forslag til NDI-tema</h2>
 <p>De lå før i <em>Andet</em>. Forslagene bygger på offentlige ISIN-opslag og selskabets branche. ${prop.open} selskaber står stadig i Andet, fordi ingen NDI-linse passede godt nok. Porteføljeholdet gennemgår alle temaer, også de ældre, før noget bliver endeligt.</p>
 <p class="link-row"><a href="om-data.html#g-temaforslag">Sådan sættes temaerne →</a> <a href="tema.html?slug=andet&fund=${fund.id}">Se hvad der er tilbage i Andet →</a></p>
 </section>` : '';
 document.getElementById('main').innerHTML = `
 <p class="eyebrow">TEMAER · OVERSIGT</p>
 <h1>NDI-linsen</h1>
 <p class="lede">Temaer viser eksponering i den forsinkede beholdning (pr. ${fmtDate(data.positionsAsOf)}). Ikke anbefalinger eller bevidste overvægte. Nye forslag: Quantum. Rumfart/satellitter har egen kæde på <a href="vaerdikaeder.html">værdikæder</a>.</p>
 <p class="band">Segmenter viser eksponering, ikke en anbefaling. <a href="vaerdikaeder.html#kap-treemap"><strong>Treemap / sunburst →</strong></a></p>
 <p class="anno" style="font-size:12px;color:var(--yellow)">Visuel genvej: samme vægte som mosaik/sol på værdikæde-siden — her som søjler + døre.</p>
 ${review}
 <section class="panel" style="margin-bottom:18px">
 <h2 style="font-size:16px;margin-bottom:10px">Tema-vægte i forsinket beholdning</h2>
 <div style="display:grid;gap:8px">${(data.themes||[]).map(t=>{
 const max=Math.max(...data.themes.map(x=>x.weightSum||0),0.01);
 const pct=Math.round((t.weightSum/max)*100);
 return `<div style="display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:12px">
 <a href="tema.html?slug=${encodeURIComponent(t.slug)}&fund=${fund.id}">${t.title}</a>
 <div style="background:#0b171d;border-radius:6px;height:10px;overflow:hidden;border:1px solid var(--line)"><div style="width:${pct}%;height:100%;background:var(--brand)"></div></div>
 <span style="color:var(--muted);text-align:right">${String(t.weightSum).replace('.',',')} %</span>
 </div>`;
 }).join('')}</div>
 <p style="font-size:11px;color:var(--muted);margin-top:10px">Relative søjler (største tema = 100 % bredde). Eksponering, ikke anbefaling. Pr. ${fmtDate(data.positionsAsOf)}.</p>
 </section>
 <div class="doors">${cards}</div>
 <p class="warn">Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Du kan tabe en del af eller hele din investering.</p>`;
 </script>
</body>
</html>
