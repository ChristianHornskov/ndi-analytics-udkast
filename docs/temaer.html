<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Temaer · NDI Analytics</title>
  <link rel="stylesheet" href="css/ndi.css">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <!-- og:start -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NDI Analytics (udkast)">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="Temaer · NDI Analytics">
  <meta property="og:description" content="Temaer viser eksponering i den forsinkede beholdning (pr. ${fmtDate(data.positionsAsOf)}) — ikke anbefalinger eller bevidste overvægte.">
  <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/temaer.html">
  <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NDI Analytics – udkast. Gå på opdagelse i porteføljen.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- og:end -->
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
    <nav class="nav"><a href="index.html?view=udforsk">← Udforsk</a><a href="vaerdikaede.html">Værdikæde</a></nav>
  </header>
  <main id="main"><p style="color:var(--muted)">Henter temaer…</p></main>
  <script type="module">
    import { fmtDate } from './js/data.js';
    const data = await fetch('data/themes.json').then(r => r.json());
    const cards = (data.themes||[]).map(t => `
      <a class="door" href="tema.html?slug=${encodeURIComponent(t.slug)}">
        <strong>${t.title}</strong>
        <span>${t.problem}</span>
        <span class="go">${t.count} selskaber · ca. ${String(t.weightSum).replace('.',',')} % →</span>
      </a>`).join('');
    document.getElementById('main').innerHTML = `
      <p class="eyebrow">TEMAER · OVERSIGT</p>
      <h1>NDI-linsen</h1>
      <p class="lede">Temaer viser eksponering i den forsinkede beholdning (pr. ${fmtDate(data.positionsAsOf)}) — ikke anbefalinger eller bevidste overvægte.</p>
      <p class="band">Segmenter viser eksponering, ikke en anbefaling.</p>
      <section class="panel" style="margin-bottom:18px">
        <h2 style="font-size:16px;margin-bottom:10px">Tema-vægte i forsinket beholdning</h2>
        <div style="display:grid;gap:8px">${(data.themes||[]).map(t=>{
          const max=Math.max(...data.themes.map(x=>x.weightSum||0),0.01);
          const pct=Math.round((t.weightSum/max)*100);
          return `<div style="display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:12px">
            <a href="tema.html?slug=${encodeURIComponent(t.slug)}">${t.title}</a>
            <div style="background:#0b171d;border-radius:6px;height:10px;overflow:hidden;border:1px solid var(--line)"><div style="width:${pct}%;height:100%;background:var(--brand)"></div></div>
            <span style="color:var(--muted);text-align:right">${String(t.weightSum).replace('.',',')} %</span>
          </div>`;
        }).join('')}</div>
        <p style="font-size:11px;color:var(--muted);margin-top:10px">Relative søjler (største tema = 100 % bredde). Eksponering, ikke anbefaling. Pr. ${fmtDate(data.positionsAsOf)}.</p>
      </section>
      <div class="doors">${cards}</div>
      <p class="warn">Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast. Du kan tabe en del af eller hele din investering.</p>`;
  </script>
</body>
</html>
