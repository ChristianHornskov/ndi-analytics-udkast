<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Selskab · NDI Analytics</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/ndi.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
    <nav class="nav"><a href="index.html?view=udforsk">← Udforsk</a>
      <button type="button" class="outline-btn small" id="btn-invest">Sådan investerer du</button></nav>
  </header>
  <main id="main"><p style="color:var(--muted)">Henter selskab…</p></main>
  <footer class="site-footer">
    <p>Udkast / noindex. Generel information – ikke investeringsrådgivning. Historisk afkast er ikke en pålidelig indikator for fremtidigt afkast.</p>
  </footer>
  <script type="module">
    import { loadAll, fundById, fmtPct, fmtDate, daTheme, daMat, WARN_HIST } from './js/data.js';
    const u = new URL(location.href);
    const isin = u.searchParams.get('isin');
    const fundId = u.searchParams.get('fund') || 'pmindi';
    const main = document.getElementById('main');
    const data = await loadAll();
    const meta = await fetch('data/fund-meta.json').then(r => r.ok ? r.json() : null).catch(() => null);
    const priip = meta?.funds?.[fundId]?.priip;
    // U3: kom man fra screeneren, går Tilbage til samme filtre/sortering
    let backHref = `index.html?view=udforsk&fund=${fundId}`;
    try {
      const ref = new URL(document.referrer);
      if (ref.origin === location.origin && ref.pathname.replace(/index\.html$/, '') === location.pathname.replace(/selskab\.html$/, '')) backHref = ref.href;
    } catch {}
    const gl = (key, name) => `<a class="info-btn" href="om-data.html#g-${key}" title="Hvad betyder ${name}? Se ordlisten" aria-label="Hvad betyder ${name}? Se ordlisten">?</a>`;
    const fund = fundById(data.portfolio, fundId);
    const p = fund.positions.find(x => x.isin === isin);
    if (!p) {
      main.innerHTML = `<p class="warn">Selskabet blev ikke fundet i ${fund.short}. <a href="${backHref}">Tilbage til screener</a></p>`;
    } else {
      document.title = `${p.name} · NDI Analytics`;
      main.innerHTML = `
        <a class="back" href="${backHref}">← Tilbage</a>
        <p class="eyebrow">SELSKAB · I PORTEFØLJEN</p>
        <h1>${p.name}</h1>
        <p style="color:var(--muted);font-size:13px;margin:6px 0 16px">${p.symbol || ''} · ${p.isin} · vægt ${(p.weight||0).toFixed(2).replace('.',',')} % · pr. ${fmtDate(fund.positionsAsOf||data.portfolio.asOf)}</p>
        <section class="panel">
          <h2 style="font-size:16px;margin-bottom:8px;color:var(--brand)">Hvilket problem løser det?</h2>
          <p style="font-size:15px;line-height:1.55">${p.summary || 'Beskrivelse mangler i udkastet.'}</p>
          <p class="band" style="margin-top:10px">Beskrivelse kan være AI-assisteret. Generel information — ikke en anbefaling.</p>
        </section>
        <section class="panel">
          <h2 style="font-size:16px;margin-bottom:8px;color:var(--brand)">Rolle i værdikæden</h2>
          <p style="color:var(--muted)">${p.role || '–'}</p>
          <p style="margin-top:10px;color:var(--muted);font-size:13px"><strong style="color:var(--text)">Produkter:</strong> ${p.products || '–'}</p>
          <p style="margin-top:6px;color:var(--muted);font-size:13px"><strong style="color:var(--text)">Kunder:</strong> ${p.customers || '–'}</p>
        </section>
        <section class="panel">
          <h2 style="font-size:16px;margin-bottom:8px">NDI-tema (udkast)</h2>
          <p><span class="tag accent">${daTheme(p.theme)}</span></p>
          <p class="band">Segmenter viser eksponering, ikke en anbefaling. Kursafkast, P/S og P/E pr. aktie vises ikke i v1 (under verifikation – mulige split-/valutafejl).</p>
          <div class="metrics" style="margin-top:14px">
            <div class="metric"><div class="label">Vægt i fonden</div><strong>${(p.weight||0).toFixed(2).replace('.',',')} %</strong><small>Beholdning pr. ${fmtDate(fund.positionsAsOf||data.portfolio.asOf)} (forsinket)</small></div>
            <div class="metric"><div class="label">ISIN</div><strong style="font-size:15px">${p.isin}</strong><small>${p.symbol||''}</small></div>
          </div>
          <p class="warn">${WARN_HIST}</p>
        </section>
        ${priip ? `<section class="panel">
          <h2 style="font-size:16px;margin-bottom:8px">Fondens risikoindikator ${gl('sri','risikoindikator (SRI)')}</h2>
          <div class="sri" role="img" aria-label="Risikoklasse ${priip.risk_class} af ${priip.risk_scale_max}">${Array.from({length: priip.risk_scale_max}, (_, i) => `<span class="${i + 1 === priip.risk_class ? 'on' : ''}">${i + 1}</span>`).join('')}</div>
          <p style="color:var(--muted);font-size:13px">${fund.short} har risikoklasse ${priip.risk_class} af ${priip.risk_scale_max} (${priip.risk_label}) og en anbefalet investeringshorisont på ${priip.recommended_holding_years} år, ifølge KID pr. ${fmtDate(priip.production_date)}. Indikatoren gælder <strong style="color:var(--text)">fonden som helhed</strong> – ikke ${p.name} alene.</p>
          <p style="margin-top:8px;font-size:13px"><a href="${priip.url}">Læs KID (Fundmarket, ekstern PDF) <span class="ext-mark">↗</span></a></p>
        </section>` : ''}
        <section class="panel">
          <h2 style="font-size:16px;margin-bottom:8px">Hold øje med</h2>
          <p style="color:var(--muted)">${p.watch || '–'}</p>
          <p class="band" style="margin-top:12px">Automatiske nyhedsresuméer (AI) er ikke aktive i udkastet. Når de kommer, mærkes de som AI og som generel information – ikke NDI's vurdering. Kun forsinkede offentlige beholdningsdata.</p>
        </section>`;
    }
    document.getElementById('btn-invest').onclick = () => location.href = 'index.html?view=fonden&fund=' + fundId;
  </script>
</body>
</html>
