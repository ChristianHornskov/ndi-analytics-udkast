<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Sammenlign · NDI Analytics</title>
 <link rel="stylesheet" href="css/ndi.css">
 <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
 <!-- og:start -->
 <meta property="og:type" content="website">
 <meta property="og:site_name" content="NDI Analytics (udkast)">
 <meta property="og:locale" content="da_DK">
 <meta property="og:title" content="Sammenlign · NDI Analytics">
 <meta property="og:description" content="Samme teknologiperspektiv. Forskellen er udbyttepolitik. Ikke investeringsuniverset.">
 <meta property="og:url" content="https://christianhornskov.github.io/ndi-analytics-udkast/sammenlign.html">
 <meta property="og:image" content="https://christianhornskov.github.io/ndi-analytics-udkast/assets/og-card.png">
 <meta property="og:image:width" content="1200">
 <meta property="og:image:height" content="630">
 <meta property="og:image:alt" content="NDI Analytics - udkast. Gå på opdagelse i porteføljen.">
 <meta name="twitter:card" content="summary_large_image">
 <!-- og:end -->
</head>
<body>
 <a class="skip" href="#main">Gå til indhold</a>
 <header class="site-header">
 <a class="brand" href="index.html"><img src="assets/mark.svg" width="34" height="27" alt=""><span>NewDeal Invest</span></a>
 <nav class="nav"><a href="index.html">← Entré</a><a href="invester.html">Sådan investerer du</a></nav>
 </header>
 <main id="main"><p style="color:var(--muted)">Henter…</p></main>
 <footer class="site-footer"><p>Udkast / noindex. Eksponering, ikke anbefaling.</p></footer>
 <script type="module">
 import { loadAll, fundById, lastNav, WARN_HIST, fmtDate } from './js/data.js';
 const { portfolio } = await loadAll();
 const a = fundById(portfolio, 'pmindi');
 const b = fundById(portfolio, 'pmindiakk');
 const posA = [...(a.positions||[])].sort((x,y)=>(y.weight||0)-(x.weight||0)).slice(0,20);
 const posB = [...(b.positions||[])].sort((x,y)=>(y.weight||0)-(x.weight||0)).slice(0,20);
 const isinA = new Set(posA.map(p=>p.isin));
 const overlap = posB.filter(p=>isinA.has(p.isin));
 const navA = lastNav(a.data), navB = lastNav(b.data);
 document.getElementById('main').innerHTML = `
 <p class="eyebrow">SAMMENLIGN FONDE</p>
 <h1>PMINDI vs PMINDIAKK</h1>
 <p class="lede">Samme teknologiperspektiv. Forskellen er udbyttepolitik. Ikke investeringsuniverset.</p>
 <div class="kpi-grid">
 <div class="kpi"><span class="label">PMINDI</span><strong>Udbyttebetalende</strong><span class="sub">${a.isin} · NAV ${navA?navA.price.toFixed(2).replace('.',','):'-'} (${fmtDate(navA?.d)})</span></div>
 <div class="kpi"><span class="label">PMINDIAKK</span><strong>Akkumulerende</strong><span class="sub">${b.isin} · NAV ${navB?navB.price.toFixed(2).replace('.',','):'-'} (${fmtDate(navB?.d)})</span></div>
 <div class="kpi"><span class="label">Overlap top-20</span><strong>${overlap.length} selskaber</strong></div>
 </div>
 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:8px">Hvad er forskellen?</h2>
 <ul style="color:var(--muted);line-height:1.6;padding-left:1.2rem;display:grid;gap:8px">
 <li><strong style="color:var(--text)">PMINDI</strong> udbetaler udbytte (dokumenterede udbyttedatoer i kontekstgrafen).</li>
 <li><strong style="color:var(--text)">PMINDIAKK</strong> geninvesterer. Afkast vises først efter 12 måneder.</li>
 <li>Beholdning forsinket pr. ${fmtDate(a.positionsAsOf||portfolio.asOf)}. Samme tema-tags anvendes på begge.</li>
 </ul>
 </section>
 <section class="panel">
 <h2 style="font-size:16px;margin-bottom:8px">Fælles i top-20 (udsnit)</h2>
 <div class="table-wrap"><table class="data" style="min-width:0"><thead><tr><th>Navn</th><th>ISIN</th></tr></thead>
 <tbody>${overlap.map(p=>`<tr><td><a href="selskab.html?isin=${p.isin}">${p.name}</a></td><td>${p.isin}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</tbody></table></div>
 </section>
 <p><a class="cta" href="index.html?view=fonden&fund=pmindi">Se PMINDI →</a>
 <a class="outline-btn" href="index.html?view=fonden&fund=pmindiakk" style="margin-left:8px">PMINDIAKK →</a></p>
 <p class="warn">${WARN_HIST}</p>`;
 </script>
</body>
</html>
