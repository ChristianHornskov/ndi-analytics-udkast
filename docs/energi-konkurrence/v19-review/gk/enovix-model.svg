<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Enovix penge</title>
<desc id="cr-model-d">1. Enovix udvikler battericellerne. 2. Fabrikken i Malaysia laver batterier med en anode af ren silicium. 3. Fabrikken i Sydkorea laver batterier med silicium blandet i grafit. 4. Producenter af smarte briller køber batterier med ren silicium. 5. Producenter af droner og forsvarsudstyr køber batterierne fra Sydkorea. Kunderne betaler Enovix for de batterier, de bestiller.</desc>
