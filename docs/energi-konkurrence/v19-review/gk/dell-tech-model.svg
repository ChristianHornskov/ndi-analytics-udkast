<svg class="cr-model cr-model-d" viewBox="0 0 440 520" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Dell penge på computere, servere og finansiering</title>
<desc id="cr-model-d">1. Virksomheder og privatpersoner køber computere og tilbehør hos Dell eller hos en forhandler. 2. Virksomheder køber også servere, netværk og lager, herunder servere bygget til kunstig intelligens. 3. Dell leverer maskinerne og den tilhørende service og support. 4. Dell Financial Services tilbyder leasing, lån og løbende betaling, så nogle kunder betaler over tid. 5. Forhandlere sælger Dells produkter videre til deres egne kunder. De gule pile viser, at både slutkunder og forhandlere betaler Dell for varer og service, og at nogle betalinger løber over tid via finansieringsselskabet.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:start;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .pre{text-anchor:end;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .prm{text-anchor:middle;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="115" y="16" width="230" height="56" rx="10"/>
<circle class="nr" cx="129" cy="28" r="8"/>
<text class="nrt" x="129" y="32">1</text>
<text class="t" x="188" y="41">Forhandler</text>
<text class="s" x="188" y="59">sælger videre</text>
<path class="l" d="M230,124 V76" marker-end="url(#cr-pil)"/>
<text class="pr" x="242" y="102">produkter</text>
<rect class="k" x="115" y="124" width="230" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="129" cy="136" r="8"/>
<text class="nrt" x="129" y="140">2</text>
<text class="t" x="188" y="149">Dell</text>
<text class="s" x="188" y="167">sælger udstyr</text>
<path class="l" d="M165,180 V264" marker-end="url(#cr-pil)"/>
<text class="pr" x="177" y="200">computere og</text>
<text class="pr" x="177" y="216">tilbehør</text>
<path class="l" d="M315,180 V264" marker-end="url(#cr-pil)"/>
<text class="pre" x="303" y="244">servere og lager</text>
<rect class="k" x="115" y="268" width="230" height="56" rx="10"/>
<circle class="nr" cx="129" cy="280" r="8"/>
<text class="nrt" x="129" y="284">3</text>
<text class="t" x="188" y="293">Kunder</text>
<text class="s" x="188" y="311">køber udstyr</text>
<path class="l" d="M210,376 V328" marker-end="url(#cr-pil)"/>
<text class="pr" x="222" y="356">leasing og lån</text>
<rect class="k" x="115" y="376" width="230" height="56" rx="10"/>
<circle class="nr" cx="129" cy="388" r="8"/>
<text class="nrt" x="129" y="392">4</text>
<text class="t" x="188" y="401">Finansiering</text>
<text class="s" x="188" y="419">leasing og lån</text>
<path class="ld" d="M115,44 H20 V296 H115" marker-end="url(#cr-pil)"/>
<text class="prm" x="67.5" y="170">videresalg</text>
<path class="g1" d="M345,44 C380,44 380,140 345,140" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M345,296 C410,296 410,168 345,168" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M345,296 C374,296 374,404 345,404" marker-end="url(#cr-pil-g)"/>
<line x1="115" x2="145" y1="448" y2="448" class="g1"/>
<text class="pg" x="155" y="452">fra forhandlere</text>
<line x1="115" x2="145" y1="470" y2="470" class="g1"/>
<text class="pg" x="155" y="474">betaling fra kunder</text>
<line x1="115" x2="145" y1="492" y2="492" class="g2"/>
<text class="pg" x="155" y="496">betaling over tid</text>
</svg>
