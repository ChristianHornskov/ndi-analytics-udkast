<svg class="cr-model cr-model-d" viewBox="0 0 440 420" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Super Micro penge på komplette datacentre</title>
<desc id="cr-model-d">1. Super Micro samler servere, køling og strøm som standardmoduler. 2. Kunder og forhandlere kan købe et helt datacenter sat sammen af modulerne. 3. De køber også dele, tilbehør, service og software. 4. Anlægget sættes op i kundernes datacentre. De gule pile viser Super Micros indtægter: kunder og forhandlere betaler for et komplet datacenter og for dele, service og software.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:middle;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:middle;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .mt{text-anchor:middle;font:500 12px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .mk{fill:#0d1921;stroke:#89aeb4;stroke-width:1}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="20" y="10" width="400" height="92" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="38" cy="24" r="8"/>
<text class="nrt" x="38" y="27.5">1</text>
<text class="t" x="58" y="32">Super Micro</text>
<text class="s" x="58" y="50">samler standardmoduler</text>
<rect class="mk" x="58" y="64" width="108" height="28" rx="6"/>
<text class="mt" x="112" y="83">servere</text>
<rect class="mk" x="184" y="64" width="108" height="28" rx="6"/>
<text class="mt" x="238" y="83">køling</text>
<rect class="mk" x="310" y="64" width="108" height="28" rx="6"/>
<text class="mt" x="364" y="83">strøm</text>
<text class="pr" x="130" y="122">helt datacenter</text>
<path class="l" d="M116,132 V200" marker-end="url(#cr-pil)"/>
<path class="g1" d="M144,202 V134" marker-end="url(#cr-pil-g)"/>
<text class="pg" x="130" y="222">betaling for</text>
<text class="pg" x="130" y="238">anlæg</text>
<text class="pr" x="310" y="122">dele og service</text>
<path class="l" d="M296,132 V200" marker-end="url(#cr-pil)"/>
<path class="g1" d="M324,202 V134" marker-end="url(#cr-pil-g)"/>
<text class="pg" x="310" y="222">betaling for</text>
<text class="pg" x="310" y="238">service</text>
<rect class="k" x="20" y="252" width="400" height="56" rx="10"/>
<circle class="nr" cx="38" cy="266" r="8"/>
<text class="nrt" x="38" y="269.5">2</text>
<text class="t" x="58" y="274">Kunder</text>
<text class="s" x="58" y="292">køber hele anlæg</text>
<path class="l" d="M220,308 V330" marker-end="url(#cr-pil)"/>
<text class="pr" x="330" y="322">sættes i drift</text>
<rect class="k" x="20" y="338" width="400" height="56" rx="10"/>
<circle class="nr" cx="38" cy="352" r="8"/>
<text class="nrt" x="38" y="355.5">3</text>
<text class="t" x="58" y="360">Datacentre</text>
<text class="s" x="58" y="378">hos kunden</text>
</svg>
