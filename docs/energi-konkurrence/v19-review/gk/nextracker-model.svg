<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan virker Nextpowers forretning</title>
<desc id="cr-model-d">1. Leverandører fremstiller ståldele og andre komponenter til Nextpower. 2. Nextpower sælger solcelle-trackere, der drejer panelerne med solen, række for række. 3. Entreprenøren, typisk en EPC, køber udstyret og bygger solkraftværket for ejeren. 4. Ejeren driver værket og sælger strømmen. 5. Nextpower sælger også elektrisk tilbehør, batterilagre og vekselrettere. Kunden betaler typisk Nextpower pr. projekt, og Nextpower betaler sine leverandører.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
<radialGradient id="cr-glod" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#89aeb4" stop-opacity=".28"/><stop offset="1" stop-color="#89aeb4" stop-opacity="0"/></radialGradient>
</defs>
<style>
.cr-model-d .t{font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .s{font:400 13px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:middle}
.cr-model-d .p{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:middle}
.cr-model-d .pg{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:start}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .sun{fill:#e8d98a;stroke:none}
.cr-model-d .ray{stroke:#e8d98a;stroke-width:1.4;stroke-linecap:round}
.cr-model-d .pan{fill:#0d1921;stroke:#89aeb4;stroke-width:1.3}
</style>
<!-- Særligt træk: to rækker, der drejer uafhængigt med solen -->
<circle class="sun" cx="210" cy="28" r="8"/>
<g class="ray" transform="translate(210,28)">
  <line x1="0" y1="-13" x2="0" y2="-18"/>
  <line x1="9" y1="-9" x2="13" y2="-13"/>
  <line x1="13" y1="0" x2="18" y2="0"/>
  <line x1="9" y1="9" x2="13" y2="13"/>
  <line x1="-9" y1="9" x2="-13" y2="13"/>
  <line x1="-13" y1="0" x2="-18" y2="0"/>
  <line x1="-9" y1="-9" x2="-13" y2="-13"/>
</g>
<!-- række 1, stejl hældning -->
<g transform="translate(186,78) rotate(-38)">
  <rect class="pan" x="-22" y="-6" width="44" height="12" rx="1.5"/>
  <line class="ik" x1="0" y1="6" x2="0" y2="16"/>
</g>
<!-- række 2, anden hældning -->
<g transform="translate(234,80) rotate(18)">
  <rect class="pan" x="-22" y="-6" width="44" height="12" rx="1.5"/>
  <line class="ik" x1="0" y1="6" x2="0" y2="16"/>
</g>
<!-- vareflow: trackere med solen, mærkat over pilen, ikke på den -->
<path class="l" d="M280,140 C298,140 300,74 300,74" marker-end="url(#cr-pil)"/>
<text class="p" x="248" y="24">trackere med solen</text>
<!-- vareflow: stål og dele -->
<path class="l" d="M124,160 H144" marker-end="url(#cr-pil)"/>
<text class="p" x="134" y="108">stål og dele</text>
<!-- knuder -->
<circle cx="212" cy="162" r="58" fill="url(#cr-glod)"/>
<rect class="k" x="16" y="120" width="108" height="80" rx="10"/>
<rect class="k" x="144" y="118" width="136" height="88" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<rect class="k" x="300" y="36" width="108" height="76" rx="10"/>
<rect class="k" x="296" y="186" width="118" height="76" rx="10"/>
<!-- numre -->
<g><circle class="nr" cx="28" cy="132" r="9"/><text class="nrt" x="28" y="135.5">1</text></g>
<g><circle class="nr" cx="156" cy="130" r="9"/><text class="nrt" x="156" y="133.5">2</text></g>
<g><circle class="nr" cx="312" cy="48" r="9"/><text class="nrt" x="312" y="52">3</text></g>
<g><circle class="nr" cx="308" cy="198" r="9"/><text class="nrt" x="308" y="202">4</text></g>
<!-- ikoner -->
<rect class="ik" x="58" y="132" width="22" height="10" rx="1"/>
<rect class="ik" x="62" y="144" width="22" height="10" rx="1"/>
<path class="l" d="M422,112 V186" marker-end="url(#cr-pil)"/>
<text class="p" x="354" y="142">færdigt</text>
<text class="p" x="354" y="158">solkraftværk</text>
<!-- navne inde i kasserne -->
<text class="t" x="70" y="172">Leverandør</text>
<text class="s" x="70" y="188">komponenter</text>
<text class="t" x="212" y="170">Nextpower</text>
<text class="s" x="212" y="186">trackere og</text>
<text class="s" x="212" y="200">andet udstyr</text>
<path class="ik" d="M342,58 l12,-8 l12,8 v5 h-24 z"/>
<text class="t" x="354" y="86">EPC</text>
<text class="s" x="354" y="102">bygger værket</text>
<path class="ik" d="M345,210 h20 l4,8 h-28 z"/>
<path class="ik" d="M355,210 v-8 M349,206 h12"/>
<text class="t" x="355" y="236">Ejer</text>
<text class="s" x="355" y="252">sælger strømmen</text>
<!-- betaling, egne pile, mærkater i forklaringen under, ikke på pilene -->
<path class="g1" d="M300,112 C300,230 236,232 222,206" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M300,112 C270,252 170,254 170,206" marker-end="url(#cr-pil-g)"/>
<line x1="16" x2="46" y1="258" y2="258" class="g1"/>
<text class="pg" x="54" y="262">betaling for trackere</text>
<line x1="16" x2="46" y1="280" y2="280" class="g2"/>
<text class="pg" x="54" y="284">betaling for andet udstyr</text>
</svg>
