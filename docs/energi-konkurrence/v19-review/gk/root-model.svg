<svg class="cr-model cr-model-d" viewBox="0 0 440 500" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan virker Roots forretning</title>
<desc id="cr-model-d">1. Kunden deler kørselsdata med Root, typisk via en testdrev i appen. 2. Root giver et tilbud og udsteder bil- eller indboforsikring. 3. Kunden betaler præmie og gebyrer til Root. 4. Ved en dækket skade udbetaler Root erstatning til kunden. 5. Samarbejdspartnere og uafhængige agenter formidler Roots forsikring, og Root betaler provision. De gule pile viser præmie og gebyrer fra kunden til Root. Provision til partnere er en udgift for Root.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .p{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Partner -->
<rect class="k" x="110" y="20" width="230" height="56" rx="10"/>
<circle class="nr" cx="122" cy="32" r="9"/><text class="nrt" x="122" y="36">1</text>
<circle class="ik" cx="148" cy="40" r="5.5"/>
<path class="ik" d="M139,62 C139,53 157,53 157,62"/>
<circle class="ik" cx="161" cy="42" r="4.5"/>
<path class="ik" d="M154,62 C154,55 170,55 170,62"/>
<text class="t" x="180" y="45">Partner</text><text class="s" x="180" y="63">formidler kunden</text>
<path class="l" d="M225,76 V146" marker-end="url(#cr-pil)"/>
<!-- 2 Kunde, telefonen viser testdrevet -->
<rect class="k" x="110" y="150" width="230" height="56" rx="10"/>
<circle class="nr" cx="122" cy="162" r="9"/><text class="nrt" x="122" y="166">2</text>
<circle class="ik" cx="146" cy="168" r="5.5"/>
<path class="ik" d="M137,192 C137,183 155,183 155,192"/>
<rect class="ik" x="160" y="164" width="11" height="18" rx="2"/>
<path class="ik" d="M163,167 h5 M163,178 h5"/>
<text class="t" x="180" y="175">Kunde</text><text class="s" x="180" y="193">deler kørselsdata</text>
<path class="l" d="M225,206 V276" marker-end="url(#cr-pil)"/>
<!-- 3 Root, gul ramme -->
<rect class="k" x="110" y="280" width="230" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="122" cy="292" r="9"/><text class="nrt" x="122" y="296">3</text>
<path class="ik" d="M154,288 L166,292 L166,305 C166,312 154,318 154,318 C154,318 142,312 142,305 L142,292 Z"/>
<text class="t" x="180" y="305">Root</text><text class="s" x="180" y="323">prissætter og dækker</text>
<!-- erstatning, venstre, ikke gul -->
<path class="l" d="M102,308 C70,308 70,178 102,178" marker-end="url(#cr-pil)"/>
<!-- provision, længere til venstre, ikke gul -->
<path class="l" d="M98,308 C40,308 40,48 98,48" marker-end="url(#cr-pil)"/>
<!-- præmie, stiplet gul, løbende over perioden -->
<path class="g2" d="M348,178 C386,178 386,308 348,308" marker-end="url(#cr-pil-g)"/>
<!-- gebyrer, fast gul, pr. betaling -->
<path class="g1" d="M348,178 C424,178 424,308 348,308" marker-end="url(#cr-pil-g)"/>
<!-- forklaring under tegningen, ikke på pilene -->
<line x1="110" x2="140" y1="400" y2="400" class="g2"/>
<text class="pg" x="150" y="404">præmie, løbende over perioden</text>
<line x1="110" x2="140" y1="428" y2="428" class="g1"/>
<text class="pg" x="150" y="432">gebyrer, pr. betaling</text>
</svg>
