<line x1="50" x2="80" y1="494" y2="494" class="l"/>
<text class="pv" x="90" y="498">lån til maskiner</text>
<line x1="50" x2="80" y1="516" y2="516" class="g2"/>
<text class="pg" x="90" y="520">take-or-pay, også ubrugt</text>
<line x1="50" x2="80" y1="538" y2="538" class="g1"/>
<text class="pg" x="90" y="542">betaling pr. time</text>
</svg>
