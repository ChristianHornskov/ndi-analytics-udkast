<circle class="nr" cx="64" cy="28" r="8"/>
<text class="nrt" x="64" y="32.5">1</text>
<text class="t" x="82" y="39">Kunder</text>
<text class="s" x="82" y="57">booker kapacitet</text>
<path class="l" d="M74,72 V106" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="90" y="96">booker kapacitet</text>
<rect class="k" x="50" y="110" width="200" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="64" cy="122" r="8"/>
<text class="nrt" x="64" y="126.5">2</text>
<text class="t" x="82" y="133">CoreWeave</text>
<text class="s" x="82" y="151">driver skyplatformen</text>
<path class="l" d="M74,166 V200" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="90" y="190">driver anlæg</text>
<rect class="k" x="50" y="204" width="200" height="56" rx="10"/>
<circle class="nr" cx="64" cy="216" r="8"/>
