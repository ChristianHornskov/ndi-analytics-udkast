<circle class="nr" cx="64" cy="404" r="8"/>
<text class="nrt" x="64" y="408.5">5</text>
<text class="t" x="82" y="415">Långivere</text>
<text class="s" x="82" y="433">stiller kapital</text>
<path class="g2" d="M250,44 C304,44 304,128 250,128" marker-end="url(#cr-pil-g-m)"/>
<path class="g1" d="M250,56 C322,56 322,140 250,140" marker-end="url(#cr-pil-g-m)"/>
