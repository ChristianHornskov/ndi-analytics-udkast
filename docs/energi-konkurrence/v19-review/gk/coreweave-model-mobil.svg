<svg class="cr-model cr-model-m" viewBox="0 0 340 560" role="img" aria-labelledby="cr-model-m-t cr-model-m-desc" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener CoreWeave penge på at leje AI-skykapacitet ud</title>
<desc id="cr-model-m-desc">1. Kunderne booker kapacitet hos CoreWeave, enten som reserveret kapacitet eller efter forbrug. 2. CoreWeave stiller skyplatformen til rådighed og driver den i egne og partneres datacentre. 3. Datacentrene leverer plads og strøm til de tætte computeranlæg. 4. Leverandører leverer grafikkort og andet udstyr. 5. Långivere stiller kapital til rådighed, ofte med de faste kundekontrakter som grundlag. De gule pile er kundernes betaling: take-or-pay, også når kapaciteten ikke bruges, og betaling pr. time.</desc>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
<marker id="cr-pil-v-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:start;font:500 12px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 12px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-m .pv{text-anchor:start;font:600 12px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.8;stroke-dasharray:5 4}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
