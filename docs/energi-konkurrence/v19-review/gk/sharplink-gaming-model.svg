<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Sharplink penge</title>
<desc id="cr-model-d">1. Sharplink henviser spillere til sportsbøger og netkasinoer via websites. 2. Spiludbyderne betaler provision, når de henviste spillere sætter penge ind eller spiller. 3. Sharplink stiller sin Ether til rådighed hos tredjepartsvalidatorer på Ethereum-netværket. 4. Validatorerne udbetaler staking-belønning tilbage til Sharplink. 5. Ved likvid staking får Sharplink en kvittering, som senere kan byttes til Ether. Pengestrømmene til Sharplink er provision fra spiludbyderne og staking-belønning fra netværket.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
<radialGradient id="cr-glod" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#89aeb4" stop-opacity=".28"/><stop offset="1" stop-color="#89aeb4" stop-opacity="0"/></radialGradient>
</defs>
<style>
.cr-model-d .t{font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .s{font:400 13px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:middle}
.cr-model-d .p{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:middle}
.cr-model-d .pg{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:middle}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- Sharplink henviser spillere (tilbage til spiludbydere) -->
<path class="ld" d="M275,72 C275,22 165,22 165,72" marker-end="url(#cr-pil)"/>
<text class="p" x="220" y="18">henviser spillere</text>
<!-- knuder -->
<circle cx="275" cy="102" r="58" fill="url(#cr-glod)"/>
<rect class="k" x="15" y="74" width="80" height="56" rx="10"/>
<rect class="k" x="125" y="74" width="80" height="56" rx="10"/>
<rect class="k" x="235" y="74" width="80" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<rect class="k" x="345" y="74" width="80" height="56" rx="10"/>
<!-- numre -->
<g><circle class="nr" cx="85" cy="82" r="9"/><text class="nrt" x="85" y="86">1</text></g>
<g><circle class="nr" cx="195" cy="82" r="9"/><text class="nrt" x="195" y="86">2</text></g>
<g><circle class="nr" cx="305" cy="82" r="9"/><text class="nrt" x="305" y="86">3</text></g>
<g><circle class="nr" cx="415" cy="82" r="9"/><text class="nrt" x="415" y="86">4</text></g>
<!-- ikoner: person, spilrude, kasse/net, validator-node -->
<circle class="ik" cx="55" cy="94" r="7"/><path class="ik" d="M41,118 C41,108 69,108 69,118"/>
<rect class="ik" x="143" y="88" width="24" height="24" rx="4"/><path class="ik" d="M149,100 L153,94 L157,104 L163,97"/>
<path class="ik" d="M255,90 h40 v28 h-40 z M263,98 h24 M263,106 h16"/>
<circle class="ik" cx="385" cy="102" r="16"/><circle class="ik" cx="385" cy="102" r="6"/><path class="ik" d="M385,86 v8 M385,110 v8 M369,102 h8 M393,102 h8"/>
<!-- grå flow -->
<path class="l" d="M97,102 H122" marker-end="url(#cr-pil)"/>
<text class="p" x="110" y="66">indskud og spil</text>
<path class="l" d="M317,102 H342" marker-end="url(#cr-pil)"/>
<text class="p" x="360" y="66">stiller Ether</text>
<!-- navne -->
<text class="t" x="55" y="152">Spillere</text><text class="s" x="55" y="169">sætter penge ind</text>
<text class="t" x="165" y="152">Spiludbydere</text><text class="s" x="165" y="169">driver sites</text>
<text class="t" x="275" y="152">Sharplink</text><text class="s" x="275" y="169">staker Ether</text>
<text class="t" x="385" y="152">Validatorer</text><text class="s" x="385" y="169">sikrer netværket</text>
<!-- gule pengepile til Sharplink -->
<path class="g1" d="M165,190 C165,228 250,228 268,196" marker-end="url(#cr-pil-g)"/>
<text class="pg" x="200" y="242">provision pr. spiller</text>
<path class="g2" d="M385,190 C385,276 275,276 282,198" marker-end="url(#cr-pil-g)"/>
<text class="pg" x="330" y="292">staking-belønning</text>
</svg>
