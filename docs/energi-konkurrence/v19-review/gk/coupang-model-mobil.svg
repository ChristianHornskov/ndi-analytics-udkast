<svg class="cr-model cr-model-m" viewBox="0 0 340 460" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener Coupang penge, og hvordan selskabet selv kører varerne ud næste dag</title>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:end;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="20" y="16" width="230" height="56" rx="10"/>
<circle class="nr" cx="34" cy="28" r="8"/>
<text class="nrt" x="34" y="32.5">1</text>
<text class="t" x="52" y="39">Leverandører</text>
<text class="s" x="52" y="57">og sælgere</text>
<path class="l" d="M135,72 V106" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="123" y="94">varer</text>
<rect class="k" x="20" y="110" width="230" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="34" cy="122" r="8"/>
<text class="nrt" x="34" y="126.5">2</text>
<text class="t" x="52" y="133">Coupang</text>
<text class="s" x="52" y="151">eget lager</text>
<path class="g1" d="M250,44 C304,44 304,122 250,122" marker-end="url(#cr-pil-gm)"/>
<path class="l" d="M135,166 V200" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="123" y="188">til egne biler</text>
<rect class="k" x="20" y="204" width="230" height="56" rx="10"/>
<circle class="nr" cx="34" cy="216" r="8"/>
<text class="nrt" x="34" y="220.5">3</text>
<text class="t" x="52" y="227">Levering</text>
<text class="s" x="52" y="245">egne biler</text>
<path class="l" d="M135,260 V294" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="123" y="282">næste dag</text>
<rect class="k" x="20" y="298" width="230" height="56" rx="10"/>
<circle class="nr" cx="34" cy="310" r="8"/>
<text class="nrt" x="34" y="314.5">4</text>
<text class="t" x="52" y="321">Kunden</text>
<text class="s" x="52" y="339">ofte næste dag</text>
<path class="g1" d="M250,326 C304,326 304,148 250,148" marker-end="url(#cr-pil-gm)"/>
<path class="g1" d="M250,348 C328,348 328,164 250,164" marker-end="url(#cr-pil-gm)"/>
<line x1="20" x2="50" y1="390" y2="390" class="g1"/>
<text class="pg" x="60" y="394">provision fra sælgere</text>
<line x1="20" x2="50" y1="412" y2="412" class="g1"/>
<text class="pg" x="60" y="416">betaling for varer</text>
<line x1="20" x2="50" y1="434" y2="434" class="g1"/>
<text class="pg" x="60" y="438">medlemskab og reklame</text>
</svg>
