<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan får Trilogy Metals penge til at undersøge miner</title>
<desc id="cr-model-d">1. Investorer får nye aktier i Trilogy Metals. 2. Trilogy Metals ejer halvdelen af Ambler Metals og betaler sin del af udgifterne. 3. Ambler Metals ejer projekterne og driver arbejdet. 4. South32 ejer den anden halvdel og betaler sin del af udgifterne. Investorerne betaler Trilogy Metals for nye aktier.</desc>
