<svg class="cr-model cr-model-d" viewBox="0 0 440 500" role="img" aria-labelledby="cr-rl-t cr-rl-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-rl-t">Sådan tjener Rocket Lab penge</title>
<desc id="cr-rl-d">1. Kunder bestiller opsendelse, et rumfartøj eller begge dele. 2. Rocket Lab tager ordren. 3. Rumsystemer bygger rumfartøjet eller leverer dele. 4. Opsendelse bringer lasten i kredsløb med Electron fra egne affyringspladser, blandt andet i New Zealand. Det særlige er, at samme selskab både kan bygge rumfartøjet og sende det op. Kunder betaler dels for opsendelse, dels for rumfartøjer og dele.</desc>
<defs>
<marker id="cr-rl-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-rl-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:middle;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="107" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="119" cy="32" r="8"/><text class="nrt" x="119" y="36">1</text>
<text class="t" x="184" y="45">Kunder</text>
<text class="s" x="184" y="63">bestiller</text>
<path class="l" d="M220,76 V122" marker-end="url(#cr-rl-pil)"/>
<text class="pr" x="160" y="105">bestiller</text>
<rect class="k" x="107" y="126" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="119" cy="138" r="8"/><text class="nrt" x="119" y="142">2</text>
<text class="t" x="184" y="151">Rocket Lab</text>
<text class="s" x="184" y="169">tager ordren</text>
<path class="l" d="M200,182 L200,210 L115,210 L115,256" marker-end="url(#cr-rl-pil)"/>
<path class="l" d="M240,182 L240,210 L325,210 L325,256" marker-end="url(#cr-rl-pil)"/>
<text class="pr" x="70" y="236">bygger</text>
<text class="pr" x="385" y="236">sender op</text>
<rect class="k" x="20" y="260" width="190" height="56" rx="10"/>
<circle class="nr" cx="36" cy="272" r="8"/><text class="nrt" x="36" y="276">3</text>
<text class="t" x="52" y="285">Rumsystemer</text>
<text class="s" x="52" y="303">bygger fartøj</text>
<rect class="k" x="230" y="260" width="190" height="56" rx="10"/>
<circle class="nr" cx="246" cy="272" r="8"/><text class="nrt" x="246" y="276">4</text>
<text class="t" x="262" y="285">Opsendelse</text>
<text class="s" x="262" y="303">egne pladser i NZ</text>
<path class="g1" d="M333,48 C390,48 390,154 333,154" marker-end="url(#cr-rl-pil-g)"/>
<path class="g1" d="M333,48 C412,48 412,154 333,154" marker-end="url(#cr-rl-pil-g)"/>
<line x1="74" x2="104" y1="360" y2="360" class="g1"/>
<text class="pg" x="114" y="364">betaling for opsendelse</text>
<line x1="74" x2="104" y1="388" y2="388" class="g1"/>
<text class="pg" x="114" y="392">betaling for rumfartøj</text>
</svg>
