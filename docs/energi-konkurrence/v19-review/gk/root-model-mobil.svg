<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t cr-model-m-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan virker Roots forretning</title>
<desc id="cr-model-m-d">1. Kunden deler kørselsdata med Root, typisk via en testdrev i appen. 2. Root giver et tilbud og udsteder bil- eller indboforsikring. 3. Kunden betaler præmie og gebyrer til Root. 4. Ved en dækket skade udbetaler Root erstatning til kunden. 5. Samarbejdspartnere og uafhængige agenter formidler Roots forsikring, og Root betaler provision. De gule pile viser præmie og gebyrer fra kunden til Root. Provision til partnere er en udgift for Root.</desc>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-m-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .p{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Partner -->
<rect class="k" x="48" y="20" width="246" height="56" rx="10"/>
<circle class="nr" cx="60" cy="32" r="9"/><text class="nrt" x="60" y="36">1</text>
<circle class="ik" cx="90" cy="40" r="6"/>
<path class="ik" d="M80,62 C80,52 100,52 100,62"/>
<circle class="ik" cx="104" cy="42" r="5"/>
<path class="ik" d="M96,62 C96,54 114,54 114,62"/>
<text class="t" x="126" y="45">Partner</text><text class="s" x="126" y="63">formidler kunden</text>
<path class="l" d="M171,76 V146" marker-end="url(#cr-pil-m)"/>
<!-- 2 Kunde -->
<rect class="k" x="48" y="150" width="246" height="56" rx="10"/>
<circle class="nr" cx="60" cy="162" r="9"/><text class="nrt" x="60" y="166">2</text>
<circle class="ik" cx="88" cy="168" r="6"/>
<path class="ik" d="M78,192 C78,182 98,182 98,192"/>
<rect class="ik" x="104" y="164" width="12" height="20" rx="2"/>
<path class="ik" d="M107,167 h6 M107,181 h6"/>
<text class="t" x="126" y="175">Kunde</text><text class="s" x="126" y="193">deler kørselsdata</text>
<path class="l" d="M171,206 V276" marker-end="url(#cr-pil-m)"/>
<!-- 3 Root, gul ramme -->
<rect class="k" x="48" y="280" width="246" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="60" cy="292" r="9"/><text class="nrt" x="60" y="296">3</text>
<path class="ik" d="M92,288 L106,292 L106,306 C106,314 92,320 92,320 C92,320 78,314 78,306 L78,292 Z"/>
<text class="t" x="126" y="305">Root</text><text class="s" x="126" y="323">prissætter og dækker</text>
<!-- erstatning, venstre, ikke gul -->
<path class="l" d="M40,308 C22,308 22,178 40,178" marker-end="url(#cr-pil-m)"/>
<!-- provision, yderligere til venstre, ikke gul -->
<path class="l" d="M38,308 C8,308 8,48 38,48" marker-end="url(#cr-pil-m)"/>
<!-- præmie, stiplet gul -->
<path class="g2" d="M300,178 C318,178 318,308 300,308" marker-end="url(#cr-pil-m-g)"/>
<!-- gebyrer, fast gul -->
<path class="g1" d="M300,178 C332,178 332,308 300,308" marker-end="url(#cr-pil-m-g)"/>
<line x1="48" x2="78" y1="400" y2="400" class="g2"/>
<text class="pg" x="88" y="404">præmie, løbende over perioden</text>
<line x1="48" x2="78" y1="428" y2="428" class="g1"/>
<text class="pg" x="88" y="432">gebyrer, pr. betaling</text>
</svg>
