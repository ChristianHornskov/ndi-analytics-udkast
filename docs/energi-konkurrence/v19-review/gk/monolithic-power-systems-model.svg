<svg class="cr-model cr-model-d" viewBox="0 0 440 520" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Monolithic Power Systems penge</title>
<desc id="cr-model-d">1. Selskabet designer chipene og stiller sin egen procesteknologi til rådighed for støberierne. 2. Uafhængige støberier fremstiller siliciumskiverne, og andre partnere samler og tester chipene. 3. Distributører sælger chipene videre til elektronikproducenterne. 4. En del kunder køber også direkte. 5. Pengene kommer som betaling for leverede chips, typisk efter en indkøbsordre.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:start;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- egen procesteknologi: MPS (2) tilbage til støberi (1). Ingen tekst på buen; forklaring i legenden. -->
<path class="ld" d="M84,158 C22,158 22,48 84,48" marker-end="url(#cr-pil)"/>
<rect class="k" x="90" y="20" width="240" height="56" rx="10"/>
<circle class="nr" cx="106" cy="36" r="9"/><text class="nrt" x="106" y="40">1</text>
<path class="ik" d="M128,62 V42 H136 V36 H142 V42 H158 V62 Z M132,50h6v6h-6z M146,50h6v6h-6z"/>
<text class="t" x="174" y="44">Støberi</text><text class="s" x="174" y="62">laver skiverne</text>
<path class="l" d="M130,78 V126" marker-end="url(#cr-pil)"/>
<text class="pr" x="178" y="108">færdige chips</text>
<rect class="k" x="90" y="130" width="240" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="106" cy="146" r="9"/><text class="nrt" x="106" y="150">2</text>
<rect class="ik" x="122" y="144" width="24" height="24" rx="3"/>
<path class="ik" d="M128,150h12M128,156h12M128,162h12"/>
<text class="t" x="174" y="154">MPS</text><text class="s" x="174" y="172">designer chipene</text>
<path class="l" d="M130,188 V236" marker-end="url(#cr-pil)"/>
<text class="pr" x="178" y="218">leverer chips</text>
<rect class="k" x="90" y="240" width="240" height="56" rx="10"/>
<circle class="nr" cx="106" cy="256" r="9"/><text class="nrt" x="106" y="260">3</text>
<path class="ik" d="M118,250 h28 v16 h-10 v10 h-18 z"/>
<text class="t" x="174" y="264">Distributør</text><text class="s" x="174" y="282">sælger videre</text>
<path class="l" d="M130,298 V346" marker-end="url(#cr-pil)"/>
<text class="pr" x="178" y="328">sælger videre</text>
<rect class="k" x="90" y="350" width="240" height="56" rx="10"/>
<circle class="nr" cx="106" cy="366" r="9"/><text class="nrt" x="106" y="370">4</text>
<rect class="ik" x="122" y="366" width="28" height="18" rx="2"/><path class="ik" d="M128,374h16"/>
<text class="t" x="174" y="375">Kunde</text><text class="s" x="174" y="393">bygger elektronik</text>
<!-- direkte salg: yderste bue til højre, MPS til kunde. Ingen tekst på buen. -->
<path class="ld" d="M336,158 C428,158 428,378 336,378" marker-end="url(#cr-pil)"/>
<!-- gule betalinger til MPS. Indre bue fra distributør, midterste fra kunde. Forklaring i legenden. -->
<path class="g1" d="M336,268 C376,268 376,164 336,164" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M336,390 C404,390 404,148 336,148" marker-end="url(#cr-pil-g)"/>
<!-- legende -->
<line x1="90" x2="120" y1="436" y2="436" class="ld"/>
<text class="pr" x="130" y="440">egen procesteknologi, til støberiet</text>
<line x1="90" x2="120" y1="458" y2="458" class="ld"/>
<text class="pr" x="130" y="462">direkte salg, til kunden</text>
<line x1="90" x2="120" y1="480" y2="480" class="g1"/>
<text class="pg" x="130" y="484">betaler for chips, fra distributør</text>
<line x1="90" x2="120" y1="502" y2="502" class="g2"/>
<text class="pg" x="130" y="506">betaler direkte, fra kunden</text>
</svg>
