<line x1="24" x2="54" y1="400" y2="400" class="g1"/>
<text class="pg" x="64" y="404">betaling for udviklingsarbejde</text>
<line x1="24" x2="54" y1="428" y2="428" class="g2"/>
<text class="pg" x="64" y="432">senere betaling for montering</text>
<text class="pg" x="64" y="450">og softwarestøtte</text>
</svg>
