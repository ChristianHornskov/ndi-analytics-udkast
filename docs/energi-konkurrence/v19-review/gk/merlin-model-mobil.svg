<!-- 4 New Zealand -->
<rect class="k" x="50" y="304" width="226" height="64" rx="10"/>
<circle class="nr" cx="66" cy="320" r="9"/>
<text class="nrt" x="66" y="324">4</text>
<circle class="ik" cx="94" cy="326" r="5"/>
<path class="ik" d="M86,342 C86,334 102,334 102,342"/>
<circle class="ik" cx="110" cy="326" r="5"/>
<path class="ik" d="M102,342 C102,334 118,334 118,342"/>
