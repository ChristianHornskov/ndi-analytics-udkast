<text class="s" x="130" y="58">bestiller opgaver</text>
<path class="l" d="M100,80 V108" marker-end="url(#cr-pil-m)"/>
<!-- 2 Merlin -->
<rect class="k" x="50" y="112" width="226" height="64" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="66" cy="128" r="9"/>
<text class="nrt" x="66" y="132">2</text>
<rect class="ik" x="86" y="126" width="22" height="22" rx="3"/>
<path class="ik" d="M90,126 V122 M97,126 V122 M104,126 V122 M90,148 V152 M97,148 V152 M104,148 V152 M86,130 H82 M86,137 H82 M86,144 H82 M108,130 H112 M108,137 H112 M108,144 H112"/>
