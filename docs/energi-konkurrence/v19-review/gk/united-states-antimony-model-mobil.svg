<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan kommer malm ind, og hvordan kunderne betaler United States Antimony</title>
<desc id="cr-model-m-d">Egne miner og udenlandske leverandører sender antimonmalm til selskabets anlæg. Anlægget forarbejder malmen. Defense Logistics Agency køber antimonbarrer til beredskabsreserven. Industrikunder køber trioxid og zeolit. Betalingen kommer pr. leverance.</desc>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 14px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 12px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pg{text-anchor:start;font:600 12px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .p{text-anchor:start;font:500 12px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="16" y="18" width="148" height="70" rx="10"/>
<circle class="nr" cx="30" cy="32" r="9"/><text class="nrt" x="30" y="36">1</text>
<path class="ik" d="M48,64 L58,44 L68,64 Z"/>
<text class="t" x="74" y="46">Miner</text>
<text class="s" x="74" y="64">egne miner</text>
<rect class="k" x="176" y="18" width="148" height="70" rx="10"/>
<circle class="nr" cx="190" cy="32" r="9"/><text class="nrt" x="190" y="36">2</text>
