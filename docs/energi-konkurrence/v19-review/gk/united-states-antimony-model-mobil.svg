<path class="l" d="M210,196 L250,226" marker-end="url(#cr-pil-m)"/>
<rect class="k" x="16" y="232" width="148" height="70" rx="10"/>
<circle class="nr" cx="30" cy="246" r="9"/><text class="nrt" x="30" y="250">4</text>
<path class="ik" d="M58,250 L48,257 V271 L58,278 L68,271 V257 Z"/>
<text class="t" x="74" y="260">DLA</text>
<text class="s" x="74" y="278">antimonbarrer</text>
<rect class="k" x="176" y="232" width="148" height="70" rx="10"/>
<circle class="nr" cx="190" cy="246" r="9"/><text class="nrt" x="190" y="250">5</text>
<rect class="ik" x="204" y="258" width="12" height="16" rx="1"/>
<rect class="ik" x="218" y="252" width="10" height="22" rx="1"/>
<text class="t" x="220" y="260">Industri</text>
<text class="s" x="220" y="278">trioxid, zeolit</text>
