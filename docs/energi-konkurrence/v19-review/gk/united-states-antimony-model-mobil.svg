<line x1="20" x2="48" y1="370" y2="370" class="l"/>
<text class="p" x="56" y="374">antimonbarrer, til DLA</text>
<line x1="20" x2="48" y1="392" y2="392" class="l"/>
<text class="p" x="56" y="396">produkter, til industri</text>
<line x1="20" x2="48" y1="414" y2="414" class="g1"/>
<text class="pg" x="56" y="418">betaling pr. parti, fra DLA</text>
<line x1="20" x2="48" y1="436" y2="436" class="g1"/>
<text class="pg" x="56" y="440">betaling pr. leverance, fra industri</text>
</svg>
