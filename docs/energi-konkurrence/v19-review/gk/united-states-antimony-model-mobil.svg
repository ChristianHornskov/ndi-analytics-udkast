<path class="l" d="M250,88 L190,118" marker-end="url(#cr-pil-m)"/>
<rect class="k" x="70" y="124" width="200" height="72" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="86" cy="140" r="9"/><text class="nrt" x="86" y="144">3</text>
<rect class="ik" x="104" y="150" width="14" height="18" rx="1"/>
<path class="ik" d="M108,150 V144 H114 V150"/>
