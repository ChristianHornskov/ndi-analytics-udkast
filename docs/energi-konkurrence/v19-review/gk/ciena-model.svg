<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t" xmlns="http://www.w3.org/2000/svg"><title id="cr-model-t">Sådan tjener Ciena penge</title><desc id="cr-model-d-desc">Fabrikker leverer udstyr til Ciena. Ciena sælger til cloududbydere og teleselskaber, som betaler for udstyr og løbende for tjenester.</desc><defs>
<marker id="cr-pil-cien" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g-cien" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs><style>.cr-model-d .t{text-anchor:middle;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:middle;font:400 13px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .p{text-anchor:middle;font:500 12px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 12px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8;stroke-linecap:round}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:4 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .leg{fill:#0d1921;stroke:#3a4658;stroke-width:1}</style>
<!-- goods arrows -->
<path class="l" d="M220,68 V92" marker-end="url(#cr-pil-cien)"/>
<path class="l" d="M170,148 L90,180" marker-end="url(#cr-pil-cien)"/>
<path class="l" d="M270,148 L350,180" marker-end="url(#cr-pil-cien)"/>
<!-- yellow payments: outside arcs, no labels on the arrows -->
<path class="g1" d="M160,188 C36,188 36,120 150,120" marker-end="url(#cr-pil-g-cien)"/>
<path class="g2" d="M160,200 C10,200 10,100 150,108" marker-end="url(#cr-pil-g-cien)"/>
<path class="g1" d="M280,188 C404,188 404,120 290,120" marker-end="url(#cr-pil-g-cien)"/>
<path class="g2" d="M280,200 C430,200 430,100 290,108" marker-end="url(#cr-pil-g-cien)"/>
<!-- boxes -->
<rect class="k" x="150" y="12" width="140" height="56" rx="10"/>
<circle class="nr" cx="164" cy="26" r="9"/>
<text class="nrt" x="164" y="30">1</text>
<text class="t" x="220" y="34">Fabrikker</text>
<text class="s" x="220" y="52">laver udstyr</text>
<rect class="k" x="150" y="92" width="140" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="164" cy="106" r="9"/>
<text class="nrt" x="164" y="110">2</text>
<text class="t" x="220" y="114">Ciena</text>
<text class="s" x="220" y="132">sælger netudstyr</text>
<rect class="k" x="20" y="180" width="140" height="56" rx="10"/>
<circle class="nr" cx="34" cy="194" r="9"/>
<text class="nrt" x="34" y="198">3</text>
<text class="t" x="90" y="202">Cloud</text>
<text class="s" x="90" y="220">store datacentre</text>
<rect class="k" x="280" y="180" width="140" height="56" rx="10"/>
<circle class="nr" cx="294" cy="194" r="9"/>
<text class="nrt" x="294" y="198">4</text>
<text class="t" x="350" y="202">Tele</text>
<text class="s" x="350" y="220">driver telenet</text>
<!-- goods labels in gaps, not on arrows -->
<text class="p" x="310" y="80">udstyr efter design</text>
<text class="p" x="125" y="162">udstyr til datacentre</text>
<text class="p" x="315" y="162">udstyr og tjenester</text>
<!-- legend box -->
<rect class="leg" x="20" y="246" width="400" height="46" rx="8"/>
<line x1="34" x2="58" y1="264" y2="264" class="g1"/>
<text class="pg" x="66" y="268">betaling for udstyr</text>
<line x1="230" x2="254" y1="264" y2="264" class="g2"/>
<text class="pg" x="262" y="268">løbende betaling</text>
<text class="pg" x="66" y="284">de gule pile går fra kunderne til Ciena</text>
</svg>