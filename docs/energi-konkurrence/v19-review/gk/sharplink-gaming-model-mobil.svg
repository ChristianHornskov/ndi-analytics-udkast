<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t cr-model-m-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener Sharplink penge</title>
<desc id="cr-model-m-d">1. Sharplink henviser spillere til sportsbøger og netkasinoer via websites. 2. Spiludbyderne betaler provision, når de henviste spillere sætter penge ind eller spiller. 3. Sharplink stiller sin Ether til rådighed hos tredjepartsvalidatorer på Ethereum-netværket. 4. Validatorerne udbetaler staking-belønning tilbage til Sharplink. 5. Ved likvid staking får Sharplink en kvittering, som senere kan byttes til Ether. Pengestrømmene til Sharplink er provision fra spiludbyderne og staking-belønning fra netværket.</desc>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:middle;font:500 12.5px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- henvisning fra Sharplink op til spiludbydere, venstre side -->
<path class="ld" d="M54,262 C18,262 18,164 54,164" marker-end="url(#cr-pil-m)"/>
<text class="pr" transform="translate(14,213) rotate(-90)">henviser spillere</text>
<!-- knude 1 Spillere -->
<rect class="k" x="60" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="34" r="9"/>
<text class="nrt" x="74" y="38">1</text>
<circle class="ik" cx="100" cy="40" r="7"/>
<path class="ik" d="M86,64 C86,54 114,54 114,64"/>
<text class="t" x="134" y="45">Spillere</text>
<text class="s" x="134" y="63">sætter penge ind</text>
<path class="l" d="M100,78 V126" marker-end="url(#cr-pil-m)"/>
<!-- knude 2 Spiludbydere -->
<rect class="k" x="60" y="130" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="144" r="9"/>
<text class="nrt" x="74" y="148">2</text>
<rect class="ik" x="88" y="144" width="24" height="24" rx="4"/>
<path class="ik" d="M94,156 L98,150 L102,160 L108,153"/>
<text class="t" x="134" y="155">Spiludbydere</text>
<text class="s" x="134" y="173">driver sites</text>
<path class="l" d="M100,188 V236" marker-end="url(#cr-pil-m)"/>
<!-- knude 3 Sharplink, gul ramme -->
<rect class="k" x="60" y="240" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="74" cy="254" r="9"/>
<text class="nrt" x="74" y="258">3</text>
<path class="ik" d="M88,250 h24 v28 h-24 z M94,258 h16 M94,266 h10"/>
<text class="t" x="134" y="265">Sharplink</text>
<text class="s" x="134" y="283">henviser og staker</text>
<path class="l" d="M100,298 V346" marker-end="url(#cr-pil-m)"/>
<!-- knude 4 Validatorer -->
<rect class="k" x="60" y="350" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="364" r="9"/>
<text class="nrt" x="74" y="368">4</text>
<circle class="ik" cx="100" cy="378" r="14"/>
<circle class="ik" cx="100" cy="378" r="5"/>
<text class="t" x="134" y="375">Validatorer</text>
<text class="s" x="134" y="393">sikrer netværket</text>
<!-- gule pengepile til højre, ind i Sharplink -->
<path class="g1" d="M290,158 C318,158 318,262 290,262" marker-end="url(#cr-pil-gm)"/>
<path class="g2" d="M290,384 C336,384 336,246 290,246" marker-end="url(#cr-pil-gm)"/>
<line x1="24" x2="54" y1="448" y2="448" class="g1"/>
<text class="pg" x="64" y="452">provision pr. spiller</text>
<line x1="24" x2="54" y1="476" y2="476" class="g2"/>
<text class="pg" x="64" y="480">staking-belønning</text>
</svg>
