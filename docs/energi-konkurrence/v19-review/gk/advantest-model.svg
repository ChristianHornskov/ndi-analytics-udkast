<svg class="cr-model cr-model-d" viewBox="0 0 440 330" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Advantest penge på testudstyr og service</title>
<desc id="cr-model-d">1. Advantest udvikler og sælger testudstyr og håndteringsmaskiner. 2. Kunderne er både selskaber, der designer chips, og fabrikker, der fremstiller dem. 3. Testudstyret står hos kunden. De gule pile er Advantests indtægter: betaling for testudstyr og løbende betaling for service.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .s{font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:middle}
.cr-model-d .pr{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:start}
.cr-model-d .pg{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:start}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="90" y="14" width="260" height="72" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="104" cy="28" r="8"/><text class="nrt" x="104" y="32.5">1</text>
<text class="t" x="220" y="38">Advantest</text>
<text class="s" x="220" y="56">testudstyr og</text>
<text class="s" x="220" y="72">håndteringsmaskiner</text>
<path class="l" d="M220,86 V110" marker-end="none"/>
<text class="pr" x="240" y="104">testudstyr hos kunden</text>
<path class="l" d="M220,110 L114,172" marker-end="url(#cr-pil)"/>
<path class="l" d="M220,110 L326,172" marker-end="url(#cr-pil)"/>
<rect class="k" x="24" y="172" width="180" height="70" rx="10"/>
<circle class="nr" cx="192" cy="172" r="8"/><text class="nrt" x="192" y="176.5">2</text>
<text class="t" x="114" y="204">Chipdesignere</text>
<text class="s" x="114" y="222">designer chipene</text>
<rect class="k" x="236" y="172" width="180" height="70" rx="10"/>
<circle class="nr" cx="404" cy="172" r="8"/><text class="nrt" x="404" y="176.5">3</text>
<text class="t" x="326" y="204">Fabrikker</text>
<text class="s" x="326" y="222">fremstiller chipene</text>
<path class="g1" d="M24,207 H12 V50 H90" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M416,207 H428 V50 H350" marker-end="url(#cr-pil-g)"/>
<line x1="90" x2="120" y1="280" y2="280" class="g1"/>
<text class="pg" x="130" y="284">betaling for udstyr</text>
<line x1="90" x2="120" y1="304" y2="304" class="g2"/>
<text class="pg" x="130" y="308">betaling for service</text>
</svg>
