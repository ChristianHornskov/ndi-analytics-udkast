<line x1="90" x2="120" y1="516" y2="516" class="g2"/>
<text class="pg" x="130" y="520">take-or-pay, også ubrugt</text>
<line x1="90" x2="120" y1="538" y2="538" class="g1"/>
<text class="pg" x="130" y="542">betaling pr. time</text>
</svg>
