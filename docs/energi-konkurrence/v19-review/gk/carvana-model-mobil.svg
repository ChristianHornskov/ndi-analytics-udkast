<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener Carvana penge på køb og salg af brugte biler</title>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:middle;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="16" y="10" width="230" height="56" rx="10"/>
<circle class="nr" cx="30" cy="22" r="8"/><text class="nrt" x="30" y="26">1</text>
<text class="t" x="48" y="34">Sælgere</text>
<text class="s" x="48" y="52">sælger eller bytter</text>
<path class="l" d="M50,68 V96" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="160" y="88">brugte biler</text>
<rect class="k" x="16" y="100" width="230" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="30" cy="112" r="8"/><text class="nrt" x="30" y="116">2</text>
<text class="t" x="48" y="124">Carvana</text>
<text class="s" x="48" y="142">klargør og udbyder</text>
<path class="l" d="M50,158 V186" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="180" y="178">bil og 7 dages retur</text>
<rect class="k" x="16" y="190" width="230" height="56" rx="10"/>
<circle class="nr" cx="30" cy="202" r="8"/><text class="nrt" x="30" y="206">3</text>
<text class="t" x="48" y="214">Købere</text>
<text class="s" x="48" y="232">privat, kan returnere</text>
<path class="l" d="M50,248 V276" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="160" y="268">biler til engros</text>
<rect class="k" x="16" y="280" width="230" height="56" rx="10"/>
<circle class="nr" cx="30" cy="292" r="8"/><text class="nrt" x="30" y="296">4</text>
<text class="t" x="48" y="304">Engros</text>
<text class="s" x="48" y="322">køber øvrige biler</text>
<path class="l" d="M50,338 V366" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="170" y="358">videresolgte billån</text>
<rect class="k" x="16" y="370" width="230" height="56" rx="10"/>
<circle class="nr" cx="30" cy="382" r="8"/><text class="nrt" x="30" y="386">5</text>
<text class="t" x="48" y="394">Investor</text>
<text class="s" x="48" y="412">køber billånene</text>
<path class="g1" d="M248,218 C300,218 300,140 248,140" marker-end="url(#cr-pil-gm)"/>
<path class="g1" d="M248,308 C318,308 318,136 248,136" marker-end="url(#cr-pil-gm)"/>
<path class="g1" d="M248,398 C336,398 336,132 248,132" marker-end="url(#cr-pil-gm)"/>
<line x1="16" x2="44" y1="444" y2="444" class="g1"/>
<text class="pg" x="52" y="448">betaling for bilen, fra køberne</text>
<line x1="16" x2="44" y1="466" y2="466" class="g1"/>
<text class="pg" x="52" y="470">betaling fra engros</text>
<line x1="16" x2="44" y1="488" y2="488" class="g1"/>
<text class="pg" x="52" y="492">betaling for lån, fra investorer</text>
</svg>
