<svg class="cr-model cr-model-m" viewBox="0 0 340 520" role="img" aria-labelledby="cr-hrz-m-t cr-hrz-m-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-hrz-m-t">Sådan tjener Horizon Robotics penge</title>
<desc id="cr-hrz-m-d">1. Horizon Robotics udvikler Journey-processorer, algoritmer og software. 2. En stor del af hardwaren går ud gennem partnere, som bygger løsningerne ind hos bilproducenterne. 3. Bilproducenter og underleverandører betaler for færdige produktløsninger og for licenser. 4. Producenter af robotter og andre apparater betaler for processorer og udviklersæt. De gule pile viser betaling fra bilkunder og apparatkunder til Horizon Robotics.</desc>
<defs>
<marker id="cr-hrz-m-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-hrz-m-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 15px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 12.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:middle;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Horizon -->
<rect class="k" x="110" y="16" width="200" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="126" cy="28" r="8"/><text class="nrt" x="126" y="32">1</text>
<text class="t" x="142" y="40">Horizon</text>
<text class="s" x="142" y="58">processor og software</text>
<path class="l" d="M210,72 V120" marker-end="url(#cr-hrz-m-pil)"/>
<text class="pr" x="168" y="102">hardware</text>
<!-- 4 Apparater -->
<rect class="k" x="8" y="134" width="110" height="56" rx="10"/>
<circle class="nr" cx="22" cy="146" r="8"/><text class="nrt" x="22" y="150">4</text>
<text class="t" x="34" y="158">Apparater</text>
<text class="s" x="34" y="176">udviklersæt</text>
<path class="l" d="M110,44 H60 V134" marker-end="url(#cr-hrz-m-pil)"/>
<text class="pr" x="102" y="96">processorer</text>
<!-- 2 Partnere -->
<rect class="k" x="130" y="134" width="200" height="56" rx="10"/>
<circle class="nr" cx="146" cy="146" r="8"/><text class="nrt" x="146" y="150">2</text>
<text class="t" x="162" y="158">Partnere</text>
<text class="s" x="162" y="176">bygger løsningen ind</text>
<path class="l" d="M230,190 V238" marker-end="url(#cr-hrz-m-pil)"/>
<text class="pr" x="172" y="220">løsninger</text>
<!-- 3 Bilkunder -->
<rect class="k" x="110" y="252" width="200" height="56" rx="10"/>
<circle class="nr" cx="126" cy="264" r="8"/><text class="nrt" x="126" y="268">3</text>
<text class="t" x="142" y="276">Bilkunder</text>
<text class="s" x="142" y="294">køber løsninger</text>
<!-- Gule pile uden tekst på pilene -->
<path class="g1" d="M310,266 C338,266 338,52 310,44" marker-end="url(#cr-hrz-m-pil-g)"/>
<path class="g1" d="M40,134 C40,70 90,70 110,44" marker-end="url(#cr-hrz-m-pil-g)"/>
<line x1="16" x2="44" y1="350" y2="350" class="g1"/>
<text class="pg" x="54" y="354">betaling fra bilkunder</text>
<line x1="16" x2="44" y1="378" y2="378" class="g1"/>
<text class="pg" x="54" y="382">betaling fra apparater</text>
</svg>
