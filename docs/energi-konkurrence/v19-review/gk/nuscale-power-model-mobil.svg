<text class="pr" x="186" y="96">arbejde og licens</text>
<rect class="k" x="40" y="114" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="52" cy="126" r="8"/><text class="nrt" x="52" y="130">2</text>
<rect class="ik" x="72" y="128" width="24" height="24" rx="12"/><path class="ik" d="M84,132 v16 M76,140 h16"/>
<text class="t" x="118" y="138">NuScale</text>
<text class="s" x="118" y="156">udvikler reaktoren</text>
<path class="l" d="M80,172 V208" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="186" y="194">eksklusivt partnerskab</text>
<rect class="k" x="40" y="212" width="226" height="56" rx="10"/>
<circle class="nr" cx="52" cy="224" r="8"/><text class="nrt" x="52" y="228">3</text>
<path class="ik" d="M72,236 C77,230 87,230 92,236 C97,230 107,230 112,236 L112,248 C97,256 87,256 72,248 Z"/>
