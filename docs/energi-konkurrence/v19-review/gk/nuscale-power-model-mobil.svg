<circle class="nr" cx="52" cy="322" r="8"/><text class="nrt" x="52" y="326">4</text>
<rect class="ik" x="72" y="324" width="32" height="22" rx="2"/><path class="ik" d="M78,324 v-6 h8 v6"/>
<text class="t" x="118" y="334">Doosan</text>
<text class="s" x="118" y="352">bygger dele</text>
<path class="l" d="M270,338 C328,338 328,158 270,158" marker-end="url(#cr-pil-m)"/>
<path class="g1" d="M270,44 C300,44 300,128 270,128" marker-end="url(#cr-pil-gm)"/>
<line x1="24" x2="54" y1="396" y2="396" class="g1"/>
