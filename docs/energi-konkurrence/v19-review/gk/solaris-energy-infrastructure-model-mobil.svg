<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener Solaris Energy Infrastructure penge på strøm og logistik</title>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:middle;font:500 12.5px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-m .leg{font:400 13px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:start}
.cr-model-m .legy{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:start}
</style>
<rect class="k" x="20" y="12" width="200" height="56" rx="10"/>
<circle class="nr" cx="40" cy="28" r="9"/><text class="nrt" x="40" y="32">1</text>
<text class="t" x="58" y="34">Leverandør</text>
<text class="s" x="58" y="52">sælger udstyr</text>
<path class="l" d="M120,68 V88" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="186" y="82">turbiner og udstyr</text>
<rect class="k" x="20" y="92" width="200" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="40" cy="108" r="9"/><text class="nrt" x="40" y="112">2</text>
<text class="t" x="58" y="114">Solaris</text>
<text class="s" x="58" y="132">lejer og bygger</text>
<path class="l" d="M120,148 V168" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="186" y="162">anlæg bag måleren</text>
<rect class="k" x="20" y="172" width="200" height="56" rx="10"/>
<circle class="nr" cx="40" cy="188" r="9"/><text class="nrt" x="40" y="192">3</text>
<text class="t" x="58" y="194">Datacentre</text>
<text class="s" x="58" y="212">får strømmen</text>
<rect class="k" x="20" y="252" width="200" height="56" rx="10"/>
<circle class="nr" cx="40" cy="268" r="9"/><text class="nrt" x="40" y="272">4</text>
<text class="t" x="58" y="274">Oliekunder</text>
<text class="s" x="58" y="292">får logistik</text>
<path class="l" d="M220,120 C300,160 300,260 220,280" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="255" y="241">logistik</text>
<path class="g2" d="M220,200 C262,186 262,130 220,120" marker-end="url(#cr-pil-gm)"/>
<path class="g1" d="M220,214 C285,200 285,116 220,112" marker-end="url(#cr-pil-gm)"/>
<path class="g1" d="M220,280 C328,300 328,96 220,108" marker-end="url(#cr-pil-gm)"/>
<text class="legy" x="20" y="340">Gule pile er betaling til Solaris.</text>
<text class="leg" x="20" y="360">Stiplet: løbende leje fra datacentre.</text>
<text class="leg" x="20" y="378">Fast streg tæt på kasserne: anlæg</text>
<text class="leg" x="20" y="396">og service fra datacentre.</text>
<text class="leg" x="20" y="414">Yderste faste bue: feltarbejde</text>
<text class="leg" x="20" y="432">fra oliekunder.</text>
</svg>
