<svg class="cr-model cr-model-d" viewBox="0 0 440 580" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener FuboTV penge på egne tilbud og på Hulu + Live TV</title>
<desc id="cr-model-d">1. Kunden betaler abonnement til FuboTV for Fubos egne tilbud. 2. Kunden betaler abonnement til Hulu for Hulu + Live TV, og den indtægt beholder Hulu. 3. Hulu betaler et løbende engrosgebyr til FuboTV. 4. Annoncører betaler for reklamer på begge tjenester. 5. FuboTV betaler tv-kanaler for indhold. De gule pile er FuboTVs indtægter: abonnement, engrosgebyr og reklamebetaling.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:middle;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="90" y="16" width="250" height="56" rx="10"/>
<circle class="nr" cx="104" cy="28" r="8"/>
<text class="nrt" x="104" y="32.5">1</text>
<text class="t" x="124" y="39">Kunder</text>
<text class="s" x="124" y="57">abonnerer</text>
<path class="l" d="M215,72 V114" marker-end="url(#cr-pil)"/>
<rect class="k" x="90" y="118" width="250" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="104" cy="130" r="8"/>
<text class="nrt" x="104" y="134.5">2</text>
<text class="t" x="124" y="141">FuboTV</text>
<text class="s" x="124" y="159">driver tjenesterne</text>
<path class="l" d="M215,174 V216" marker-end="url(#cr-pil)"/>
<rect class="k" x="90" y="220" width="250" height="56" rx="10"/>
<circle class="nr" cx="104" cy="232" r="8"/>
<text class="nrt" x="104" y="236.5">3</text>
<text class="t" x="124" y="243">Hulu</text>
<text class="s" x="124" y="261">sælger live tv</text>
<path class="l" d="M215,276 V318" marker-end="url(#cr-pil)"/>
<rect class="k" x="90" y="322" width="250" height="56" rx="10"/>
<circle class="nr" cx="104" cy="334" r="8"/>
<text class="nrt" x="104" y="338.5">4</text>
<text class="t" x="124" y="345">Annoncører</text>
<text class="s" x="124" y="363">køber reklamer</text>
<path class="l" d="M215,378 V420" marker-end="url(#cr-pil)"/>
<rect class="k" x="90" y="424" width="250" height="56" rx="10"/>
<circle class="nr" cx="104" cy="436" r="8"/>
<text class="nrt" x="104" y="440.5">5</text>
<text class="t" x="124" y="447">Tv-kanaler</text>
<text class="s" x="124" y="465">leverer tv</text>
<path class="g2" d="M340,44 C410,44 410,132 340,132" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M340,248 C424,248 424,148 340,148" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M340,350 C434,350 434,164 340,164" marker-end="url(#cr-pil-g)"/>
<line x1="90" x2="120" y1="502" y2="502" class="g2"/>
<text class="pg" x="130" y="506">abonnement</text>
<line x1="90" x2="120" y1="522" y2="522" class="g2"/>
<text class="pg" x="130" y="526">engrosgebyr</text>
<line x1="250" x2="280" y1="502" y2="502" class="g1"/>
<text class="pg" x="290" y="506">reklamebetaling</text>
<text class="pr" x="220" y="546">Hulu beholder abonnementet</text>
<text class="pr" x="220" y="564">på Hulu + Live TV</text>
</svg>
