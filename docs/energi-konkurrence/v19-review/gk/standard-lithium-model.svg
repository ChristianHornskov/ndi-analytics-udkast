<svg class="cr-model cr-model-d" viewBox="0 0 440 520" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan virker Standard Lithiums forretning</title>
<desc id="cr-model-d">1. Investorer tegner nye aktier og sender penge til Standard Lithium. 2. Selskabet lægger kapital i fællesprojekterne og driver et demonstrationsanlæg. 3. Equinor er medejer og partner. 4. Når produktionen kommer i gang, skal kunder betale for lithiumkarbonat. Milepælsbetalinger fra partneren er knyttet til en endelig investeringsbeslutning.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:start;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="107" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="119" cy="32" r="8"/><text class="nrt" x="119" y="36">1</text>
<text class="t" x="181" y="45">Investorer</text>
<text class="s" x="181" y="63">tegner nye aktier</text>
<path class="l" d="M147,76 V126" marker-end="url(#cr-pil)"/>
<rect class="k" x="107" y="130" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="119" cy="142" r="8"/><text class="nrt" x="119" y="146">2</text>
<text class="t" x="181" y="155">Selskabet</text>
<text class="s" x="181" y="173">udvikler projekter</text>
<path class="l" d="M147,186 V236" marker-end="url(#cr-pil)"/>
<text class="pr" x="165" y="216">kapitalindskud</text>
<rect class="k" x="107" y="240" width="226" height="56" rx="10"/>
<circle class="nr" cx="119" cy="252" r="8"/><text class="nrt" x="119" y="256">3</text>
<text class="t" x="181" y="265">Equinor</text>
<text class="s" x="181" y="283">medejer og partner</text>
<path class="ld" d="M147,296 V346" marker-end="url(#cr-pil)"/>
<rect class="k" x="107" y="350" width="226" height="56" rx="10"/>
<circle class="nr" cx="119" cy="362" r="8"/><text class="nrt" x="119" y="366">4</text>
<text class="t" x="181" y="375">Kunder</text>
<text class="s" x="181" y="393">kommende aftagere</text>
<path class="g1" d="M333,48 C385,48 385,158 333,158" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M333,378 C414,378 414,150 333,150" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M333,268 C377,268 377,158 333,158" marker-end="url(#cr-pil-g)"/>
<line x1="107" x2="137" y1="448" y2="448" class="g1"/>
<text class="pg" x="147" y="452">penge fra nye aktier</text>
<line x1="107" x2="137" y1="472" y2="472" class="g2"/>
<text class="pg" x="147" y="476">betaling for lithium</text>
<line x1="107" x2="137" y1="496" y2="496" class="g2"/>
<text class="pg" x="147" y="500">milepælsbetaling</text>
</svg>
