<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Taiyo Yuden penge på elektroniske komponenter</title>
<desc id="cr-model-d">1. En leverandør leverer råvarer til Taiyo Yuden. 2. Taiyo Yuden og datterselskaberne laver komponenter. 3. Egne salgsselskaber sælger en del af komponenterne videre. 4. Elektronikproducenter bygger komponenterne ind i udstyr. Taiyo Yuden sælger også direkte til producenterne. Producenterne betaler koncernen for hver levering.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
<radialGradient id="cr-glod" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#89aeb4" stop-opacity=".28"/><stop offset="1" stop-color="#89aeb4" stop-opacity="0"/></radialGradient>
</defs>
<style>
.cr-model-d .t{font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .s{font:400 13px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:middle}
.cr-model-d .p{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:middle}
.cr-model-d .pg{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:middle}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 2 til 4: direkte salg -->
<path class="l" d="M165,72 C165,20 385,20 385,72" marker-end="url(#cr-pil)"/>
<text class="p" x="275" y="28">salg direkte til producenter</text>
<!-- knuder -->
<circle cx="165" cy="102" r="58" fill="url(#cr-glod)"/>
<rect class="k" x="15" y="74" width="80" height="56" rx="10"/>
<rect class="k" x="125" y="74" width="80" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<rect class="k" x="235" y="74" width="80" height="56" rx="10"/>
<rect class="k" x="345" y="74" width="80" height="56" rx="10"/>
<!-- numre -->
<g><circle class="nr" cx="85" cy="82" r="8"/><text class="nrt" x="85" y="85.5">1</text></g>
<g><circle class="nr" cx="195" cy="82" r="8"/><text class="nrt" x="195" y="85.5">2</text></g>
<g><circle class="nr" cx="305" cy="82" r="8"/><text class="nrt" x="305" y="85.5">3</text></g>
<g><circle class="nr" cx="415" cy="82" r="8"/><text class="nrt" x="415" y="85.5">4</text></g>
<!-- ikoner -->
<rect class="ik" x="42" y="90" width="26" height="22" rx="3"/><path class="ik" d="M42,98h26M55,90v8"/>
<rect class="ik" x="153" y="88" width="24" height="24" rx="4"/><path class="ik" d="M159,100 L163,95 L167,104 L171,98"/>
<path class="ik" d="M158,84v4M165,84v4M172,84v4M158,112v4M165,112v4M172,112v4M149,95h4M149,105h4M177,95h4M177,105h4"/>
<path class="ik" d="M261,98 L265,90 H285 L289,98 Z M264,98 V114 H286 V98 M270,114 V105 H280 V114"/>
<path class="ik" d="M368,116 V100 L380,106 V100 L392,106 V92 H400 V116 Z"/>
<!-- varestrøm -->
<path class="l" d="M97,102 H122" marker-end="url(#cr-pil)"/>
<path class="l" d="M207,102 H232" marker-end="url(#cr-pil)"/>
<path class="l" d="M317,102 H342" marker-end="url(#cr-pil)"/>
<!-- navne -->
<text class="t" x="55" y="152">Leverandør</text><text class="s" x="55" y="169">leverer råvarer</text>
<text class="t" x="165" y="152">Taiyo Yuden</text><text class="s" x="165" y="169">laver</text><text class="s" x="165" y="184">komponenter</text>
<text class="t" x="275" y="152">Salgsselskab</text><text class="s" x="275" y="169">sælger videre</text>
<text class="t" x="385" y="152">Producent</text><text class="s" x="385" y="169">bygger udstyr</text>
<!-- betaling til Taiyo Yuden -->
<path class="g1" d="M385,190 C385,276 172,276 160,198" marker-end="url(#cr-pil-g)"/>
<text class="pg" x="292" y="292">betaling for hver levering</text>
</svg>
