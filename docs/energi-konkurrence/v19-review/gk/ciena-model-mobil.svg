<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg"><title id="cr-model-m-t">Sådan tjener Ciena penge</title><defs>
<marker id="cr-pil-cien-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g-cien-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs><style>.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .p{text-anchor:middle;font:500 12px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 12px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8;stroke-linecap:round}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:4 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-m .leg{fill:#0d1921;stroke:#3a4658;stroke-width:1}</style>
<!-- goods arrows between stacked boxes -->
<path class="l" d="M100,76 V106" marker-end="url(#cr-pil-cien-m)"/>
<path class="l" d="M100,162 V192" marker-end="url(#cr-pil-cien-m)"/>
<path class="l" d="M100,248 V278" marker-end="url(#cr-pil-cien-m)"/>
<!-- yellow payments from Cloud (3) and Tele (4) back to Ciena (2), right side -->
<path class="g1" d="M286,214 C318,214 318,150 286,150" marker-end="url(#cr-pil-g-cien-m)"/>
<path class="g2" d="M286,228 C330,228 330,120 286,120" marker-end="url(#cr-pil-g-cien-m)"/>
<path class="g1" d="M286,298 C318,298 318,136 286,136" marker-end="url(#cr-pil-g-cien-m)"/>
<path class="g2" d="M286,314 C340,314 340,108 286,108" marker-end="url(#cr-pil-g-cien-m)"/>
<!-- boxes -->
<rect class="k" x="60" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="34" r="9"/>
<text class="nrt" x="74" y="38">1</text>
<text class="t" x="134" y="44">Fabrikker</text>
<text class="s" x="134" y="62">laver udstyr</text>
<rect class="k" x="60" y="106" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="74" cy="120" r="9"/>
<text class="nrt" x="74" y="124">2</text>
<text class="t" x="134" y="130">Ciena</text>
<text class="s" x="134" y="148">sælger netudstyr</text>
<rect class="k" x="60" y="192" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="206" r="9"/>
<text class="nrt" x="74" y="210">3</text>
<text class="t" x="134" y="216">Cloud</text>
<text class="s" x="134" y="234">store datacentre</text>
<rect class="k" x="60" y="278" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="292" r="9"/>
<text class="nrt" x="74" y="296">4</text>
<text class="t" x="134" y="302">Tele</text>
<text class="s" x="134" y="320">driver telenet</text>
<!-- goods labels in the gaps, not on the arrows -->
<text class="p" x="200" y="96">udstyr efter design</text>
<text class="p" x="200" y="182">udstyr til datacentre</text>
<text class="p" x="200" y="268">udstyr og tjenester</text>
<!-- legend box under the drawing -->
<rect class="leg" x="20" y="360" width="300" height="120" rx="8"/>
<line x1="36" x2="66" y1="386" y2="386" class="g1"/>
<text class="pg" x="76" y="390">betaling for udstyr</text>
<line x1="36" x2="66" y1="414" y2="414" class="g2"/>
<text class="pg" x="76" y="418">løbende betaling</text>
<text class="pg" x="36" y="448">de gule pile går fra kunderne</text>
<text class="pg" x="36" y="466">til Ciena</text>
</svg>