<svg class="cr-model cr-model-m" viewBox="0 0 340 520" role="img" aria-labelledby="cr-model-m-t cr-model-m-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener Dell penge på computere, servere og finansiering</title>
<desc id="cr-model-m-d">1. Virksomheder og privatpersoner køber computere og tilbehør hos Dell eller hos en forhandler. 2. Virksomheder køber også servere, netværk og lager, herunder servere bygget til kunstig intelligens. 3. Dell leverer maskinerne og den tilhørende service og support. 4. Dell Financial Services tilbyder leasing, lån og løbende betaling, så nogle kunder betaler over tid. 5. Forhandlere sælger Dells produkter videre til deres egne kunder. De gule pile viser, at både slutkunder og forhandlere betaler Dell for varer og service, og at nogle betalinger løber over tid via finansieringsselskabet.</desc>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:start;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .pre{text-anchor:end;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .prm{text-anchor:middle;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="60" y="16" width="226" height="56" rx="10"/>
<circle class="nr" cx="72" cy="28" r="8"/>
<text class="nrt" x="72" y="32">1</text>
<text class="t" x="134" y="41">Forhandler</text>
<text class="s" x="134" y="59">sælger videre</text>
<path class="l" d="M173,120 V76" marker-end="url(#cr-pil-m)"/>
<text class="pre" x="164" y="100">produkter</text>
<rect class="k" x="60" y="120" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="72" cy="132" r="8"/>
<text class="nrt" x="72" y="136">2</text>
<text class="t" x="134" y="145">Dell</text>
<text class="s" x="134" y="163">sælger udstyr</text>
<path class="l" d="M90,176 V272" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="100" y="210">computere</text>
<path class="l" d="M236,176 V272" marker-end="url(#cr-pil-m)"/>
<text class="pre" x="226" y="244">servere og lager</text>
<rect class="k" x="60" y="276" width="226" height="56" rx="10"/>
<circle class="nr" cx="72" cy="288" r="8"/>
<text class="nrt" x="72" y="292">3</text>
<text class="t" x="134" y="301">Kunder</text>
<text class="s" x="134" y="319">køber udstyr</text>
<path class="l" d="M190,384 V336" marker-end="url(#cr-pil-m)"/>
<text class="pre" x="178" y="362">leasing og lån</text>
<rect class="k" x="60" y="384" width="226" height="56" rx="10"/>
<circle class="nr" cx="72" cy="396" r="8"/>
<text class="nrt" x="72" y="400">4</text>
<text class="t" x="134" y="409">Finansiering</text>
<text class="s" x="134" y="427">leasing og lån</text>
<path class="ld" d="M60,44 H16 V304 H60" marker-end="url(#cr-pil-m)"/>
<text class="prm" transform="translate(36,226) rotate(-90)">videresalg</text>
<path class="g1" d="M286,44 C312,44 312,136 286,136" marker-end="url(#cr-pil-gm)"/>
<path class="g1" d="M286,304 C326,304 326,156 286,156" marker-end="url(#cr-pil-gm)"/>
<path class="g2" d="M286,304 C308,304 308,412 286,412" marker-end="url(#cr-pil-gm)"/>
<line x1="24" x2="54" y1="450" y2="450" class="g1"/>
<text class="pg" x="64" y="454">fra forhandlere</text>
<line x1="24" x2="54" y1="472" y2="472" class="g1"/>
<text class="pg" x="64" y="476">betaling fra kunder</text>
<line x1="24" x2="54" y1="494" y2="494" class="g2"/>
<text class="pg" x="64" y="498">betaling over tid</text>
</svg>
