<svg class="cr-model cr-model-d" viewBox="0 0 340 460" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan virker Sigma Lithiums forretning</title>
<desc id="cr-model-d">1. Minen Grota do Cirilo leverer malm til selskabets eget anlæg. 2. Anlægget udskiller lithiumoxidkoncentrat og et restmateriale. 3. Koncentratet sendes til kunder i kæden for batterimaterialer. 4. Restmaterialet kan sælges til andre aftagere. 5. Kunderne betaler for koncentratet og, når selskabet selv står for fragten, også for den tjeneste.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .s{font:400 13px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:middle}
.cr-model-d .p{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:start}
.cr-model-d .pc{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:middle}
.cr-model-d .pg{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:start}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="110" y="12" width="170" height="58" rx="10"/>
<circle class="nr" cx="124" cy="28" r="8"/><text class="nrt" x="124" y="32">1</text>
<text class="t" x="195" y="36">Mine</text>
<text class="s" x="195" y="54">leverer malm</text>
<path class="l" d="M195,70 V100" marker-end="url(#cr-pil)"/>
<text class="pc" x="230" y="90">malm</text>
<rect class="k" x="110" y="104" width="170" height="58" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="124" cy="120" r="8"/><text class="nrt" x="124" y="124">2</text>
<text class="t" x="195" y="128">Anlæg</text>
<text class="s" x="195" y="146">udskiller koncentrat</text>
<path class="l" d="M195,162 V194" marker-end="url(#cr-pil)"/>
<text class="pc" x="238" y="184">koncentrat</text>
<rect class="k" x="110" y="198" width="170" height="58" rx="10"/>
<circle class="nr" cx="124" cy="214" r="8"/><text class="nrt" x="124" y="218">3</text>
<text class="t" x="195" y="222">Kunder</text>
<text class="s" x="195" y="240">køber koncentrat</text>
<path class="l" d="M110,133 C22,133 22,321 110,321" marker-end="url(#cr-pil)"/>
<text class="p" x="48" y="224" style="font-size:12px">rest-</text>
<text class="p" x="48" y="238" style="font-size:12px">materiale</text>
<rect class="k" x="110" y="292" width="170" height="58" rx="10"/>
<circle class="nr" cx="124" cy="308" r="8"/><text class="nrt" x="124" y="312">4</text>
<text class="t" x="195" y="316">Restaftagere</text>
<text class="s" x="195" y="334">køber restmateriale</text>
<path class="g1" d="M280,227 C328,227 328,133 280,133" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M280,247 C336,247 336,148 280,148" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M280,321 C334,362 334,155 280,155" marker-end="url(#cr-pil-g)"/>
<line x1="20" x2="48" y1="390" y2="390" class="g1"/>
<text class="pg" x="56" y="394">betaling for koncentrat</text>
<line x1="20" x2="48" y1="414" y2="414" class="g1"/>
<text class="pg" x="56" y="418">betaling for fragt</text>
<line x1="20" x2="48" y1="438" y2="438" class="g1"/>
<text class="pg" x="56" y="442">betaling for restmateriale</text>
</svg>
