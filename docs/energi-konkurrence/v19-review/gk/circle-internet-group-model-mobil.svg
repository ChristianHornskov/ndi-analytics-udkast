<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan udsteder Circle USDC og EURC</title>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .p{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="60" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="72" cy="32" r="8"/><text class="nrt" x="72" y="36">1</text>
<circle class="ik" cx="100" cy="40" r="7"/><path class="ik" d="M86,64 C86,54 114,54 114,64"/>
<text class="t" x="134" y="45">Kunde</text><text class="s" x="134" y="63">får mønten</text>
<path class="l" d="M100,78 V126" marker-end="url(#cr-pil-m)"/>
<rect class="k" x="60" y="130" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="72" cy="142" r="8"/><text class="nrt" x="72" y="146">2</text>
<circle class="ik" cx="100" cy="158" r="12"/><circle class="ik" cx="100" cy="158" r="6"/>
<text class="t" x="134" y="155">Circle</text><text class="s" x="134" y="173">udsteder mønten</text>
<path class="l" d="M100,188 V236" marker-end="url(#cr-pil-m)"/>
<rect class="k" x="60" y="240" width="226" height="56" rx="10"/>
<circle class="nr" cx="72" cy="252" r="8"/><text class="nrt" x="72" y="256">3</text>
<rect class="ik" x="88" y="248" width="24" height="22" rx="3"/><path class="ik" d="M94,248 V244 a6,6 0 0 1 12,0 V248"/>
<text class="t" x="134" y="265">Reserve</text><text class="s" x="134" y="283">holdes 1 til 1</text>
<rect class="k" x="60" y="350" width="226" height="56" rx="10"/>
<circle class="nr" cx="72" cy="362" r="8"/><text class="nrt" x="72" y="366">4</text>
<circle class="ik" cx="94" cy="370" r="5"/><circle class="ik" cx="114" cy="370" r="5"/><circle class="ik" cx="104" cy="384" r="5"/>
<path class="ik" d="M94,370 L114,370 M94,370 L104,384 M114,370 L104,384"/>
<text class="t" x="134" y="375">Distributør</text><text class="s" x="134" y="393">udbreder mønten</text>
<path class="g1" d="M290,262 C318,262 318,164 290,164" marker-end="url(#cr-pil-gm)"/>
<path class="g2" d="M290,48 C318,48 318,164 290,164" marker-end="url(#cr-pil-gm)"/>
<path class="l" d="M290,164 C334,164 334,378 290,378" marker-end="url(#cr-pil-m)"/>
<line x1="24" x2="54" y1="432" y2="432" class="g1"/>
<text class="pg" x="64" y="436">renter og udbytte, fra reserven</text>
<line x1="24" x2="54" y1="456" y2="456" class="g2"/>
<text class="pg" x="64" y="460">gebyr for tjenester, fra kunden</text>
<line x1="24" x2="54" y1="480" y2="480" class="l"/>
<text class="p" x="64" y="484">andel af indkomst, til distributør</text>
