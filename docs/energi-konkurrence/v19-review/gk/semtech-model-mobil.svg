<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t-smtc" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t-smtc">Sådan tjener Semtech penge</title>
<defs>
<marker id="cr-pil-m-smtc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm-smtc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:middle;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Fabrikker -->
<rect class="k" x="40" y="16" width="226" height="56" rx="10"/>
<circle class="nr" cx="52" cy="28" r="9"/><text class="nrt" x="52" y="31.5">1</text>
<path class="ik" d="M72,56 V40 L80,34 L86,40 L92,34 L98,40 V56 Z"/>
<text class="t" x="114" y="40">Fabrikker</text>
<text class="s" x="114" y="58">laver chipbene</text>
<path class="l" d="M80,74 V102" marker-end="url(#cr-pil-m-smtc)"/>
<text class="pr" x="108" y="92">chips</text>
<!-- 2 Semtech -->
<rect class="k" x="40" y="106" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="52" cy="118" r="9"/><text class="nrt" x="52" y="121.5">2</text>
<rect class="ik" x="66" y="118" width="30" height="22" rx="3"/><path class="ik" d="M72,126 h8 M72,132 h18 M80,126 h8"/>
<text class="t" x="114" y="130">Semtech</text>
<text class="s" x="114" y="148">sælger chips</text>
<path class="l" d="M80,164 V192" marker-end="url(#cr-pil-m-smtc)"/>
<text class="pr" x="108" y="182">varer</text>
<!-- 3 Distributører -->
<rect class="k" x="40" y="196" width="226" height="56" rx="10"/>
<circle class="nr" cx="52" cy="208" r="9"/><text class="nrt" x="52" y="211.5">3</text>
<rect class="ik" x="66" y="210" width="26" height="20" rx="2"/><path class="ik" d="M70,218 h18 M70,224 h12"/>
<text class="t" x="114" y="220">Distributører</text>
<text class="s" x="114" y="238">videresælger</text>
<path class="l" d="M80,254 V282" marker-end="url(#cr-pil-m-smtc)"/>
<text class="pr" x="108" y="272">varer</text>
<!-- 4 Kunder -->
<rect class="k" x="40" y="286" width="226" height="56" rx="10"/>
<circle class="nr" cx="52" cy="298" r="9"/><text class="nrt" x="52" y="301.5">4</text>
<path class="ik" d="M66,334 V310 H102 V334 Z M72,316 h6 v5 h-6 z M82,316 h6 v5 h-6 z M76,326 h10 v8 h-10 z"/>
<text class="t" x="114" y="310">Kunder</text>
<text class="s" x="114" y="328">producenter</text>
<!-- gule betalinger til højre, uden tekst på buerne -->
<path class="g1" d="M270,224 C304,224 304,140 270,140" marker-end="url(#cr-pil-gm-smtc)"/>
<path class="g2" d="M270,314 C326,314 326,128 270,128" marker-end="url(#cr-pil-gm-smtc)"/>
<line x1="24" x2="54" y1="380" y2="380" class="g1"/>
<text class="pg" x="64" y="384">betaling for varer</text>
<line x1="24" x2="54" y1="408" y2="408" class="g2"/>
<text class="pg" x="64" y="412">abonnement eller forbrug</text>
</svg>
