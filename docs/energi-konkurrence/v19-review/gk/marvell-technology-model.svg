<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan virker Marvells forretning</title>
<desc id="cr-model-d">1. Cloudselskaber, datacentre og producenter af netudstyr bestiller chips. 2. Marvell designer chippene og lægger ordrer hos uafhængige fabrikker. 3. Fabrikkerne fremstiller chippene og leverer dem til Marvell. 4. En del af chippene går direkte til kunder, og en del går via distributører. 5. De gule pile er betalinger: kunder og distributører betaler Marvell for chippene, og Marvell betaler fabrikkerne for produktionen.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{font:600 15px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:start}
.cr-model-d .s{font:400 12px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:start}
.cr-model-d .p{font:500 12px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:start}
.cr-model-d .pg{font:600 12px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:start}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Kunder -->
<rect class="k" x="16" y="16" width="192" height="72" rx="10"/>
<circle class="nr" cx="32" cy="32" r="9"/>
<text class="nrt" x="32" y="36">1</text>
<g class="ik" transform="translate(50,28)">
  <circle cx="8" cy="7" r="5"/>
  <path d="M0,22 C0,14 16,14 16,22"/>
  <circle cx="24" cy="8" r="4"/>
  <path d="M17,22 C17,15 31,15 31,22"/>
</g>
<text class="t" x="88" y="48">Kunder</text>
<text class="s" x="88" y="68">bestiller chips</text>
<!-- 3 Fabrikker -->
<rect class="k" x="232" y="16" width="192" height="72" rx="10"/>
<circle class="nr" cx="248" cy="32" r="9"/>
<text class="nrt" x="248" y="36">3</text>
<g class="ik" transform="translate(266,28)">
  <path d="M2,22 V12 L8,6 L14,12 V22"/>
  <path d="M14,22 V10 L20,4 L26,10 V22"/>
  <path d="M8,6 L8,2 H12 L12,8"/>
  <rect x="6" y="14" width="4" height="4"/>
  <rect x="18" y="14" width="4" height="4"/>
</g>
<text class="t" x="304" y="48">Fabrikker</text>
<text class="s" x="304" y="68">fremstiller chips</text>
<!-- 2 Marvell, gul ramme -->
<rect class="k" x="124" y="116" width="192" height="72" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="140" cy="132" r="9"/>
<text class="nrt" x="140" y="136">2</text>
<g class="ik" transform="translate(158,128)">
  <rect x="4" y="4" width="20" height="20" rx="2"/>
  <path d="M8,4 V0 M16,4 V0 M24,4 V0 M8,24 V28 M16,24 V28 M24,24 V28 M4,8 H0 M4,16 H0 M4,20 H0 M24,8 H28 M24,16 H28 M24,20 H28"/>
  <path d="M10,10 H18 M10,14 H18 M10,18 H16"/>
</g>
<text class="t" x="196" y="148">Marvell</text>
<text class="s" x="196" y="168">designer chips</text>
<!-- 4 Distributører -->
<rect class="k" x="124" y="204" width="192" height="52" rx="10"/>
<circle class="nr" cx="140" cy="220" r="9"/>
<text class="nrt" x="140" y="224">4</text>
<g class="ik" transform="translate(158,214)">
  <path d="M2,18 L8,8 H22 L28,18 Z"/>
  <path d="M8,8 V4 H22 V8"/>
</g>
<text class="t" x="196" y="226">Distributører</text>
<text class="s" x="196" y="244">videresælger chips</text>
<!-- blå: chips fra fabrikker til Marvell, videre direkte til kunder og via distributører -->
<path class="l" d="M328,88 C328,102 280,102 280,116" marker-end="url(#cr-pil)"/>
<path class="l" d="M160,116 C160,102 100,102 100,88" marker-end="url(#cr-pil)"/>
<path class="l" d="M200,188 V204" marker-end="url(#cr-pil)"/>
<path class="l" d="M124,230 H28 V88" marker-end="url(#cr-pil)"/>
<!-- gule: betaling fra kunder og distributører til Marvell, og fra Marvell til fabrikker -->
<path class="g1" d="M180,88 C180,102 200,102 200,116" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M300,204 V188" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M300,116 C300,102 260,102 260,88" marker-end="url(#cr-pil-g)"/>
<!-- forklaring under tegningen, ikke på pilene -->
<line x1="16" x2="40" y1="272" y2="272" class="l"/>
<text class="p" x="48" y="276">leverer chips, fra fabrikkerne</text>
<line x1="16" x2="40" y1="290" y2="290" class="g1"/>
<text class="pg" x="48" y="294">betaling for chips, til Marvell og fabrikkerne</text>
</svg>
