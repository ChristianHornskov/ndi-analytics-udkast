<svg class="cr-model cr-model-m" viewBox="0 0 340 462" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg"><title id="cr-model-m-t">Sådan tjener Omada Health penge på virtuel pleje og måleudstyr</title><defs><marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker><marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker></defs><style>.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}.cr-model-m .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}.cr-model-m .pr{text-anchor:middle;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}.cr-model-m .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}.cr-model-m .pgm{text-anchor:middle;font:600 12.5px "DM Sans",sans-serif;fill:#e8d98a}</style>
<rect class="k" x="20" y="8" width="300" height="52" rx="10"/><circle class="nr" cx="34" cy="22" r="8"/><text class="nrt" x="34" y="25.5">1</text><text class="t" x="60" y="30">Medlemmer</text><text class="s" x="60" y="48">bruger programmet, betaler som regel ikke</text>
