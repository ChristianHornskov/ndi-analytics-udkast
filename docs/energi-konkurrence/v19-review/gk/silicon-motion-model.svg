<svg class="cr-model cr-model-d" viewBox="0 0 440 490" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Silicon Motion penge på controllere og færdige lagerenheder</title>
<desc id="cr-model-d">1. Fabrikkerne støber chippenes siliciumskiver efter Silicon Motions tegninger. 2. Silicon Motion designer controllerne og samler også færdige lagerenheder, hvor selskabet selv køber NAND-lager. 3. Kunderne betaler for controllerne og for de færdige lagerenheder. 4. Produkterne ender i computere, telefoner, datacentre og andet udstyr. De gule pile er Silicon Motions indtægter: betaling for controllere og betaling for færdige lagerenheder.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px 'DM Sans',sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:start;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .prm{text-anchor:middle;font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px 'DM Sans',sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="110" y="16" width="250" height="56" rx="10"/>
<circle class="nr" cx="124" cy="28" r="8"/>
<text class="nrt" x="124" y="32.5">1</text>
<text class="t" x="148" y="39">Fabrikker</text>
<text class="s" x="148" y="57">støber siliciumskiver</text>
<path class="l" d="M235,72 V112" marker-end="url(#cr-pil)"/>
<text class="pr" x="247" y="98">siliciumskiver</text>
<rect class="k" x="110" y="116" width="250" height="74" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="124" cy="128" r="8"/>
<text class="nrt" x="124" y="132.5">2</text>
<text class="t" x="148" y="141">SIMO</text>
<text class="s" x="148" y="159">designer controllere</text>
<text class="s" x="148" y="177">køber NAND-lager</text>
<text class="prm" x="175" y="210">controllere</text>
<path class="l" d="M175,226 V260" marker-end="url(#cr-pil)"/>
<text class="prm" x="295" y="202">færdige</text>
<text class="prm" x="295" y="218">lagerenheder</text>
<path class="l" d="M295,230 V260" marker-end="url(#cr-pil)"/>
<rect class="k" x="110" y="268" width="250" height="56" rx="10"/>
<circle class="nr" cx="124" cy="280" r="8"/>
<text class="nrt" x="124" y="284.5">3</text>
<text class="t" x="148" y="291">Kunder</text>
<text class="s" x="148" y="309">producenter og samlere</text>
<path class="l" d="M235,324 V360" marker-end="url(#cr-pil)"/>
<text class="pr" x="247" y="348">til udstyret</text>
<rect class="k" x="110" y="368" width="250" height="56" rx="10"/>
<circle class="nr" cx="124" cy="380" r="8"/>
<text class="nrt" x="124" y="384.5">4</text>
<text class="t" x="148" y="391">Enheder</text>
<text class="s" x="148" y="409">computere og telefoner</text>
<path class="g1" d="M360,284 C412,284 412,148 360,148" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M360,308 C434,308 434,168 360,168" marker-end="url(#cr-pil-g)"/>
<line x1="110" x2="140" y1="448" y2="448" class="g1"/>
<text class="pg" x="152" y="452">betaling for controllere</text>
<line x1="110" x2="140" y1="470" y2="470" class="g1"/>
<text class="pg" x="152" y="474">betaling for lagerenheder</text>
</svg>
