<svg class="cr-model cr-model-d" viewBox="0 0 440 500" role="img" aria-labelledby="cr-hrz-t cr-hrz-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-hrz-t">Sådan tjener Horizon Robotics penge</title>
<desc id="cr-hrz-d">1. Horizon Robotics udvikler Journey-processorer, algoritmer og software. 2. En stor del af hardwaren går ud gennem partnere, som bygger løsningerne ind hos bilproducenterne. 3. Bilproducenter og underleverandører betaler for færdige produktløsninger. 4. De samme kunder betaler også for licenser og for hjælp til at bygge det ind i bilerne. 5. Producenter af robotter og andre apparater betaler for processorer og udviklersæt. De gule pile viser betaling fra bilkunder og apparatkunder til Horizon Robotics.</desc>
<defs>
<marker id="cr-hrz-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-hrz-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:middle;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Horizon -->
<rect class="k" x="148" y="20" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="164" cy="32" r="8"/><text class="nrt" x="164" y="36">1</text>
<text class="t" x="180" y="44">Horizon</text>
<text class="s" x="180" y="62">processor og software</text>
<path class="l" d="M261,76 V126" marker-end="url(#cr-hrz-pil)"/>
<text class="pr" x="214" y="107">hardware</text>
<!-- 4 Apparater (venstre) -->
<rect class="k" x="8" y="140" width="128" height="56" rx="10"/>
<circle class="nr" cx="22" cy="152" r="8"/><text class="nrt" x="22" y="156">4</text>
<text class="t" x="34" y="164">Apparater</text>
<text class="s" x="34" y="182">udviklersæt</text>
<path class="l" d="M148,48 H80 V140" marker-end="url(#cr-hrz-pil)"/>
<text class="pr" x="123" y="100">processorer</text>
<!-- 2 Partnere -->
<rect class="k" x="148" y="140" width="226" height="56" rx="10"/>
<circle class="nr" cx="164" cy="152" r="8"/><text class="nrt" x="164" y="156">2</text>
<text class="t" x="180" y="164">Partnere</text>
<text class="s" x="180" y="182">bygger løsningen ind</text>
<path class="l" d="M261,196 V246" marker-end="url(#cr-hrz-pil)"/>
<text class="pr" x="200" y="227">løsninger</text>
<!-- 3 Bilkunder -->
<rect class="k" x="148" y="260" width="226" height="56" rx="10"/>
<circle class="nr" cx="164" cy="272" r="8"/><text class="nrt" x="164" y="276">3</text>
<text class="t" x="180" y="284">Bilkunder</text>
<text class="s" x="180" y="302">køber løsninger</text>
<!-- Gule betalingspile uden tekst på pilene -->
<path class="g1" d="M374,276 C424,276 424,60 374,48" marker-end="url(#cr-hrz-pil-g)"/>
<path class="g1" d="M72,140 C72,70 130,70 148,48" marker-end="url(#cr-hrz-pil-g)"/>
<line x1="20" x2="50" y1="360" y2="360" class="g1"/>
<text class="pg" x="60" y="364">betaling fra bilkunder</text>
<line x1="20" x2="50" y1="388" y2="388" class="g1"/>
<text class="pg" x="60" y="392">betaling fra apparater</text>
</svg>
