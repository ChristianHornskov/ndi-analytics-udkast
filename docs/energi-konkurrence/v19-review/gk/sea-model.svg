<svg class="cr-model cr-model-d" viewBox="0 0 440 540" role="img" aria-labelledby="cr-model-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener Sea penge på Shopee, Monee og Garena</title>
<desc>Sælgere udbyder varer på Shopee. Brugere handler, låner hos Monee og spiller hos Garena. De gule pile er indtægterne: gebyrer og annoncer, betaling for egne varer, renter og gebyrer, og køb i spillet.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ky{fill:#0d1921;stroke:#e8d98a;stroke-width:1.6}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>

<rect class="k" x="48" y="16" width="270" height="56" rx="10"/>
<circle class="nr" cx="62" cy="30" r="8"/>
<text class="nrt" x="62" y="34">1</text>
<text class="t" x="80" y="40">Sælgere</text>
<text class="s" x="80" y="58">udbyder varer</text>
<path class="l" d="M175,72 V96" marker-end="url(#cr-pil)"/>
<text class="pr" x="188" y="88">varer til salg</text>

<rect class="ky" x="48" y="100" width="270" height="56" rx="10"/>
<circle class="nr" cx="62" cy="114" r="8"/>
<text class="nrt" x="62" y="118">2</text>
<text class="t" x="80" y="124">Shopee</text>
<text class="s" x="80" y="142">handelsplatform</text>
<path class="l" d="M175,156 V180" marker-end="url(#cr-pil)"/>
<text class="pr" x="188" y="172">varer og fragt</text>

<rect class="k" x="48" y="184" width="270" height="56" rx="10"/>
<circle class="nr" cx="62" cy="198" r="8"/>
<text class="nrt" x="62" y="202">3</text>
<text class="t" x="80" y="208">Brugere</text>
<text class="s" x="80" y="226">køber, låner, spiller</text>
<path class="l" d="M175,268 V244" marker-end="url(#cr-pil)"/>
<text class="pr" x="188" y="256">lån til brugere</text>

<rect class="ky" x="48" y="268" width="270" height="56" rx="10"/>
<circle class="nr" cx="62" cy="282" r="8"/>
<text class="nrt" x="62" y="286">4</text>
<text class="t" x="80" y="292">Monee</text>
<text class="s" x="80" y="310">kredit og betaling</text>

<rect class="ky" x="48" y="352" width="270" height="56" rx="10"/>
<circle class="nr" cx="62" cy="366" r="8"/>
<text class="nrt" x="62" y="370">5</text>
<text class="t" x="80" y="376">Garena</text>
<text class="s" x="80" y="394">onlinespil</text>
<path class="l" d="M318,380 C360,380 360,212 318,212" marker-end="url(#cr-pil)"/>

<path class="g1" d="M318,44 C376,44 376,128 318,128" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M318,212 C392,212 392,128 318,128" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M318,212 C400,212 400,296 318,296" marker-end="url(#cr-pil-g)"/>
<path class="g1" d="M318,212 C428,212 428,380 318,380" marker-end="url(#cr-pil-g)"/>

<line x1="48" x2="78" y1="440" y2="440" class="g1"/>
<text class="pg" x="86" y="444">gebyrer og annoncer, fra sælgere</text>
<line x1="48" x2="78" y1="460" y2="460" class="g1"/>
<text class="pg" x="86" y="464">betaling for egne varer, fra brugere</text>
<line x1="48" x2="78" y1="480" y2="480" class="g2"/>
<text class="pg" x="86" y="484">renter og gebyrer, fra låntagere</text>
<line x1="48" x2="78" y1="500" y2="500" class="g1"/>
<text class="pg" x="86" y="504">køb i spillet, fra spillere</text>
<line x1="48" x2="78" y1="520" y2="520" class="l"/>
<text class="pr" x="86" y="524">adgang til spil, fra Garena</text>
</svg>
