<svg class="cr-model cr-model-d" viewBox="0 0 440 500" role="img" aria-labelledby="cr-model-t cr-model-d-desc" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener NuScale Power penge i dag, mens de første dele bliver fremstillet</title>
<desc id="cr-model-d-desc">1. Kunder som RoPower køber ingeniør-, design- og licensarbejde. 2. NuScale udvikler og licenserer den modulære reaktor og sælger endnu ikke færdige enheder. 3. ENTRA1 er eksklusiv partner for salg og udvikling af anlæg. 4. Doosan fremstiller centrale dele til det første modul. Den gule pil er betalingen til NuScale for arbejde og licens. Den blå bue er delene til det første modul.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pr{text-anchor:middle;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .p{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="80" y="16" width="226" height="56" rx="10"/>
<circle class="nr" cx="92" cy="28" r="8"/><text class="nrt" x="92" y="32">1</text>
<circle class="ik" cx="124" cy="36" r="7"/><path class="ik" d="M110,60 C110,50 138,50 138,60"/>
<text class="t" x="158" y="40">Kunder</text>
<text class="s" x="158" y="58">køber arbejde</text>
<path class="l" d="M120,74 V110" marker-end="url(#cr-pil)"/>
<text class="pr" x="226" y="96">arbejde og licens</text>
<rect class="k" x="80" y="114" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="92" cy="126" r="8"/><text class="nrt" x="92" y="130">2</text>
<rect class="ik" x="112" y="128" width="24" height="24" rx="12"/><path class="ik" d="M124,132 v16 M116,140 h16"/>
<text class="t" x="158" y="138">NuScale</text>
<text class="s" x="158" y="156">udvikler reaktoren</text>
<path class="l" d="M120,172 V208" marker-end="url(#cr-pil)"/>
<text class="pr" x="226" y="194">eksklusivt partnerskab</text>
<rect class="k" x="80" y="212" width="226" height="56" rx="10"/>
<circle class="nr" cx="92" cy="224" r="8"/><text class="nrt" x="92" y="228">3</text>
<path class="ik" d="M112,236 C117,230 127,230 132,236 C137,230 147,230 152,236 L152,248 C137,256 127,256 112,248 Z"/>
<text class="t" x="158" y="236">ENTRA1</text>
<text class="s" x="158" y="254">partner</text>
<rect class="k" x="80" y="310" width="226" height="56" rx="10"/>
<circle class="nr" cx="92" cy="322" r="8"/><text class="nrt" x="92" y="326">4</text>
<rect class="ik" x="112" y="324" width="32" height="22" rx="2"/><path class="ik" d="M118,324 v-6 h8 v6"/>
<text class="t" x="158" y="334">Doosan</text>
<text class="s" x="158" y="352">bygger dele</text>
<path class="l" d="M316,338 C400,338 400,158 316,158" marker-end="url(#cr-pil)"/>
<path class="g1" d="M316,44 C350,44 350,128 316,128" marker-end="url(#cr-pil-g)"/>
<line x1="80" x2="110" y1="396" y2="396" class="g1"/>
<text class="pg" x="120" y="400">betaling for arbejde, fra kunderne</text>
<line x1="80" x2="110" y1="420" y2="420" class="l"/>
<text class="p" x="120" y="424">dele til første modul</text>
</svg>
