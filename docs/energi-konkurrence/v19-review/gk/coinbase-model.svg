<svg class="cr-model cr-model-d" viewBox="0 0 440 500" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan flyder handel, USDC og betaling hos Coinbase</title>
<desc id="cr-model-d">1. Forbrugere og institutioner handler og opbevarer aktiver på Coinbases platform. 2. Udviklere bruger selskabets værktøjer og netværk til at bygge egne produkter. 3. Udstederen af USDC betaler Coinbase efter, hvor meget USDC der er i omløb. 4. Abonnenter betaler løbende for Coinbase One, og kunder betaler kommission ved staking. De gule pile viser gebyrer, abonnement og andre betalinger ind til Coinbase.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .p{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-linecap:round}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- 1 Kunder -->
<rect class="k" x="107" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="119" cy="32" r="8"/><text class="nrt" x="119" y="36">1</text>
<circle class="ik" cx="154" cy="38" r="5"/>
<path class="ik" d="M144,54 C144,46 164,46 164,54"/>
<circle class="ik" cx="174" cy="38" r="5"/>
<path class="ik" d="M164,54 C164,46 184,46 184,54"/>
<text class="t" x="188" y="45">Kunder</text>
<text class="s" x="188" y="63">handler og opbevarer</text>
<!-- blå pil ned: handel og aktiver -->
<path class="l" d="M220,76 V126" marker-end="url(#cr-pil)"/>
<!-- gul fast, højre: gebyr pr. handel -->
<path class="g1" d="M333,48 C400,48 400,154 333,154" marker-end="url(#cr-pil-g)"/>
<!-- gul stiplet, venstre: abonnement og staking -->
<path class="g2" d="M107,48 C40,48 40,154 107,154" marker-end="url(#cr-pil-g)"/>
<!-- 2 Coinbase, gul ramme -->
<rect class="k" x="107" y="126" width="226" height="62" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="119" cy="138" r="8"/><text class="nrt" x="119" y="142">2</text>
<!-- platform-ikon: to-vejs pile -->
<path class="ik" d="M150,150 H174 M170,146 L174,150 L170,154"/>
<path class="ik" d="M174,166 H150 M154,162 L150,166 L154,170"/>
<text class="t" x="188" y="152">Coinbase</text>
<text class="s" x="188" y="170">driver platformen</text>
<!-- blå pil til udviklere -->
<path class="l" d="M280,188 V248" marker-end="url(#cr-pil)"/>
<!-- 3 Udsteder (særligt træk: USDC-mønt) -->
<rect class="k" x="24" y="250" width="184" height="56" rx="10"/>
<circle class="nr" cx="36" cy="262" r="8"/><text class="nrt" x="36" y="266">3</text>
<circle class="ik" cx="68" cy="278" r="10"/>
<circle class="ik" cx="68" cy="278" r="4"/>
<text class="t" x="88" y="275">Udsteder</text>
<text class="s" x="88" y="293">udsteder USDC</text>
<!-- gul stiplet op: betaling efter omløb -->
<path class="g2" d="M24,278 C8,278 8,188 107,188" marker-end="url(#cr-pil-g)"/>
<!-- 4 Udviklere -->
<rect class="k" x="232" y="250" width="184" height="56" rx="10"/>
<circle class="nr" cx="244" cy="262" r="8"/><text class="nrt" x="244" y="266">4</text>
<path class="ik" d="M262,270 L254,278 L262,286"/>
<path class="ik" d="M278,270 L286,278 L278,286"/>
<text class="t" x="296" y="275">Udviklere</text>
<text class="s" x="296" y="293">bygger produkter</text>
<!-- forklaring under tegningen, ingen tekst på pile -->
<line x1="70" x2="100" y1="344" y2="344" class="l"/>
<text class="p" x="110" y="348">handel og aktiver, fra kunderne</text>
<line x1="70" x2="100" y1="368" y2="368" class="l"/>
<text class="p" x="110" y="372">værktøjer og netværk, til udviklerne</text>
<line x1="70" x2="100" y1="392" y2="392" class="g1"/>
<text class="pg" x="110" y="396">gebyr pr. handel, fra kunderne</text>
<line x1="70" x2="100" y1="416" y2="416" class="g2"/>
<text class="pg" x="110" y="420">abonnement og staking, fra kunderne</text>
<line x1="70" x2="100" y1="440" y2="440" class="g2"/>
<text class="pg" x="110" y="444">betaling efter omløb, fra udstederen</text>
</svg>
