<svg class="cr-model cr-model-d" viewBox="0 0 440 300" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan tjener GlobalFoundries penge</title>
<desc id="cr-model-d">1. En chipvirksomhed tegner chippen og indgår ofte en aftale over flere år. 2. GlobalFoundries fremstiller chippene på wafers. 3. Wafers bliver samlet og testet hos en anden virksomhed. 4. Chippene ender i telefoner, biler, udstyr og datacentre. Kunden betaler for de leverede wafers og særskilt for ingeniørarbejde, masker og licenser.</desc>
<defs><marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker><marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker></defs>
<style>
.cr-model-d .t{font:600 16px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
.cr-model-d .s{font:400 13px 'DM Sans',sans-serif;fill:#aebbc7;text-anchor:middle}
.cr-model-d .p{font:500 13px 'DM Sans',sans-serif;fill:#c7d3dc;text-anchor:middle}
.cr-model-d .pg{font:600 13px 'DM Sans',sans-serif;fill:#e8d98a;text-anchor:middle}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px 'DM Sans',sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<path class="ld" d="M55,72 C55,30 165,30 165,72" marker-end="url(#cr-pil)"/><text class="p" x="110.0" y="26">aftale over flere år</text>
<rect class="k" x="15" y="74" width="80" height="56" rx="10"/>
<g><circle class="nr" cx="85" cy="83" r="9"/><text class="nrt" x="85" y="87">1</text></g>
<circle class="ik" cx="51" cy="94" r="7"/><path class="ik" d="M37,118 C37,108 65,108 65,118"/>
<text class="t" x="55" y="152">Kunde</text>
<text class="s" x="55" y="169">tegner chippen</text>
<rect class="k" x="125" y="74" width="80" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<g><circle class="nr" cx="195" cy="83" r="9"/><text class="nrt" x="195" y="87">2</text></g>
<path class="ik" d="M146,116 V100 L155,94 V100 L164,94 V100 L173,94 V116 Z M167,94 V86 h5 V96"/>
<text class="t" x="165" y="152">GlobalFoundries</text>
<text class="s" x="165" y="169">laver wafers</text>
<rect class="k" x="235" y="74" width="80" height="56" rx="10"/>
<g><circle class="nr" cx="305" cy="83" r="9"/><text class="nrt" x="305" y="87">3</text></g>
<path class="ik" d="M257,96 L271,88 L285,96 L285,112 L271,120 L257,112 Z M257,96 L271,104 L285,96 M271,104 V120"/>
<text class="t" x="275" y="152">Samling</text>
<text class="s" x="275" y="169">test og pakning</text>
<rect class="k" x="345" y="74" width="80" height="56" rx="10"/>
<g><circle class="nr" cx="415" cy="83" r="9"/><text class="nrt" x="415" y="87">4</text></g>
<rect class="ik" x="372" y="86" width="18" height="32" rx="3"/><path class="ik" d="M378,113h6"/>
<text class="t" x="385" y="152">Produkt</text>
<text class="s" x="385" y="169">telefon, bil,</text>
<text class="s" x="385" y="184">datacenter</text>
<path class="l" d="M97,102 H122" marker-end="url(#cr-pil)"/>
<path class="l" d="M207,102 H232" marker-end="url(#cr-pil)"/>
<path class="l" d="M317,102 H342" marker-end="url(#cr-pil)"/>
<path class="g1" d="M55,194 C55,226 165,226 160,200" marker-end="url(#cr-pil-g)"/><text class="pg" x="250" y="228">betaling for wafers</text>
<path class="g2" d="M40,198 C40,268 165,268 173,200" marker-end="url(#cr-pil-g)"/><text class="pg" x="150" y="290">ingeniørarbejde og licenser</text>
</svg>
