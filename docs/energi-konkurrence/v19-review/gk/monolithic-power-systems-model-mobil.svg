<svg class="cr-model cr-model-m" viewBox="0 0 340 500" role="img" aria-labelledby="cr-model-m-t" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-m-t">Sådan tjener Monolithic Power Systems penge</title>
<defs>
<marker id="cr-pil-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-m .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-m .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-m .pr{text-anchor:middle;font:500 12.5px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-m .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-m .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-m .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-m .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-m .ld{fill:none;stroke:#89aeb4;stroke-width:1.4;stroke-linecap:round}
.cr-model-m .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .g2{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-m .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-m .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<!-- egen procesteknologi tilbage fra MPS (2) til støberi (1), venstre bue, tekst lodret og fri af pilen -->
<path class="ld" d="M54,164 C16,164 16,48 54,48" marker-end="url(#cr-pil-m)"/>
<text class="pr" transform="translate(14,106) rotate(-90)">egen procesteknologi</text>
<rect class="k" x="60" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="34" r="9"/><text class="nrt" x="74" y="38">1</text>
<path class="ik" d="M96,62 V42 H104 V36 H110 V42 H126 V62 Z M100,50h6v6h-6z M114,50h6v6h-6z"/>
<text class="t" x="140" y="44">Støberi</text><text class="s" x="140" y="62">laver skiverne</text>
<path class="l" d="M100,78 V126" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="148" y="108">færdige chips</text>
<rect class="k" x="60" y="130" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="74" cy="144" r="9"/><text class="nrt" x="74" y="148">2</text>
<rect class="ik" x="90" y="144" width="24" height="24" rx="3"/>
<path class="ik" d="M96,150h12M96,156h12M96,162h12"/>
<text class="t" x="140" y="154">MPS</text><text class="s" x="140" y="172">designer chipene</text>
<path class="l" d="M100,188 V236" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="148" y="218">leverer chips</text>
<rect class="k" x="60" y="240" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="254" r="9"/><text class="nrt" x="74" y="258">3</text>
<path class="ik" d="M88,250 h28 v16 h-10 v10 h-18 z"/>
<text class="t" x="140" y="264">Distributør</text><text class="s" x="140" y="282">sælger videre</text>
<path class="l" d="M100,298 V346" marker-end="url(#cr-pil-m)"/>
<text class="pr" x="148" y="328">sælger videre</text>
<rect class="k" x="60" y="350" width="226" height="56" rx="10"/>
<circle class="nr" cx="74" cy="364" r="9"/><text class="nrt" x="74" y="368">4</text>
<rect class="ik" x="90" y="366" width="28" height="18" rx="2"/><path class="ik" d="M96,374h16"/>
<text class="t" x="140" y="375">Kunde</text><text class="s" x="140" y="393">bygger elektronik</text>
<!-- direkte salg: MPS til kunde, højre ydre bue, uden tekst på buen -->
<path class="ld" d="M290,158 C338,158 338,378 290,378" marker-end="url(#cr-pil-m)"/>
<!-- gule betalinger til MPS, højre indre buer, tekst i forklaingen under -->
<path class="g1" d="M290,268 C318,268 318,164 290,164" marker-end="url(#cr-pil-gm)"/>
<path class="g2" d="M290,384 C330,384 330,150 290,150" marker-end="url(#cr-pil-gm)"/>
<line x1="24" x2="54" y1="436" y2="436" class="ld"/>
<text class="pg" x="64" y="440">direkte salg, til kunden</text>
<line x1="24" x2="54" y1="458" y2="458" class="g1"/>
<text class="pg" x="64" y="462">betaler for chips, fra distributør</text>
<line x1="24" x2="54" y1="480" y2="480" class="g2"/>
<text class="pg" x="64" y="484">betaler direkte, fra kunden</text>
</svg>
