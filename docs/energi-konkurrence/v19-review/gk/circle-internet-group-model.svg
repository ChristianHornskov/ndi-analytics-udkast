<svg class="cr-model cr-model-d" viewBox="0 0 440 500" role="img" aria-labelledby="cr-model-t cr-model-d" xmlns="http://www.w3.org/2000/svg">
<title id="cr-model-t">Sådan udsteder Circle USDC og EURC</title>
<desc id="cr-model-d">1. En virksomhed eller institution får udstedt USDC eller EURC hos Circle. 2. Det samme beløb går i reserver til fordel for indehaverne. 3. Reserverne står i banker, korte statsobligationer og en pengemarkedsfond. 4. Circle beholder renter og udbytte af reserverne som reserveindkomst. En del af indkomsten betales videre til distributører. Kunder betaler også for enkelte tjenester.</desc>
<defs>
<marker id="cr-pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#89aeb4"/></marker>
<marker id="cr-pil-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e8d98a"/></marker>
</defs>
<style>
.cr-model-d .t{text-anchor:start;font:600 16px "DM Sans",sans-serif;fill:#e6e8ed}
.cr-model-d .s{text-anchor:start;font:400 13.5px "DM Sans",sans-serif;fill:#aebbc7}
.cr-model-d .pg{text-anchor:start;font:600 13px "DM Sans",sans-serif;fill:#e8d98a}
.cr-model-d .p{text-anchor:start;font:500 13px "DM Sans",sans-serif;fill:#c7d3dc}
.cr-model-d .k{fill:#0d1921;stroke:#3a4658;stroke-width:1.2}
.cr-model-d .ik{fill:none;stroke:#89aeb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-model-d .l{fill:none;stroke:#89aeb4;stroke-width:1.6}
.cr-model-d .g1{fill:none;stroke:#e8d98a;stroke-width:1.8}
.cr-model-d .g2{fill:none;stroke:#e8d98a;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.cr-model-d .nr{fill:#050a0f;stroke:#89aeb4;stroke-width:1}
.cr-model-d .nrt{font:600 12px "DM Sans",sans-serif;fill:#e6e8ed;text-anchor:middle}
</style>
<rect class="k" x="110" y="20" width="226" height="56" rx="10"/>
<circle class="nr" cx="122" cy="32" r="8"/><text class="nrt" x="122" y="36">1</text>
<circle class="ik" cx="150" cy="40" r="7"/><path class="ik" d="M136,64 C136,54 164,54 164,64"/>
<text class="t" x="184" y="45">Kunde</text><text class="s" x="184" y="63">får mønten</text>
<path class="l" d="M150,78 V126" marker-end="url(#cr-pil)"/>
<rect class="k" x="110" y="130" width="226" height="56" rx="10" style="stroke:#e8d98a;stroke-width:1.6"/>
<circle class="nr" cx="122" cy="142" r="8"/><text class="nrt" x="122" y="146">2</text>
<circle class="ik" cx="150" cy="158" r="12"/><circle class="ik" cx="150" cy="158" r="6"/>
<text class="t" x="184" y="155">Circle</text><text class="s" x="184" y="173">udsteder mønten</text>
<path class="l" d="M150,188 V236" marker-end="url(#cr-pil)"/>
<rect class="k" x="110" y="240" width="226" height="56" rx="10"/>
<circle class="nr" cx="122" cy="252" r="8"/><text class="nrt" x="122" y="256">3</text>
<rect class="ik" x="138" y="248" width="24" height="22" rx="3"/><path class="ik" d="M144,248 V244 a6,6 0 0 1 12,0 V248"/>
<text class="t" x="184" y="265">Reserve</text><text class="s" x="184" y="283">holdes 1 til 1</text>
<rect class="k" x="110" y="350" width="226" height="56" rx="10"/>
<circle class="nr" cx="122" cy="362" r="8"/><text class="nrt" x="122" y="366">4</text>
<circle class="ik" cx="144" cy="370" r="5"/><circle class="ik" cx="164" cy="370" r="5"/><circle class="ik" cx="154" cy="384" r="5"/>
<path class="ik" d="M144,370 L164,370 M144,370 L154,384 M164,370 L154,384"/>
<text class="t" x="184" y="375">Distributør</text><text class="s" x="184" y="393">udbreder mønten</text>
<path class="g1" d="M340,262 C368,262 368,164 340,164" marker-end="url(#cr-pil-g)"/>
<path class="g2" d="M340,48 C368,48 368,164 340,164" marker-end="url(#cr-pil-g)"/>
<path class="l" d="M340,164 C384,164 384,378 340,378" marker-end="url(#cr-pil)"/>
<line x1="74" x2="104" y1="432" y2="432" class="g1"/>
<text class="pg" x="114" y="436">renter og udbytte, fra reserven</text>
<line x1="74" x2="104" y1="456" y2="456" class="g2"/>
<text class="pg" x="114" y="460">gebyr for tjenester, fra kunden</text>
<line x1="74" x2="104" y1="480" y2="480" class="l"/>
<text class="p" x="114" y="484">andel af indkomst, til distributør</text>
</svg>
